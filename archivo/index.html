<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Debates guardados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1c1b19;--ink-2:#55524c;--ink-3:#8a867e;--line:#e2dfd8;--accent:#c8102e;--ok:#1f7a4d;--ok-soft:#e3f3ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#1b1b1b;--ink:#f2f0ec;--ink-2:#bdb8af;--ink-3:#8b867d;--line:#2f2f2f;--accent:#ff4d5e;--ok:#4cc38a;--ok-soft:#173326}}
:root[data-theme="dark"]{--bg:#121212;--panel:#1b1b1b;--ink:#f2f0ec;--ink-2:#bdb8af;--ink-3:#8b867d;--line:#2f2f2f;--accent:#ff4d5e;--ok:#4cc38a;--ok-soft:#173326}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 16px}
.eyebrow{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:32px;letter-spacing:-.02em;margin:12px 0 6px}
p.sub{color:var(--ink-2);margin:0 0 24px}
a.item{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
a.item:hover{border-color:var(--accent)}
.t{font-weight:600}
.m{font-size:13px;color:var(--ink-3);margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--ok-soft);color:var(--ok);margin-left:6px}
.vacio{color:var(--ink-3)}
a.back{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Mesa de debate · Reynasa / TDR</div>
  <h1>Debates guardados</h1>
  <p class="sub">Mesas que se han querido conservar. La <a class="back" href="../">última mesa</a> se sustituye en cada debate nuevo.</p>
  <div id="lista"><p class="vacio">Cargando…</p></div>
</div>
<script>
fetch('indice.json', {cache: 'no-store'}).then(r => r.ok ? r.json() : []).catch(() => []).then(lista => {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('lista').innerHTML = lista.length
    ? lista.map(d => `<a class="item" href="${encodeURIComponent(d.slug)}/"><div class="t">${esc(d.titulo)}</div><div class="m">${esc(d.fecha)}<span class="tag">${esc(d.veredicto)}</span></div></a>`).join('')
    : '<p class="vacio">Todavía no hay debates guardados.</p>';
});
</script>
</body>
</html>
