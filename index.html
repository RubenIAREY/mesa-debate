  document.getElementById('cabecera').innerHTML = `

          ${v.mesa ? `<span class="chip">Mesa: ${esc(v.mesa)}</span>` : ''}

        </div>

      ${v.etiqueta ? `<div class="verdict"><div class="lbl">Veredicto</div>
        <span class="tag ${esc(tagClase)}">${esc(v.etiqueta)}</span>
        <div class="score">${esc(v.puntuacion)}<span style="font-size:16px;color:var(--ink-3)"> / 10</span></div>
        <div class="rec">${esc(v.recomendada)}</div></div>` : ''}
    </div>
    ${D.anonimizado ? `<p class="anon">${esc(D.nota)}</p>` : ''}`;

  // Navegación
  const pasos = [['sala','Sala'],['mesa','La mesa'],['evolucion','Puntuaciones']].concat(D.etapas.map(e => [e.id, e.titulo.split(' · ')[0]]));
  document.getElementById('pasos').innerHTML = pasos.map(([id,t]) => `<a href="#${id}">${esc(t)}</a>`).join('');

  let h = '';

  // Sala: los consejeros en semicírculo y el panel que reproduce el debate
  const n = D.consejeros.length, centro = (n - 1) / 2;
  h += `<section id="sala" class="sala"><div class="stage"><div class="arc" id="arco">` +
    D.consejeros.map((c, i) => {
      const d = centro ? Math.abs(i - centro) / centro : 0;
      const cara = c.retrato
        ? `<div class="bust" data-shape="base">${['base','mid','open','blink'].map(f => `<img class="${f}" src="${retrato(c.slug, f)}" alt="" draggable="false">`).join('')}</div>`
        : `<div class="ini"><span style="background:${color(c.slug)}">${inic(c.slug, c.nombre)}</span></div>`;
      return `<div class="st" id="st-${c.slug}" data-slug="${c.slug}" style="--y:${Math.round((1 - d * d) * -34)}px;--s:${(0.9 + d * 0.1).toFixed(2)}" title="${esc(c.nombre)} · ${esc(c.pilar || '')}">
        <div class="bubble">···</div>${cara}<div class="plate">${esc(c.nombre)}</div></div>`;
    }).join('') +
    `</div><div class="board"><div class="top"><span class="d"></span><span id="pRonda">La sala</span><span class="sp" id="pVel"></span></div>
      <h3 id="pTitulo">Pulsa reproducir para ver el debate</h3><p class="line" id="pLinea">${esc(D.decision.replace(/\*\*/g, ''))}</p>
      <div class="prog"><i id="pProg"></i></div>
      <div class="ctrl"><button class="main" id="bPlay">▶ Reproducir</button><button id="bSig">Siguiente ⏭</button><span class="gap"></span>
        ${rondas.map((r, i) => `<button data-salto="${i}">R${i + 1}</button>`).join('')}${v.etiqueta ? '<button data-salto="v">Veredicto</button>' : ''}<button id="bVel">x1</button></div>
    </div></div><aside class="feed"><div class="t">Lo que se ha dicho</div><ol id="feed"><li class="vacio">Aquí aparecerá cada intervención según hablen.</li></ol></aside></section>`;

  // La mesa: quién se sienta y cómo cambió su preferida
  h += `<section id="mesa"><h2>La mesa</h2><p class="sub">Quién se sienta, cuánto pesa su voto y qué opción prefirió en cada ronda.</p><div class="seats">`;
  for (const c of D.consejeros) {
    const prefs = rondas.map(r => (r.tarjetas.find(t => t.slug === c.slug) || {}).preferida || '–');
    const final = v.recomendada ? v.recomendada.trim()[0] : null;
    const cambio = new Set(prefs.filter(p => p !== '–')).size > 1;
    h += `<div class="seat">${av(c.slug, c.nombre)}<div class="name">${esc(c.nombre)}</div>
      <div class="w">Peso ${c.peso} de 3</div>
      <div class="traj">${prefs.map((p,i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="pill ${p===final?'win':''}" title="Ronda ${i+1}">${esc(p)}</span>`).join('')}</div>
      ${cambio ? '<div class="moved">Cambió de opción</div>' : ''}</div>`;
  }
  h += `</div></section>`;

  // Evolución de la puntuación ponderada
  h += `<section id="evolucion"><h2>Cómo evolucionó la puntuación</h2><p class="sub">Media ponderada por el peso de cada consejero, de 0 a 10, al final de cada ronda.</p><div class="evo"><table><thead><tr><th>Opción</th><th>Qué es</th>${rondas.map(r => `<th>${esc(r.titulo.split(' · ')[0])}</th>`).join('')}</tr></thead><tbody>`;
  for (const o of (D.opciones||[])) {
    h += `<tr><td class="optname">${esc(o.letra)}. ${esc(o.nombre)}</td><td style="color:var(--ink-2);font-size:13px">${inline(o.desc)}</td>`;
    for (const r of rondas) {
      const val = (r.ponderadas||{})[o.letra];
      const max = Math.max(...Object.values(r.ponderadas||{0:0}));
      h += `<td>${val != null ? `<div class="bar ${val===max?'top':''}"><i style="width:${val*8}px"></i><span>${String(val).replace('.',',')}</span></div>` : '–'}</td>`;
    }
    h += `</tr>`;
  }
  h += `</tbody></table></div></section>`;

  // Etapas
  for (const e of D.etapas) {
    h += `<section id="${e.id}"><h2>${esc(e.titulo)}</h2><p class="sub">${esc(e.explicacion)} <b>· ${esc(e.hora)}</b></p>`;
    if (e.tipo === 'ronda') {
      h += `<div class="cards">`;
      for (const t of e.tarjetas) {
        const c = color(t.slug);
        const letras = Object.keys(t.puntuaciones).length ? 'ABCDE'.split('').filter(l => l in t.puntuaciones) : [];
        h += `<article class="card" id="c-${e.id}-${t.slug}" style="--c:${c}">
          <div class="head">${av(t.slug, t.nombre)}<div><div class="n">${esc(t.nombre)}</div><div class="w">Peso ${pesos[t.slug] ?? '–'}</div></div></div>
          ${t.postura ? `<p class="postura">${inline(t.postura)}</p>` : ''}
          ${t.apoyo != null ? `<p class="extra"><b>Apoyo a la resolución: ${String(t.apoyo).replace('.',',')}/10</b></p>` : ''}
          ${letras.length ? `<div class="scores">${letras.map(l => `<div class="sc ${l===t.preferida?'pref':''}" title="${esc((opcion(l)||{}).nombre||'')}">
              <div class="col"><i style="height:${t.puntuaciones[l]*10}%"></i></div><div class="v">${String(t.puntuaciones[l]).replace('.0','')}</div><div class="l">${l}</div></div>`).join('')}</div>` : ''}
          <div class="meta">
            ${t.preferida ? `<span>Prefiere ${esc(t.preferida)}</span>` : ''}
            ${t.confianza != null ? `<span>Confianza ${t.confianza}/5</span>` : ''}
            ${t.nota_area != null ? `<span>Su área: ${t.nota_area}/10</span>` : ''}
            ${t.ruina ? `<span class="${/^(posible|probable)/i.test(t.ruina)?'bad':''}">Ruina: ${esc(t.ruina)}</span>` : ''}
          </div>
          ${t.movido ? `<p class="extra"><b>Qué le movió:</b> ${inline(t.movido.length > 260 ? t.movido.slice(0,260) + '…' : t.movido)}</p>` : ''}
          ${t.enmienda && !/^ninguna/i.test(t.enmienda) ? `<p class="extra"><b>Enmienda:</b> ${inline(t.enmienda.length > 260 ? t.enmienda.slice(0,260) + '…' : t.enmienda)}</p>` : ''}
          <details><summary>Ver la tarjeta completa</summary><div class="md">${md(t.md)}</div></details>
        </article>`;
      }
      h += `</div>`;
      if (e.presidente_md) h += `<div class="chair"><div class="t">El Presidente</div><div class="md">${md(e.presidente_md)}</div></div>`;
    } else {
      h += `<div class="doc md">${md(e.md)}</div>`;
    }
    h += `</section>`;
  }
  document.getElementById('contenido').innerHTML = h;

  document.getElementById('pie').innerHTML = `Los consejeros son simulaciones construidas con la obra pública de cada persona (o puestos de trabajo inventados): no son opiniones reales ni están respaldadas por esas personas. Cerebros y caras del Consejo: <a href="https://github.com/nateherkai/roast-room">roast-room</a> (MIT).<br>
    Generado el ${esc(D.generado)} · <a href="${esc(D.url)}">Última mesa</a> · <a href="${esc(D.url)}archivo/">Debates guardados</a>`;

  // El contenido se pinta con JS: si la URL trae #seccion, saltar a ella al terminar
  if (location.hash) setTimeout(() => { const s = document.getElementById(location.hash.slice(1)); if (s) s.scrollIntoView(); }, 80);

  // Paso activo en la navegación
  const enlaces = [...document.querySelectorAll('nav.steps a')];
  const obs = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) enlaces.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id));
  }), {rootMargin: '-40% 0px -55% 0px'});
  document.querySelectorAll('main section').forEach(s => obs.observe(s));

  // ---------- Reproductor de la sala ----------
  const $ = id => document.getElementById(id);
  const limpio = s => String(s || '').replace(/\*\*|`|\[|\]/g, '').replace(/\s+/g, ' ').trim();
  const corta = (s, max) => s.length <= max ? s : s.slice(0, s.lastIndexOf(' ', max)) + '…';
  const lineaDe = (r, t) => {
    if (t.apoyo != null) {
      const enm = t.enmienda && !/^ninguna/i.test(t.enmienda) ? ' Mi enmienda: ' + limpio(t.enmienda) : ' Sin enmiendas.';
      return corta(`Apoyo la resolución con un ${String(t.apoyo).replace('.0', '')} sobre 10.` + enm, 300);
    }
    let txt = limpio(t.postura);
    if (t.movido && !/^nada/i.test(limpio(t.movido)) && r.id !== 'ronda-1') txt += ' Lo que me ha movido: ' + limpio(t.movido);
    return corta(txt, 300);
  };
  const turnos = [];
  rondas.forEach((r, ri) => {
    turnos.push({tipo: 'ronda', ri, r});
    r.tarjetas.forEach(t => turnos.push({tipo: 'habla', ri, r, t, texto: lineaDe(r, t)}));
  });
  if (v.etiqueta) turnos.push({tipo: 'veredicto'});
  if (D.estado === 'en curso') turnos.push({tipo: 'espera'});

  let idx = 0, tok = 0, pausa = true, vel = 1, saltar = false;
  const asientos = [...document.querySelectorAll('.st')];
  const arco = $('arco');
  const forma = (slug, f) => { const b = document.querySelector(`#st-${slug} .bust`); if (b) b.dataset.shape = f; };
  const estado = (slug, cls) => asientos.forEach(a => {

  const dormir = ms => new Promise(res => {

  const alFeed = html => { const f = $('feed'); const vacio = f.querySelector('.vacio'); if (vacio) vacio.remove(); f.insertAdjacentHTML('afterbegin', html); };
  const progreso = () => { $('pProg').style.width = (100 * idx / Math.max(1, turnos.length)) + '%'; };
  const marcarSaltos = ri => document.querySelectorAll('[data-salto]').forEach(b => b.classList.toggle('on', String(b.dataset.salto) === String(ri)));

  async function hablar(turno) {
    const {t, r, texto, ri} = turno; const t0 = tok;
    estado(t.slug, 'speaking'); arco.classList.add('focus');
    // los que aún no han hablado en esta ronda siguen "pensando"
    const yaHablaron = new Set(r.tarjetas.slice(0, r.tarjetas.indexOf(t) + 1).map(x => x.slug));
    asientos.forEach(a => a.classList.toggle('thinking', !yaHablaron.has(a.dataset.slug) && r.tarjetas.some(x => x.slug === a.dataset.slug)));
    $('pRonda').textContent = `Ronda ${ri + 1} de ${rondas.length}`;
    $('pTitulo').textContent = `${t.nombre}${t.preferida ? ' · prefiere ' + t.preferida : ''}`;
    const linea = $('pLinea'); linea.textContent = '';
    for (let i = 0; i < texto.length; i++) {
      if (t0 !== tok) return;
      if (saltar) { linea.textContent = texto; break; }
      while (pausa && t0 === tok) await new Promise(res => setTimeout(res, 120));
      const ch = texto[i].toLowerCase();
      linea.textContent += texto[i];
      const f = 'aáeéiíà'.includes(ch) ? 'open' : 'oóuúwy'.includes(ch) ? 'mid' : 'mbpfv .,;:'.includes(ch) ? 'base' : null;
      if (f) forma(t.slug, f);
      await new Promise(res => setTimeout(res, (/[.,;:]/.test(ch) ? 90 : 24) / vel));
    }
    forma(t.slug, 'base'); saltar = false;
    alFeed(`<li data-ir="c-${r.id}-${t.slug}">${av(t.slug, t.nombre)}<div><span class="n">${esc(t.nombre)}</span><span class="r">R${ri + 1}</span><div>${esc(corta(texto, 170))}</div></div></li>`);
    await dormir(1300);
  }

  async function jugar(turno) {
    const t0 = tok;
    if (turno.tipo === 'ronda') {
      arco.classList.remove('focus'); estado(null, 'thinking-all'); marcarSaltos(turno.ri);
      $('pRonda').textContent = `Ronda ${turno.ri + 1} de ${rondas.length}`;
      $('pTitulo').textContent = turno.r.titulo.split(' · ')[1] || turno.r.titulo;
      $('pLinea').textContent = turno.r.explicacion;
      alFeed(`<li class="sys">${esc(turno.r.titulo)}</li>`);
      await dormir(2400);
    } else if (turno.tipo === 'habla') {
      await hablar(turno);
    } else if (turno.tipo === 'veredicto') {
      arco.classList.remove('focus'); estado(null, 'none'); marcarSaltos('v');
      $('pRonda').textContent = 'Veredicto';
      $('pTitulo').textContent = `${v.etiqueta} · ${v.puntuacion} / 10`;
      $('pLinea').innerHTML = `Opción recomendada: <b>${esc(v.recomendada)}</b>. El detalle, las cuentas y el texto final están abajo, en «Veredicto».`;
      alFeed(`<li class="sys">Veredicto: ${esc(v.etiqueta)} · ${esc(v.puntuacion)} / 10</li>`);
    } else if (turno.tipo === 'espera') {
      estado(null, 'thinking-all'); arco.classList.remove('focus');
      $('pRonda').textContent = 'En curso';
      $('pTitulo').textContent = 'Los consejeros están escribiendo la siguiente ronda';
      $('pLinea').textContent = 'La página se actualiza sola cada minuto.';
    }
    if (t0 === tok) { idx++; progreso(); }
  }

  async function bucle() {
    const t0 = tok;
    while (idx < turnos.length && t0 === tok) {
      if (pausa) { await new Promise(res => setTimeout(res, 150)); continue; }
      await jugar(turnos[idx]);
    }
    if (idx >= turnos.length && t0 === tok) { pausa = true; $('bPlay').textContent = '↺ Repetir'; }
  }
  const reiniciarDesde = i => { tok++; idx = i; saltar = false; asientos.forEach(a => forma(a.dataset.slug, 'base')); progreso(); bucle(); };

  $('bPlay').addEventListener('click', () => {
    if (idx >= turnos.length) { $('feed').innerHTML = ''; pausa = false; $('bPlay').textContent = '⏸ Pausa'; return reiniciarDesde(0); }
    pausa = !pausa; $('bPlay').textContent = pausa ? '▶ Seguir' : '⏸ Pausa';
  });
  $('bSig').addEventListener('click', () => { saltar = true; if (pausa) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } });
  $('bVel').addEventListener('click', () => { vel = vel === 1 ? 2 : vel === 2 ? 3 : 1; $('bVel').textContent = 'x' + vel; });
  document.querySelectorAll('[data-salto]').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.salto;
    const i = s === 'v' ? turnos.findIndex(x => x.tipo === 'veredicto') : turnos.findIndex(x => x.tipo === 'ronda' && x.ri === Number(s));
    pausa = false; $('bPlay').textContent = '⏸ Pausa'; reiniciarDesde(Math.max(0, i));
  }));
  $('feed').addEventListener('click', ev => { const li = ev.target.closest('[data-ir]'); if (!li) return; const c = $(li.dataset.ir); if (c) { c.scrollIntoView({behavior: 'smooth', block: 'center'}); const d = c.querySelector('details'); if (d) d.open = true; } });
  asientos.forEach(a => a.addEventListener('click', () => {
    const r = rondas[Math.max(0, (turnos[Math.min(idx, turnos.length - 1)] || {}).ri ?? 0)];
    const c = r && $(`c-${r.id}-${a.dataset.slug}`); if (c) c.scrollIntoView({behavior: 'smooth', block: 'center'});
  }));

  // Parpadeo de todos para que la sala parezca viva
  asientos.forEach((a, i) => {
    const b = a.querySelector('.bust'); if (!b) return;
    const parpadea = () => { if (b.dataset.shape === 'base') { b.dataset.shape = 'blink'; setTimeout(() => { if (b.dataset.shape === 'blink') b.dataset.shape = 'base'; }, 130); } setTimeout(parpadea, 2400 + Math.random() * 4200); };
    setTimeout(parpadea, 600 + i * 530);
  });

  progreso();
  bucle();
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!quieto && !location.hash) setTimeout(() => { if (pausa && idx === 0) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } }, 1500);

  // Mientras el debate está en curso, la página se recarga sola cada minuto
  if (D.estado === 'en curso') setTimeout(() => location.reload(), 60000);
})();
</script>
</body>
</html>
