y una carga que depende de una persona"}, {"slug": "buffett", "nombre": "Warren Buffett", "pilar": "Dinero y capital", "retrato": true, "peso": 2, "motivo": "Hay 0,8 M€ inmovilizados y riesgo de reputación para Rubén si una cifra está mal"}, {"slug": "graham", "nombre": "Paul Graham", "pilar": "Producto y crecimiento", "retrato": true, "peso": 2, "motivo": "Es una v1 de producto para validar un enfoque: qué quieren de verdad los usuarios y qué es lo mínimo que hay que arreglar"}, {"slug": "martell", "nombre": "Dan Martell", "pilar": "Personas y tiempo", "retrato": true, "peso": 2, "motivo": "El tiempo de D. y de Rubén: quién hace cada arreglo y cuánto cuesta en agenda"}, {"slug": "hormozi", "nombre": "Alex Hormozi", "pilar": "Oferta, precio y venta", "retrato": true, "peso": 1, "motivo": "Cómo \"vender\" el feedback para que D. diga que sí y cuente con Rubén"}, {"slug": "garyvee", "nombre": "Gary Vee", "pilar": "Marketing y atención", "retrato": true, "peso": 1, "motivo": "Cómo captar la atención de un superior ocupado y dar valor antes de pedir"}], "etapas": [{"id": "brief", "tipo": "brief", "titulo": "Planteamiento", "explicacion": "Lo que se le dio a la mesa: la decisión, el contexto, las opciones y el peso de cada consejero.", "hora": "13/10/2026 16:01", "md": "\n## La decisión\n¿Qué feedback enviar a D. (responsable de la herramienta) (superior / dirección) sobre su herramienta **Surtidos X**, y cómo enviárselo?\n\n## El contexto\n- D. dio acceso a Rubén (12-oct-2026) a **Surtidos X**: web de planificación de demanda y surtido por centro y lineal. Es una **primera versión** \"para validar el enfoque con datos reales\"; pide feedback: \"qué te parece, qué echas en falta o qué cambiarías\". Dice que puede ponerse a punto con IT y los requisitos de cada área.\n- D. tiene Claude y Claude Code y ha construido la herramienta con un repositorio y agentes (supuesto basado en lo que dice Rubén).\n- Rubén revisó todas las secciones leyendo la pantalla (no contrastó con el ERP ni con contabilidad). Hallazgos:\n  1. **Almacén central (código 20)**: 6,0 M€ de los 11,8 M€ de stock de la red (3,2 M€ neumáticos). No sale en la lista de Almacenes (esa suma 4,6 M€), sin cobertura, y fuera del \"exceso\" del Resumen (2,1 M€).\n  2. **Balizas V16**: 41.668 uds. (0,85 M€) con 2.013 días de cobertura, clasificada A y en \"Le falta\"; la primera propuesta de traspaso son 373 balizas a Grúas-G (7.639 €), centro con stock negativo. La ref. V-2 (5.956 uds. en central) no está excluida de la venta como las otras V16.\n  3. **Centros inactivos** (Centro-A, Centro-B, Centro-C, Centro-D, Centro-E, Centro-F) encabezan \"Le falta\". No hay marca de centro activo.\n  4. **Estacionalidad con un solo año** (histórico desde 06/10/2025): índices muy dispares en neumáticos (×0,58 a ×2,06) y cadenas de nieve como \"stock muerto\" en octubre.\n  5. **Carga diaria**: falló 11, 12 y 13-oct (Metabase 403/522, requiere login manual); base de datos 408,7 de 500 MB.\n  6. **Datos que no cuadran**: stock negativo (Lunas −49.045 €), stock muerto mayor que el stock (Lunas-L), cobertura ∞ con ventas, venta 12M mezclada con mano de obra y promociones (~24 M€ de 39,5 M€ no es producto almacenable).\n  7. **Faltan**: curva de estacionalidad mensual por categoría, nivel de lineal (Cliente-H vacío), priorización por € (8.140 \"Le falta\", 10.265 traspasos, 141.120 líneas de cálculo), permisos y trazabilidad (cualquiera cambia Parámetros).\n  - Lo bueno: cada pantalla explica su cálculo, se pueden excluir eventos, hay detalle por almacén y referencia, exportación a Excel, pantalla de estado de datos.\n- Hay un borrador de correo largo con todo lo anterior, ya redactado.\n\n## Recursos y plazo\nSolo tiempo de Rubén y de Claude para redactar. Plazo: responder esta semana (D. escribió el 12-oct).\n\n## Qué sería un éxito (Rubén)\nAportar valor a D. para que pueda **presentarlo mejor**, no tumbarlo ni frenarlo; que cuente con Rubén en el futuro para esto y más; y que la misma idea sirva también para Reynasa.\n\n## Hacia dónde se inclina Rubén\nMandar el feedback **completo**, porque D. tiene Claude Code y sus agentes podrán **verificar en el repositorio** si lo dicho es cierto; si lo confirman, eso le da más valor. Quiere incluir en el correo la recomendación de pasar el feedback a sus agentes y que le propongan cambios.\n\n## Opciones\n- **A. Completo + verificación**: correo con todos los hallazgos y cifras, recomendando a D. que lo pase a sus agentes de Claude Code para verificarlo (la idea de Rubén).\n- **B. Lo grave + anexo**: correo con 3–5 problemas que bloquean el uso y un anexo con el resto; también sugiere la verificación con agentes.\n- **C. Reunión primero**: correo corto con 3 titulares y proponer verlo juntos.\n- **D. Piloto acotado**: proponer usarla solo en una zona o familia con condiciones antes de ampliar, adjuntando los hallazgos.\n- **E. No hacer nada de momento**: contestar solo con un \"gracias, lo estoy revisando\" y esperar.\n\n\n## Mesa\nEl Consejo (modo completo). Publicación: anonimizada.\n\n## Pesos\n| Consejero | Peso | Motivo |\n|---|---|---|\n| bezos | 3 | Es una decisión de cómo tratar al \"cliente\" (D., superior) y de reversibilidad: cómo entregar algo incómodo sin dañar la relación |\n| wickman | 3 | Casi todos los hallazgos son de operaciones y datos: quién es dueño de qué, procesos, números que no cuadran y una carga que depende de una persona |\n| buffett | 2 | Hay 0,8 M€ inmovilizados y riesgo de reputación para Rubén si una cifra está mal |\n| graham | 2 | Es una v1 de producto para validar un enfoque: qué quieren de verdad los usuarios y qué es lo mínimo que hay que arreglar |\n| martell | 2 | El tiempo de D. y de Rubén: quién hace cada arreglo y cuánto cuesta en agenda |\n| hormozi | 1 | Cómo \"vender\" el feedback para que D. diga que sí y cuente con Rubén |\n| garyvee | 1 | Cómo captar la atención de un superior ocupado y dar valor antes de pedir |\n"}, {"id": "ronda-1", "tipo": "ronda", "titulo": "Ronda 1 · Posiciones iniciales", "explicacion": "Cada consejero opina por separado, sin ver lo que dicen los demás.", "hora": "13/10/2026 16:06", "tarjetas": [{"slug": "bezos", "nombre": "Jeff Bezos", "postura": "Elijo B. Una página con lo que bloquea el uso, medido en euros, y el resto en anexo marcado \"a verificar\". Además, pido que los agentes de D. lo comprueben.", "puntuaciones": {"A": 7.0, "B": 9.0, "C": 6.0, "D": 5.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Elijo B. Una página con lo que bloquea el uso, medido en euros, y el resto en anexo marcado \"a verificar\". Además, pido que los agentes de D. lo comprueben.\n\nPUNTUACIONES: A=7, B=9, C=6, D=5, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **La puerta.** El contenido es de dos sentidos: un segundo correo corrige una cifra. Lo que no se deshace es la primera impresión que D. se lleva de tu criterio. Esa es una falsa puerta de dos sentidos. \"Type 2 decisions can and should be made quickly by high judgment individuals or small groups.\" (S063) Decide esta semana, sin esperar al ERP, pero con cada cifra etiquetada. Tus cuentas deben cuadrar antes de salir: 11,8 − 6,0 (central) − 4,6 (lista de Almacenes) deja 1,2 M€ sin explicar (supuesto: otra partida que no has anotado, o una lectura de pantalla). Si D. lo ve antes que tú, la crítica se vuelve contra ti. Mi lente de diez años pesa poco aquí, porque casi todo es de dos sentidos y de agenda de una semana. Lo que sí aplica es la reversibilidad de la relación.\n- **El cliente, hacia atrás.** Dentro de diez años D. seguirá queriendo una herramienta cuyas cifras nadie le tumbe en una sala. El feedback le sirve si va ordenado por euros, no por volumen. En la cabecera pondría tres cosas.\n  - La central pesa 6,0 de 11,8 M€, un 50,7 % del stock, y queda fuera del \"exceso\" de 2,1 M€ que presenta el Resumen.\n  - V16 son 0,85 M€ con 2.013 días de cobertura (5,5 años), clasificada \"Le falta\", y propone mover 373 uds (7.639 €) a un centro con stock negativo. Con un 8 % de coste de capital (supuesto) son unos 68 k€ al año solo por tenerlas paradas.\n  - 24 de 39,5 M€ de venta (61 %) no es producto almacenable. Si la cobertura usa esa venta (supuesto), queda subestimada unas 2,5 veces y empuja a \"Le falta\". Los centros inactivos encabezan esa lista.\n\n  El resto va al anexo. \"The memo should be like angels singing up from high. It's so clear and beautiful. And then the meeting could be messy.\" (S001) Con A, D. hace el triaje que te toca hacer a ti.\n- **La verificación barata.** A los agentes de D. les cuesta horas, así que no discutas con él: que la hagan. Tu idea es buena y la mantengo, con un ajuste. Que cada hallazgo vuelva con la consulta o la línea de código que lo prueba, no con un \"confirmado\". \"When the data and the anecdotes disagree, the anecdotes are usually right.\" (S045) Tus anécdotas son la prueba más fuerte: balizas a un centro en negativo y centros cerrados arriba. Empieza por ellas. Abre concediendo lo bueno (cada pantalla explica su cálculo, hay exclusión de eventos, hay estado de datos). Es un buen experimento v1, y falla en operación que ya conocéis (carga, cuadre), no en la idea. \"Being wrong may be less costly than you think, whereas being slow is going to be expensive for sure.\" (S064) Cierra ofreciendo 30 minutos para ver juntos lo que devuelvan. Esa es la C, pero como segundo paso y no como sustituto del escrito.\n\nRIESGO PRINCIPAL: Que una cifra de la cabecera esté mal leída en pantalla y D., o sus agentes, la refuten, y el mensaje que quede sea \"Rubén no entendió la herramienta\".\n\nRIESGO DE RUINA en la preferida: no. El peor caso es una cifra equivocada, que cuesta credibilidad y se corrige con un segundo correo. Lo único cercano a un solo sentido es tu credibilidad con D., y las condiciones la protegen.\n\nCONDICIONES:\n- Antes de enviar, dedica unas 2 horas (supuesto) a cuadrar las 3 cifras de cabecera, incluida la diferencia de 1,2 M€. Lo que no cuadre se etiqueta \"visto en pantalla, no contrastado con ERP/contabilidad\".\n- Cabecera de una página, con 3 o 4 hallazgos como máximo. Cada uno lleva su cifra, por qué importa y qué pides. El anexo lleva el resto como \"hipótesis a verificar\".\n- Una línea de \"mientras tanto\": no ejecutar los traspasos propuestos hasta verificar V16 y los centros inactivos. Eso protege dinero real y protege a D.\n- Petición explícita: que sus agentes verifiquen devolviendo evidencia reproducible, más una oferta de 30 minutos para verlo juntos.\n- Reynasa queda fuera de este correo. \"You earn trust slowly, over time, by doing hard things well\" (S041). Primero se gana esa confianza y después se propone lo demás.\n\nPREGUNTA A OTRO CONSEJERO: A Buffett. De las cifras de cabecera (6,0 M€ de la central, 0,85 M€ de V16, 24 de 39,5 M€ de venta no almacenable), ¿cuál aguantaría una revisión de contabilidad y cuál etiquetarías \"a verificar\"? ¿Y cómo valorarías las V16 sin salida, a coste o a valor realizable?\n\nNOTA DE MI ÁREA: 8. B deja todas las puertas abiertas: escala a C o a D si D. lo pide, cuesta poco deshacerla y sirve al cliente a diez años.\n\nCONFIANZA: 4. Me faltan la relación real con D. y el contraste de las cifras con el ERP."}, {"slug": "wickman", "nombre": "Gino Wickman", "postura": "Con todo el cariño y respeto, Rubén, no mandes los siete hallazgos mezclados. Mándalos agrupados en tres raíces con su cifra, el resto en un anexo, y cierra proponiendo un dueño y un número semanal (B).", "puntuaciones": {"A": 5.0, "B": 9.0, "C": 4.0, "D": 6.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Con todo el cariño y respeto, Rubén, no mandes los siete hallazgos mezclados. Mándalos agrupados en tres raíces con su cifra, el resto en un anexo, y cierra proponiendo un dueño y un número semanal (B).\n\nPUNTUACIONES: A=5, B=9, C=4, D=6, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Son tres raíces, no siete problemas.** Es el marco de Six Key Components: \"go to the root of their issue and solve it there 136 issues just kind of fell away\" (S043).\n  - **Datos:** el almacén 20 pesa 6,0 de 11,8 M€ (51%) y no sale en Almacenes ni en el exceso. Además 11,8 − 6,0 − 4,6 deja 1,2 M€ sin explicar (supuesto: stock negativo u otros códigos). Unos 24 de los 39,5 M€ de venta (61%) no son producto almacenable, lo que puede inflar las 8.140 líneas \"Le falta\" (supuesto: si la cobertura usa esa venta).\n  - **Proceso y Personas:** la carga falló el 11, 12 y 13-oct y exige login manual. La base está al 81,7% (quedan 91,3 MB). Una herramienta que se para si una persona no entra no pasa el test de \"seeing if your business can run without you\" (S029). Si ese login lo hace D. a mano (supuesto), además es trabajo de 25 euros la hora (S029).\n  - **Decisiones:** las recomendaciones no filtran lo básico. Proponen 373 balizas (7.639 €) a un centro con stock negativo, sobre un lote de 41.668 uds. que son 0,85 M€ a 2.013 días (5,5 años de venta). Los centros inactivos encabezan \"Le falta\".\n- **Recorta con IDS y tiempo de v1.** Arriba van solo tres titulares, y el resto pasa a la lista de problemas del anexo (IDS y Issues List, S043).\n  - **Estacionalidad con un solo año:** es un límite de v1 que arregla el calendario, no un bug. Entra en \"live with it\" (S067), y por eso no la pongo arriba.\n  - **Permisos, nivel de lineal, priorización por € y curva mensual:** van al anexo para cuando escale.\n  - **Por qué no las otras:** A entierra los tres que importan entre 141.120 líneas de cálculo. C, sin un escrito, no deja dueño ni To-Do. E es decidir \"live with it\" por no incomodar: \"there's only one of three options and that's to live with it leave it or change it\" (S067). Si el feedback es honesto y con cariño, \"you can't say it wrong\" (S036).\n  - **Dónde falla mi lente:** EOS es para equipos de dirección consolidados, y esto es una v1 que busca encaje y que no es tuya. No le pido a D. Level 10 ni organigrama completo, solo dueño y número. Sobre qué es bloqueante para validar un producto, cedo a Graham. Sobre IA, no tengo posición.\n- **Cierra con dueño y número, no con queja.** Propón una Roca de 90 días, \"datos fiables\", con tres números semanales (Scorecard, S077):\n  - días con carga correcta, de 7 a 7;\n  - diferencia de stock frente al ERP, menos de 1% (supuesto);\n  - % de traspasos propuestos a centros activos, 100%.\n  - Cada número con un dueño que nombre D. o IT. Hoy \"cualquiera cambia Parámetros\", que en la Accountability Chart equivale a nadie.\n  - Y matiza lo de los agentes: un agente en el repositorio verifica que el código calcula lo que dice. No verifica que el stock coincida con el ERP, que no ve (supuesto). Esa contrastación sigue siendo humana.\n\nRIESGO PRINCIPAL: Que una cifra leída solo en pantalla (por ejemplo, los 6,0 M€ del almacén 20) resulte errónea y el correo cueste credibilidad a Rubén ante un superior, en lugar de darle valor a D.\n\nRIESGO DE RUINA en la preferida: no\n\nCONDICIONES:\n1. Antes de enviar, contrasta los tres titulares con ERP o contabilidad: stock total, almacén 20 y ref. V-2. Lo no contrastado va escrito como \"según pantalla, por confirmar\".\n2. Abre con lo que sí funciona: cada pantalla explica su cálculo, se pueden excluir eventos, hay exportación a Excel y pantalla de estado de datos. Di la verdad dura \"open and honest and love\" (S036).\n3. Tres titulares arriba, anexo con el resto, y una petición concreta: 30 minutos con D. para resolverlos con dueño y fecha. Ahí entra la sugerencia de pasarlo a sus agentes, como apoyo y no como sustituto.\n4. Rubén no se convierte en el validador permanente. Si ofrece contrastar cada semana, que sea durante 90 días y con un solo número, y que el dueño de la carga y de los datos lo nombre D.\n5. Esta semana: una hora para contrastar tres cifras y enviarlo el jueves 15-oct. Stay focused.\n\nPREGUNTA A OTRO CONSEJERO: A Graham: si esto es una v1 para validar el enfoque, ¿cuáles de mis tres titulares bloquean de verdad esa validación y cuáles son ruido de v1 que yo sobrevaloro por ser de procesos?\n\nNOTA DE MI ÁREA: 7. Quedan nombradas las raíces, un dueño y un número. Un correo no arregla por sí solo la dependencia del login manual ni la falta de estructura; eso depende de que D. nombre al dueño.\n\nCONFIANZA: 4"}, {"slug": "buffett", "nombre": "Warren Buffett", "postura": "Yo mandaría la B: tres o cuatro hallazgos que muevan euros, marcados como \"visto en pantalla, no contrastado\", y el resto en un anexo. Lo único que Rubén arriesga aquí es su crédito ante D., y el crédito se pierde mucho más rápido de lo que se recupera.", "puntuaciones": {"A": 6.0, "B": 8.0, "C": 5.0, "D": 4.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Yo mandaría la B: tres o cuatro hallazgos que muevan euros, marcados como \"visto en pantalla, no contrastado\", y el resto en un anexo. Lo único que Rubén arriesga aquí es su crédito ante D., y el crédito se pierde mucho más rápido de lo que se recupera.\n\nPUNTUACIONES: A=6, B=8, C=5, D=4, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Los euros que importan son pocos y se comprueban en una tarde.** El almacén central son 6,0 de los 11,8 M€ (51%) y no sale en la lista de Almacenes ni en el \"exceso\" de 2,1 M€. Las V16 son 0,85 M€ con 2.013 días de cobertura, unos 5,5 años. Con un coste de capital del 8% (supuesto) son unos 68 k€ al año de caja parada, sin contar obsolescencia.\n  - La primera propuesta de traspaso mueve 7.639 €, el 0,9% de esa bolsa, y lo manda a un centro con stock negativo. Eso es lo primero que D. debe leer.\n  - No sumo central y V16 porque pueden solaparse: la ref. V-2 tiene 5.956 uds. en central.\n  - La estacionalidad con un solo año y las cadenas de nieve en octubre son importantes pero no se pueden saber con 12 meses de historia. Van al anexo como limitación, no como fallo (Important and knowable, S022).\n- **Rubén no arriesga caja, arriesga crédito, y eso sí es mi pilar.** Mi cuenta de caja casi no aplica: supongo que el stock es de Red X y la relación con Reynasa está pendiente. Rubén leyó pantallas sin contrastar con el ERP ni con contabilidad, así que nueve hallazgos son nueve ocasiones de equivocarse. Uno falso, por ejemplo que el central esté fuera a propósito, desacredita a los tres ciertos. \"We can afford to lose money – even a lot of money. But we can’t afford to lose reputation – even a shred of reputation.\" (S083)\n  - Además, los agentes de D. verificarán en el repositorio lo que hace el código. No sabrán si los 6,0 M€ coinciden con la realidad; eso solo lo dice el ERP. Tu crédito con D. es tu foso: se ensancha con cada cifra que aguanta la comprobación y se estrecha con cada una que no.\n- **Menos hallazgos, más peso.** \"Stick with big, “easy” decisions and eschew activity.\" (S090) Stock negativo (Lunas −49.045 €), stock muerto mayor que el stock, cobertura ∞ con ventas y ~24 de 39,5 M€ de venta que no es producto almacenable son un solo hallazgo con ejemplos. \"In the world of business, bad news often surfaces serially: You see a cockroach in your kitchen; as the days go by, you meet his relatives.\" (S087)\n  - Una cucaracha es un error; cuatro dicen que la base no cuadra consigo misma. Eso son tres líneas, no veinte.\n  - Con el anexo completo no hay error de omisión (S028). La E sí lo es: saber que hay 6,0 M€ fuera del radar y contestar \"gracias\" es el tipo de error que nunca sale en los libros.\n\nRIESGO PRINCIPAL: Que alguno de los titulares tenga una explicación legítima (por ejemplo, el central excluido a propósito) y Rubén lo haya presentado como error, perdiendo crédito ante D. en la primera frase.\n\nRIESGO DE RUINA en la preferida: no. El peor caso es perder crédito ante D., que es una pérdida acotada y reparable con una corrección. No hay deuda, caja propia ni terceros que puedan cortar el grifo. Solo subiría a \"posible\" si se afirmaran como hechos cifras sin contrastar.\n\nCONDICIONES:\n- **Una hora de Rubén antes de enviar.**\n  - Cuadrar la herramienta consigo misma: 11,8 − 6,0 = 5,8 M€ fuera del central, frente a los 4,6 M€ de la lista de Almacenes. Quedan 1,2 M€ sin explicar. Es mi cuenta y puede haber una explicación que no veo (supuesto).\n  - Contrastar con el ERP, o con alguien de Compras o Almacén, el central (6,0 M€) y las V16 (41.668 uds.).\n  - Si no da tiempo esta semana, se envía igual con la etiqueta \"visto en pantalla, no contrastado\".\n- **Cada titular va como hecho observado, euros y pregunta, no como veredicto.** Por ejemplo: \"¿es intencionado que el central no entre en el exceso?\". D. debería poder leerlo en voz alta delante de su jefe y que pase la prueba del periódico (S028).\n- **Una frase de salvaguarda:** mientras no cuadre con el ERP, no se ejecutan traspasos desde la pantalla. Eso da casi todo el valor de la D sin proponer un piloto que a Rubén no le toca dictar.\n- **Anexo completo y sin recortar.** Las carencias de producto (curva mensual, lineal, permisos) las deben pedir las áreas, no dictarlas Rubén. Fuera de su círculo: él lee datos, no planifica surtido (Circle of competence, S022).\n- **Recomendar la verificación con agentes en dos capas:** qué hace el código y si el resultado cuadra con el ERP.\n\nPREGUNTA A OTRO CONSEJERO: A Graham: en una v1 hecha para validar el enfoque, ¿es razonable que no cuadre con el ERP, o eso es justo lo primero que hay que validar? ¿Cuál es el mínimo de cifras que tendrían que cuadrar para que la prueba valga? Quiero saber si le estoy pidiendo rigor de balance a un prototipo.\n\nNOTA DE MI ÁREA: 7. Con la B la caja de Rubén no corre riesgo, su crédito queda protegido y se señalan los 6,0 M€ ciegos. No llega a 9 porque las cifras siguen sin contrastar con el ERP y la pantalla sigue en uso mientras tanto.\n\nCONFIANZA: 4"}, {"slug": "graham", "nombre": "Paul Graham", "postura": "Mandad el feedback como lo manda un buen usuario a un buen fundador: 3 o 4 cosas que rompen la confianza, cada una con su cifra y su prueba de cinco minutos, y el resto en un anexo para los agentes de D. Eso es la B; la A, tal como está, entierra la señal.", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 5.0, "D": 6.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Mandad el feedback como lo manda un buen usuario a un buen fundador: 3 o 4 cosas que rompen la confianza, cada una con su cifra y su prueba de cinco minutos, y el resto en un anexo para los agentes de D. Eso es la B; la A, tal como está, entierra la señal.\n\nPUNTUACIONES: A=5, B=8, C=5, D=6, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **D. pide a un usuario que le diga dónde se rompe la confianza, no que le haga una auditoría.** \"Launching teaches you what you should have been building.\" (S142) (\"Lanzar te enseña lo que deberías haber estado construyendo.\") Un comprador deja de fiarse en la primera pantalla por tres cosas, y las tres son del brief.\n  - El Resumen mide la mitad del stock. El central (6,0 M€) es el 51% de los 11,8 M€ de la red y queda fuera de la lista y del \"exceso\" (2,1 M€, un 18%). Si solo la mitad de los 3,2 M€ de neumáticos del central fuera sobrante (supuesto), el exceso pasaría de 5,3 a 3,7 M€ (+75%).\n  - Los números tampoco cuadran entre sí. Sin el central, 11,8 − 6,0 = 5,8 M€, y la lista suma 4,6 M€: faltan 1,2 M€ que no explica nadie (supuesto: almacenes no listados o netos negativos; no lo sé).\n  - La primera recomendación que ve un usuario es absurda. Las V16 son 0,85 M€ (7% del stock) con 2.013 días de cobertura, o sea 5,5 años. Además proponen traspasar 373 uds. a un centro con stock negativo. Eso son unos 18 días de venta de toda la red, a razón de ~21 uds./día (supuesto: la cobertura se calcula sobre la red).\n  - Una v1 puede ser pequeña, pero no puede ser mala (\"Launch fast and iterate\": mínima, no con bugs, S142). Aquí además no es una app de tareas: un traspaso erróneo es caja inmovilizada, así que tolero menos el \"sacadlo y ya arreglaréis\".\n- **Cuatro o cinco, no siete más siete.** \"The number one thing not to do is other things.\" (S166) (\"Lo primero que no hay que hacer es otras cosas.\") D. tiene un solo cuello de botella: que alguien se fíe de los números el lunes por la mañana.\n  - Entran en el cuerpo: el central ausente, las V16 y su propuesta de traspaso, los centros inactivos que encabezan \"Le falta\", y la carga caída tres días (11, 12 y 13-oct). Una herramienta que no se refresca no se abre dos veces.\n  - Los permisos, el lineal de Cliente-H, la curva mensual y la priorización por € son deseos de v2. Los usuarios los pedirán cuando confíen en la v1. Van al anexo.\n  - Esto sirve a lo que busca Rubén: darle a D. las preguntas que le harían en una presentación y que hoy no sabe contestar.\n- **La verificación con agentes es buena idea; la parte de \"completo\" no.** Un agente con el repositorio comprueba en minutos si el código 20 está filtrado o si falta la ref. V-2 en la exclusión. El anexo, en formato de tabla (pantalla, cifra, causa probable, prueba), es lo que ellos consumen, así que B conserva todo el valor de A.\n  - Rubén leyó pantalla y no contrastó con el ERP (supuesto del brief). Si un número es un malentendido y va afirmado en el cuerpo, se pierde la credibilidad ante un superior. Tiene que ir como \"esto veo, compruébalo\".\n  - Mi única adición de producto no es un fallo, es una pregunta que el brief no contesta: ¿quién es el primer usuario y qué decisión toma con esto el lunes? \"A need that's narrow but genuine is a better starting point than one that's broad but hypothetical.\" (S174) (\"Una necesidad estrecha pero real es mejor punto de partida que una amplia pero hipotética.\") Propuesto como sugerencia (\"una familia, un comprador, cuadrada al euro con el ERP\"), no como condición. Si es condición, frena, y Rubén no quiere frenar.\n\nRIESGO PRINCIPAL: Que alguno de los 3 o 4 hallazgos del cuerpo sea un malentendido de lectura de pantalla y le reste credibilidad ante un superior en la primera impresión, con lo que Rubén pierde el \"contad conmigo\".\n\nRIESGO DE RUINA en la preferida: no. Es un correo, el coste peor es fricción y reputación de Rubén, no de la empresa. Los 0,85 M€ de V16 y los 6,0 M€ del central son un problema de la herramienta, no de enviar el correo.\n\nCONDICIONES:\n- Cuerpo de una página. Cada hallazgo lleva qué veo, la cifra, por qué un comprador dejaría de fiarse y cómo comprobarlo en cinco minutos.\n- Dicho con claridad que es \"visto en pantalla, no contrastado con el ERP\".\n- Abrir con lo bueno concreto, que es real: cada pantalla explica su cálculo, se pueden excluir eventos, hay exportación y estado de datos. No es cortesía.\n- Anexo para los agentes, con recomendación de pasarlo tal cual y pedirles que propongan cambios.\n- Cierre con un paso pequeño: 20 minutos en pantalla compartida y la oferta de probarlo con una familia.\n- Enviarlo esta semana, antes de que D. lo enseñe a otros.\n\nPREGUNTA A OTRO CONSEJERO: A Buffett: de mis hallazgos, ¿cuáles pondrías en el cuerpo con cifra y cuáles como \"a verificar\", sabiendo que leí pantalla y no contrasté con el ERP? ¿Qué cifra, si está mal, me cuesta más reputación?\n\nNOTA DE MI ÁREA: 7. B da a D. la mejor señal de producto, concentrada, comprobable y con un estrechamiento sugerido. No llega a 9 porque sigue sin haber prueba de uso real (quién la abre y cuántas veces por semana) y el brief no la trae.\n\nCONFIANZA: 4. Mi lente falla en parte: esto es una herramienta interna para un superior, no un producto que se vende, y el \"crecimiento\" aquí no se mide en semanas. Pesa más la relación con D., que dejo a Bezos y a Gary V. Tampoco sé la relación exacta Reynasa–Red X ni cómo recibe D. las críticas."}, {"slug": "martell", "nombre": "Dan Martell", "postura": "B. Tres a cinco bloqueos en una pantalla y el resto en un anexo listo para que lo procesen los agentes de D., con dueño y fecha por bloque. El contenido de A está bien; lo que falla es el orden.", "puntuaciones": {"A": 7.0, "B": 9.0, "C": 3.0, "D": 5.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: B. Tres a cinco bloqueos en una pantalla y el resto en un anexo listo para que lo procesen los agentes de D., con dueño y fecha por bloque. El contenido de A está bien; lo que falla es el orden.\n\nPUNTUACIONES: A=7, B=9, C=3, D=5, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **La agenda de D. es el cuello de botella.** \"Your inbox is nothing more than a public to-do list of other people's priorities on your time.\" (S004) (tu bandeja es la lista pública de tareas con las prioridades de otros sobre tu tiempo). \"You know why they call it a bottleneck, cuz it's at the top.\" (S031) (la botella se estrecha por arriba).\n  - Un correo con 7 grupos de hallazgos y más de 20 cifras (supuesto: unas 1.500 palabras, unos 8 minutos de lectura) cae sobre esa agenda. Si lo primero que ve es un muro, lo defiende o lo aparca.\n  - Si ve en 300 palabras un 1-3-1 (S031), delega. El problema: hoy propondría traspasos con datos que no cuadran. Los bloqueos: 3 a 5. La recomendación: pasa el anexo a tus agentes.\n  - El anexo es el Camcorder Method (S020): Rubén \"grabó\" lo que vio, con ruta de pantalla y cifra, y un agente puede repetirlo. Verificar con agentes es palanca de código (Four C's, S007). Esa parte de A la mantengo.\n- **Quién comprueba y quién cierra.** Delegar sin revisar es mi historia más cara: 500K$ y casi pierdo a Procter and Gamble (S103).\n  - Rubén leyó pantalla y no contrastó con el ERP ni con contabilidad (brief). Los agentes verifican el código, no que los 6,0 M€ del almacén 20 coincidan con el ERP. \"Confirmado en el repositorio\" no es \"cierto en el negocio\".\n  - Cada bloque necesita un nombre y un número. La carga falló los días 11, 12 y 13 y depende de un login manual, o sea de una persona, y la base de datos está al 81,7 % (408,7 de 500 MB). Pido un dueño de IT con un número: 14 días seguidos de carga correcta.\n  - El contraste con el ERP también necesita dueño. Los Parámetros que \"cualquiera cambia\" necesitan un límite de autoridad por nivel (50 to Fix It, S122).\n  - \"When you assign a task, you create a tenant. But when you assign an outcome, you create an owner.\" (S113) (si asignas una tarea creas un inquilino; si asignas un resultado, un dueño).\n- **La agenda de Rubén y por qué E y C pierden.** Horas por opción (supuesto):\n  - A o B: unas 1 h de Rubén (el borrador ya existe) y unas 0,7 h de D.\n  - C: unas 3 h de Rubén y 1 h de D., con los hallazgos aún sin escribir.\n  - D: unas 6 h de Rubén el primer mes y 2 h de D.\n  - E: 0 h hoy, pero Rubén repetirá a mano la revisión de 141.120 líneas cuando la carga vuelva (unas 3 h, supuesto).\n  - E es el Staller (Five Time Assassins, S059): esperar con la carga rota tres días. Y \"cuenta conmigo\" sin límite convierte a Rubén en el QA gratis de D., trabajo rojo de $1 (Time and Energy Audit, S057). La oferta de Rubén debe ser un resultado, un número y dos semanas. Lo de Reynasa va después, sin saltar fases (S122).\n  - Mi lente falla en dos cosas. D. no es mi fundador: no le pongo Buyback Rate ni le digo a quién contratar. Y las horas son supuestos; no sé cuánta capacidad tiene IT.\n\nRIESGO PRINCIPAL: Que D. pase el anexo a los agentes, nadie fije dueño ni fecha, y el correo muera en \"confirmado en el repo\" sin que nadie contraste las cifras con el ERP.\n\nRIESGO DE RUINA en la preferida: no. Es un correo, y se corrige con otro.\n\nCONDICIONES:\n1. Cuerpo de 300 palabras o menos, en formato 1-3-1, con lo bueno de la herramienta en una línea al principio.\n2. Anexo con ID por hallazgo (H1 a H7): dónde se ve, qué vi, qué esperaba, cómo comprobarlo. Marcado \"visto en pantalla, sin contrastar con ERP\".\n3. Pedir a los agentes que devuelvan cada hallazgo como 1-3-1 (problema, tres opciones, una recomendación). También una tabla de confirmado / no confirmado / por diseño en 7 días.\n4. Un dueño con nombre y una fecha por bloque: carga diaria, contraste con el ERP, permisos y Parámetros.\n5. Oferta de Rubén acotada: un resultado, un número y dos semanas (por ejemplo, contrastar 3 cifras clave con un extracto del ERP). Sin compromiso abierto.\n\nReto, Rubén: escríbelo antes de enviar. ¿Quién cierra cada hallazgo y para cuándo? Si la respuesta es \"D., ya veremos\", no has delegado, has soltado.\n\nPREGUNTA A OTRO CONSEJERO: A Wickman. ¿Quién es el dueño con nombre de la carga diaria y del contraste con el ERP (D., IT o Rubén)? ¿Y qué número te basta para dar cada cosa por arreglada?\n\nNOTA DE MI ÁREA: 7. Queda protegida la agenda de D. y acotada la de Rubén, pero mientras no haya dueños con nombre no sube de ahí.\n\nCONFIANZA: 4"}, {"slug": "hormozi", "nombre": "Alex Hormozi", "postura": "Preferida la B. Mándale a D. los 4 problemas que bloquean el uso, ordenados por euros y en forma de pregunta verificable, más un anexo con el resto. Que el correo le ahorre trabajo, y que no se note que no has contrastado con el ERP.", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 4.0, "D": 4.0, "E": 1.0}, "preferida": "B", "confianza": 3.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Preferida la B. Mándale a D. los 4 problemas que bloquean el uso, ordenados por euros y en forma de pregunta verificable, más un anexo con el resto. Que el correo le ahorre trabajo, y que no se note que no has contrastado con el ERP.\n\nPUNTUACIONES: A=5, B=8, C=4, D=4, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Oferta a D., Value Equation (S115).**\n  - Lo que D. quiere es presentarla a dirección sin sorpresas (resultado soñado). Lo que le cuesta es tiempo de lectura y esfuerzo para digerirlo.\n  - Siete hallazgos y un borrador largo suben ese esfuerzo (supuesto: 15 min de lectura frente a 5). Si lee el sexto punto cansado, ya ha dejado de leer.\n  - Recorta y apila (Grand Slam, S114). Los cuatro que bloquean son:\n    1. El almacén central (código 20): 6,0 M€ de 11,8 M€, el 50,7 % del stock, fuera de Almacenes y sin cobertura.\n    2. Balizas V16: 0,85 M€ y 2.013 días de cobertura. La primera propuesta de traspaso manda 373 balizas (7.639 €) a un centro con stock negativo.\n    3. Centros inactivos encabezando \"Le falta\".\n    4. La carga diaria caída 3 días.\n  - Los dos primeros tocan unos 6,8 M€ de 11,8, el 58 %. Puede haber un solape pequeño: 5.956 balizas en central son unos 0,1 M€ a ~20 €/ud (supuesto).\n  - El resto va en una página de anexo. \"Simple scales, fancy fails.\" (S026) (Lo simple escala; lo sofisticado fracasa.)\n  - Tu idea de que sus agentes verifiquen es lo mejor del plan, porque baja el esfuerzo de D. casi a cero. Llévala un paso más allá: adjunta el prompt ya redactado para pegarlo en Claude Code (\"verifica en el repo estas 4 afirmaciones y propón cambios\"). Eso es entrega \"hecha por ti\" (S114, S115).\n\n- **Primero la prueba, después el veredicto (S032, S042, S068).**\n  - Tu tamaño de prueba es una pasada leyendo pantallas, sin contraste con ERP ni contabilidad.\n  - Tu propia cuenta no cierra: 11,8 − 6,0 = 5,8 M€ y la lista de Almacenes suma 4,6. Son 1,2 M€ sin explicar. Puede ser un hallazgo o puede ser que no hayas visto algo.\n  - Competir en pruebas gana a prometer: tú no puedes copiar lo que ellos pueden verificar en el repo. Pero no discutas con un superior. Formula cada punto como pregunta: \"¿el 20 es el central?, ¿debería salir en Almacenes?, ¿por qué el V-2 no está excluido?\". Si aciertas, ganas. Si fallas, no has acusado a nadie.\n  - Las preguntas que se resuelven con una hoja de cálculo, que las resuelva quien tiene el ERP.\n\n- **Un solo resultado por correo, y el resto después.**\n  - Tienes tres objetivos: que presente mejor, que cuente contigo y que sirva para Reynasa. Meter los tres en un mensaje es empacho (S059, S113). Hoy vende uno: que llegue a la presentación sin sorpresas. Lo demás es la continuidad, y el segundo sí sale más fácil después del primero (S046). La idea Reynasa es \"nuevo\": que espere hasta que el primero funcione (S075).\n  - Descarto las otras opciones por estos motivos:\n    - C: gasta dos agendas y no deja nada escrito.\n    - D: D. no pidió que le diseñes el despliegue.\n    - E: pide feedback ahora, que es su punto de mayor necesidad (S030), y esperar lo enfría.\n\nRIESGO PRINCIPAL: Que una de las cifras gruesas (6,0 M€ o 0,85 M€) sea correcta por diseño y quedes ante un superior como quien audita leyendo pantalla sin contrastar.\n\nRIESGO DE RUINA en la preferida: no. Es reversible: el peor caso es un correo con una cifra discutible que se aclara en una llamada.\n\nCONDICIONES:\n- Abre con lo que funciona: cada pantalla explica su cálculo, se pueden excluir eventos, hay detalle por almacén y referencia, exportación a Excel y pantalla de estado de datos. Después, el resultado para D.: llegar a presentarlo sin sorpresas.\n- Cada uno de los 4 puntos lleva la cifra exacta, la pantalla donde se ve y la pregunta. Marca todo como \"visto en pantalla, sin contrastar con ERP\".\n- Antes de enviar, contrasta las dos cifras mayores (central y V16) con el ERP o con contabilidad. Si cuesta más de unas 2 h (supuesto), envía igualmente etiquetado, pero dentro de esta semana.\n- El prompt para sus agentes va como oferta (\"por si te ahorra tiempo\"), no como instrucción.\n- Cierra con un paso pequeño: 30 min para priorizar con lo que devuelvan los agentes.\n- Deja fuera del correo lo de Reynasa y el \"cuenta conmigo\".\n\nPREGUNTA A OTRO CONSEJERO: A Wickman: de mis 4 bloqueantes, ¿cuáles son de verdad de proceso y datos (carga manual por login, Parámetros sin dueño) y cuál es el mínimo que debe arreglar D. antes de poder enseñarla? ¿Cambiarías el orden?\n\nNOTA DE MI ÁREA: 8. Con B hay una oferta clara para D., con poco esfuerzo para él y con pruebas que puede verificar, y un siguiente paso fácil de aceptar.\n\nCONFIANZA: 3. Mi lente falla aquí. No hay precio ni cierre de venta, el interlocutor es un superior y su orgullo pesa más que la ecuación de valor. Y no puedo juzgar si las cifras son ciertas. Mi franqueza de \"ser real\" solo funciona con la prueba en la mano, así que la ajusto: con un superior y sin contraste, pregunta antes de afirmar."}, {"slug": "garyvee", "nombre": "Gary Vee", "postura": "Prefiero B. Tu borrador largo es la pieza pilar, no el correo: a D. le llega en una pantalla lo bueno más 4 problemas, y el resto va en un anexo pensado para que lo lean sus agentes.", "puntuaciones": {"A": 6.0, "B": 9.0, "C": 5.0, "D": 3.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Prefiero B. Tu borrador largo es la pieza pilar, no el correo: a D. le llega en una pantalla lo bueno más 4 problemas, y el resto va en un anexo pensado para que lo lean sus agentes.\n\nPUNTUACIONES: A=6, B=9, C=5, D=3, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Dos audiencias, dos formatos.** La atención de D. es escasa (supuesto: lee en el móvil entre reuniones). La de sus agentes de Claude Code es infinita. El borrador largo mezcla las dos.\n  - Un borrador de ~1.500 palabras son ~7 min de lectura (supuesto). Un correo de ~450 palabras son ~2 min (supuesto).\n  - Haz una pieza pilar cortada en piezas nativas (S112, S144): \"analyze and repurpose it into 30 other pieces of content\" (S144). El correo es para D. El anexo es para los agentes, con pantalla, referencia, cifra y qué esperabas ver.\n  - Tu agenda de parecer exhaustivo va tercera: \"Respecting the audience, respecting the platform, and taking your agenda and making it third\" (S095).\n  - B contiene a A: no pierdes ni un hallazgo, solo cambias dónde vive.\n- **Primero valor, después la pe   const $ = id => document.getElementById(id);
  const limpio = s => String(s || '').replace(/\*\*|`|\[|\]/g, '').replace(/\s+/g, ' ').trim();
  const corta = (s, max) => s.length <= max ? s : s.slice(0, s.lastIndexOf(' ', max)) + '…';
  const lineaDe = (r, t) => {
    if (t.apoyo != null) {
      const enm = t.enmienda && !/^ninguna/i.test(t.enmienda) ? ' Mi enmienda: ' + limpio(t.enmienda) : ' Sin enmiendas.';
      return corta(`Apoyo la resolución con un ${String(t.apoyo).replace('.0', '')} sobre 10.` + enm, 300);
    }
    let txt = limpio(t.postura);
    if (t.movido && !/^nada/i.test(limpio(t.movido)) && r.id !== 'ronda-1') txt += ' Lo que me ha movido: ' + limpio(t.movido);
    return corta(txt, 300);
  };
  const turnos = [];
  rondas.forEach((r, ri) => {
    turnos.push({tipo: 'ronda', ri, r});
    r.tarjetas.forEach(t => turnos.push({tipo: 'habla', ri, r, t, texto: lineaDe(r, t)}));
  });
  if (v.etiqueta) turnos.push({tipo: 'veredicto'});
  if (D.estado === 'en curso') turnos.push({tipo: 'espera'});

  let idx = 0, tok = 0, pausa = true, vel = 1, saltar = false;
  const asientos = [...document.querySelectorAll('.st')];
  const arco = $('arco');
  const forma = (slug, f) => { const b = document.querySelector(`#st-${slug} .bust`); if (b) b.dataset.shape = f; };
  const estado = (slug, cls) => asientos.forEach(a => {
    a.classList.toggle('speaking', cls === 'speaking' && a.dataset.slug === slug);
    if (cls === 'thinking-all') a.classList.add('thinking'); else if (cls !== 'keep') a.classList.remove('thinking');
  });
  const dormir = ms => new Promise(res => {
    const t0 = tok, fin = Date.now() + ms / vel;
    (function mirar() { if (t0 !== tok || saltar) return res(); if (pausa) return setTimeout(mirar, 120); if (Date.now() >= fin) return res(); setTimeout(mirar, 40); })();
  });
  const alFeed = html => { const f = $('feed'); const vacio = f.querySelector('.vacio'); if (vacio) vacio.remove(); f.insertAdjacentHTML('afterbegin', html); };
  const progreso = () => { $('pProg').style.width = (100 * idx / Math.max(1, turnos.length)) + '%'; };
  const marcarSaltos = ri => document.querySelectorAll('[data-salto]').forEach(b => b.classList.toggle('on', String(b.dataset.salto) === String(ri)));

  async function hablar(turno) {
    const {t, r, texto, ri} = turno; const t0 = tok;
    estado(t.slug, 'speaking'); arco.classList.add('focus');
    // los que aún no han hablado en esta ronda siguen "pensando"
    const yaHablaron = new Set(r.tarjetas.slice(0, r.tarjetas.indexOf(t) + 1).map(x => x.slug));
    asientos.forEach(a => a.classList.toggle('thinking', !yaHablaron.has(a.dataset.slug) && r.tarjetas.some(x => x.slug === a.dataset.slug)));
    $('pRonda').textContent = `Ronda ${ri + 1} de ${rondas.length}`;
    $('pTitulo').textContent = `${t.nombre}${t.preferida ? ' · prefiere ' + t.preferida : ''}`;
    const linea = $('pLinea'); linea.textContent = '';
    for (let i = 0; i < texto.length; i++) {
      if (t0 !== tok) return;
      if (saltar) { linea.textContent = texto; break; }
      while (pausa && t0 === tok) await new Promise(res => setTimeout(res, 120));
      const ch = texto[i].toLowerCase();
      linea.textContent += texto[i];
      const f = 'aáeéiíà'.includes(ch) ? 'open' : 'oóuúwy'.includes(ch) ? 'mid' : 'mbpfv .,;:'.includes(ch) ? 'base' : null;
      if (f) forma(t.slug, f);
      await new Promise(res => setTimeout(res, (/[.,;:]/.test(ch) ? 90 : 24) / vel));
    }
    forma(t.slug, 'base'); saltar = false;
    alFeed(`<li data-ir="c-${r.id}-${t.slug}">${av(t.slug, t.nombre)}<div><span class="n">${esc(t.nombre)}</span><span class="r">R${ri + 1}</span><div>${esc(corta(texto, 170))}</div></div></li>`);
    await dormir(1300);
  }

  async function jugar(turno) {
    const t0 = tok;
    if (turno.tipo === 'ronda') {
      arco.classList.remove('focus'); estado(null, 'thinking-all'); marcarSaltos(turno.ri);
      $('pRonda').textContent = `Ronda ${turno.ri + 1} de ${rondas.length}`;
      $('pTitulo').textContent = turno.r.titulo.split(' · ')[1] || turno.r.titulo;
      $('pLinea').textContent = turno.r.explicacion;
      alFeed(`<li class="sys">${esc(turno.r.titulo)}</li>`);
      await dormir(2400);
    } else if (turno.tipo === 'habla') {
      await hablar(turno);
    } else if (turno.tipo === 'veredicto') {
      arco.classList.remove('focus'); estado(null, 'none'); marcarSaltos('v');
      $('pRonda').textContent = 'Veredicto';
      $('pTitulo').textContent = `${v.etiqueta} · ${v.puntuacion} / 10`;
      $('pLinea').innerHTML = `Opción recomendada: <b>${esc(v.recomendada)}</b>. El detalle, las cuentas y el texto final están abajo, en «Veredicto».`;
      alFeed(`<li class="sys">Veredicto: ${esc(v.etiqueta)} · ${esc(v.puntuacion)} / 10</li>`);
    } else if (turno.tipo === 'espera') {
      estado(null, 'thinking-all'); arco.classList.remove('focus');
      $('pRonda').textContent = 'En curso';
      $('pTitulo').textContent = 'Los consejeros están escribiendo la siguiente ronda';
      $('pLinea').textContent = 'La página se actualiza sola cada minuto.';
    }
    if (t0 === tok) { idx++; progreso(); }
  }

  async function bucle() {
    const t0 = tok;
    while (idx < turnos.length && t0 === tok) {
      if (pausa) { await new Promise(res => setTimeout(res, 150)); continue; }
      await jugar(turnos[idx]);
    }
    if (idx >= turnos.length && t0 === tok) { pausa = true; $('bPlay').textContent = '↺ Repetir'; }
  }
  const reiniciarDesde = i => { tok++; idx = i; saltar = false; asientos.forEach(a => forma(a.dataset.slug, 'base')); progreso(); bucle(); };

  $('bPlay').addEventListener('click', () => {
    if (idx >= turnos.length) { $('feed').innerHTML = ''; pausa = false; $('bPlay').textContent = '⏸ Pausa'; return reiniciarDesde(0); }
    pausa = !pausa; $('bPlay').textContent = pausa ? '▶ Seguir' : '⏸ Pausa';
  });
  $('bSig').addEventListener('click', () => { saltar = true; if (pausa) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } });
  $('bVel').addEventListener('click', () => { vel = vel === 1 ? 2 : vel === 2 ? 3 : 1; $('bVel').textContent = 'x' + vel; });
  document.querySelectorAll('[data-salto]').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.salto;
    const i = s === 'v' ? turnos.findIndex(x => x.tipo === 'veredicto') : turnos.findIndex(x => x.tipo === 'ronda' && x.ri === Number(s));
    pausa = false; $('bPlay').textContent = '⏸ Pausa'; reiniciarDesde(Math.max(0, i));
  }));
  $('feed').addEventListener('click', ev => { const li = ev.target.closest('[data-ir]'); if (!li) return; const c = $(li.dataset.ir); if (c) { c.scrollIntoView({behavior: 'smooth', block: 'center'}); const d = c.querySelector('details'); if (d) d.open = true; } });
  asientos.forEach(a => a.addEventListener('click', () => {
    const r = rondas[Math.max(0, (turnos[Math.min(idx, turnos.length - 1)] || {}).ri ?? 0)];
    const c = r && $(`c-${r.id}-${a.dataset.slug}`); if (c) c.scrollIntoView({behavior: 'smooth', block: 'center'});
  }));

  // Parpadeo de todos para que la sala parezca viva
  asientos.forEach((a, i) => {
    const b = a.querySelector('.bust'); if (!b) return;
    const parpadea = () => { if (b.dataset.shape === 'base') { b.dataset.shape = 'blink'; setTimeout(() => { if (b.dataset.shape === 'blink') b.dataset.shape = 'base'; }, 130); } setTimeout(parpadea, 2400 + Math.random() * 4200); };
    setTimeout(parpadea, 600 + i * 530);
  });

  progreso();
  bucle();
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!quieto && !location.hash) setTimeout(() => { if (pausa && idx === 0) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } }, 1500);

  // Mientras el debate está en curso, la página se recarga sola cada minuto
  if (D.estado === 'en curso') setTimeout(() => location.reload(), 60000);
})();
</script>
</body>
</html>
