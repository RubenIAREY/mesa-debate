eve everything that they say\" (S009). D. no va a creerse tu cifra, va a creerse la de sus agentes. La etiqueta no te resta nada: le dice \"compruébalo\" a quien sí va a creer lo que encuentre.\n  - \"You never win a sale by winning an argument.\" (S068). Cada punto va como hecho observado más pregunta (\"¿es intencionado que el 20 no entre en el exceso?\"). Eso cubre el riesgo de Buffett de que haya una explicación legítima.\n  - La forma de que no se note una carencia es quitarla. Contrasta las dos grandes (central y V16) y márcalas \"contrastado\". Lo demás va como \"visto en pantalla\". Regla: etiqueta lo que no sabes, contrasta lo que puedes.\n- **A Wickman y Martell (raíces, dueños, límite del agente).**\n  - Cedo el agrupamiento: las tres raíces (Datos, Proceso, Decisiones) son los títulos del cuerpo y mis cuatro casos son la prueba debajo de cada una. Una raíz sin ejemplo es una opinión.\n  - Dueño y número, solo en la carga: es la única con fecha (11, 12 y 13-oct). Va como pregunta (\"¿quién en IT la lleva? ¿qué te vale como arreglada, 14 días seguidos?\"). Un Scorecard completo a un superior en el primer correo sube su esfuerzo y suena a auditoría.\n  - Acepto que el agente verifica el código y no el ERP. Lo meto en el prompt como cuarto veredicto posible.\n- **A Gary Vee y Martell (defensa de A y de Reynasa).**\n  - La mejor defensa de A es que el agente lee gratis. La acepto: por eso el anexo va completo, sin recortar. B es A con orden.\n  - Reynasa y el \"cuenta conmigo\" no entran en este correo. Gary V pide un solo ask: \"Most businesses die from indigestion, not starvation.\" (S113). Su propia línea de Reynasa es un segundo ask.\n  - Reynasa es \"nuevo\": \"the cost of change of doing something new is guaranteed, but the return on something new is not.\" (S070). Y \"It's easier to get the second yes after you get the first yes.\" (S046). El sitio para sacarlo son los 30 minutos con D., si el primer resultado sale bien.\n  - El \"cuenta conmigo\" se dice con hechos, con la oferta acotada de Martell (ver condición 6).\n\nQUÉ ME HA MOVIDO: La postura no se mueve. Muevo tres condiciones:\n- Wickman: las tres raíces como títulos del cuerpo.\n- Buffett, Wickman y Martell: el agente verifica código y no ERP. De ahí el veredicto \"no verificable sin ERP\" en el prompt.\n- Martell: la oferta acotada (un resultado, un número, un plazo) en lugar de la frase \"cuenta conmigo\".\n- Bezos y Buffett: añado la línea de \"mientras tanto\" sobre los traspasos (condición 7). No la tenía en la ronda 1.\n\nRIESGO DE RUINA en la preferida: no. Sigue siendo un correo corregible con otro correo.\n\nCONDICIONES:\n1. **Etiquetado.** Una línea arriba: \"lo que sigue es lo que veo en pantalla\". Contrasta con ERP o contabilidad las dos cifras grandes (central 6,0 M€ y V16 0,85 M€) antes de enviar, si lleva unas 2 h o menos (supuesto), y márcalas \"contrastado\". Si no da tiempo, se envía igual el jueves 15, etiquetado. El resto va como \"visto en pantalla\".\n2. **Apertura.** Abre con lo que funciona (explica su cálculo, exclusión de eventos, detalle por almacén y referencia, exportación a Excel, estado de datos). Después, el resultado de D.: presentarla sin sorpresas.\n3. **Cuerpo.** Las tres raíces con los cuatro casos (central, V16 con las 373 balizas, centros inactivos, carga). Cada caso lleva cifra, pantalla y pregunta. Los 1,2 M€ que no cuadran (11,8 − 6,0 − 4,6) van como pregunta, no como hallazgo.\n4. **Anexo.** Completo, con los 7 grupos, con ID (H1 a H7) y una columna de estado (contrastado o visto en pantalla). Las carencias de producto (curva mensual, lineal, permisos) van como preguntas, no como exigencias.\n5. **Prompt para los agentes de D.** Adjunto, \"por si te ahorra tiempo\". Pide esto, en este orden y con estas 5 líneas:\n   1. Verifica en el repo estas 4 afirmaciones de Surtidos X (vistas en pantalla, sin contrastar con el ERP).\n   2. Antes de confirmar, intenta refutar cada una: busca si el comportamiento es intencionado.\n   3. Por cada una, un veredicto: error / por diseño / no reproducible / no verificable sin ERP.\n   4. Evidencia obligatoria: fichero y línea o consulta, y la cifra que calcula el código frente a la que se ve en pantalla.\n   5. Si es error, cambio propuesto y horas estimadas. Si depende del ERP, campos y filtro del extracto que hace falta. Un \"confirmado\" sin evidencia no vale.\n\n   Lo útil es la cuarta categoría: lo que el agente no puede probar vuelve convertido en la lista exacta de extractos del ERP que hay que cruzar.\n6. **Cierre.** Un solo ask: 30 min para priorizar con lo que devuelvan los agentes. La oferta de Rubén es un resultado, un número y un plazo: contrastar 3 cifras clave con un extracto del ERP en dos semanas (supuesto: Rubén puede pedirlo a Compras o Almacén).\n7. **Mientras tanto.** Una línea: no mover las 373 balizas (7.639 €, unos 20,5 €/ud según el brief) hasta verificar V16 y los centros inactivos.\n\nNOTA DE MI ÁREA: 8. El correo le ahorra trabajo a D., el prompt le da la entrega \"hecha por ti\" y el siguiente paso es fácil de aceptar. No llega a 9 porque su orgullo pesa y no sé cómo recibe la crítica.\n\nCONFIANZA: 3. Mi lente falla aquí: no hay precio ni cierre, el interlocutor es un superior y no puedo juzgar si las cifras son ciertas."}, {"slug": "garyvee", "nombre": "Gary Vee", "postura": "Sigo en B, pero cambio dos cosas respecto a la ronda 1: el anexo completo va dentro del mismo correo (no en un adjunto), y la A sube porque su mejor versión se parece mucho a la mía.", "puntuaciones": {"A": 7.0, "B": 8.0, "C": 5.0, "D": 3.0, "E": 2.0}, "preferida": "B", "confianza": 3.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "Dos cosas, y ninguna es la longitud.", "md": "POSTURA: Sigo en B, pero cambio dos cosas respecto a la ronda 1: el anexo completo va dentro del mismo correo (no en un adjunto), y la A sube porque su mejor versión se parece mucho a la mía.\n\nPUNTUACIONES: A=7, B=8, C=5, D=3, E=2\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- A Bezos, Hormozi y Martell (el triaje y la agenda de D.). Este es el mejor argumento a favor de A.\n  - Rubén no tiene el ERP, así que decidir qué es \"lo grave\" es adivinar. La mesa lo demuestra. Casi todos repetimos el central y las V16, pero la carga diaria la suben Graham, Hormozi, Wickman y yo, y la venta mezclada la sube Bezos y la agrupa Buffett. Martell sube los permisos, que casi todos mandamos al anexo. Yo elegí mis cuatro por llamativos y comprobables en 2 minutos, y eso no es lo mismo que graves.\n  - Rubén busca que D. \"lo presente mejor\". Ante dirección el ojo cae en lo raro (stock negativo de Lunas, cobertura ∞ con ventas, Cliente-H vacío), no en lo que más pesa en euros. Eso lo decide la sala, no Rubén: \"Quantity is not debatable. You either make 800 pieces of content or you make one. Quality is subjective.\" (S038, 2026). Rubén documenta lo que ve: \"Document. Don't create.\" (S143, 2016).\n  - D. tiene Claude Code (supuesto del brief). Probablemente pega el correo entero en su agente y lee el resumen, y para ese lector lo completo cuesta casi cero. El triaje que Bezos quiere que haga Rubén lo hace un agente en minutos.\n- A Buffett y Wickman (cada hallazgo es una ocasión de equivocarse). Es verdad si va como veredicto. Etiquetada \"visto en pantalla, por verificar\", una línea falsa cuesta poco y una cierta vale doble. Si los agentes confirman la mayoría de los siete grupos, Rubén gana más crédito que con cuatro, porque la muestra es mayor. Pero la tasa de acierto es desconocida (supuesto: nadie la conoce hasta contrastar). Si fuera baja, la lista larga costaría más que la corta. Por eso no llego a A pura.\n- A Graham y a Martell (A entierra la señal). Es cierto si el correo empieza por el muro. Con una cabecera de cinco líneas arriba, \"A con cabecera\" y \"B con anexo en el mismo correo\" son el mismo correo. Solo queda el adjunto, y un adjunto se abre menos que el cuerpo (supuesto), así que lo meto dentro. Es la pieza pilar entera abajo y el corte arriba (S144).\n\nQUÉ ME HA MOVIDO: Dos cosas, y ninguna es la longitud.\n- El dato de la ronda 1: no coincidimos en el tercer y cuarto hallazgo, y el mío lo elegí por llamativo. Eso debilita la B de cuatro cerrados que defendía con un 9.\n- El criterio de éxito del brief (\"presentarlo mejor\"): convierte lo que incomoda en la sala en el filtro, y esa sala no la conoce Rubén.\n\nPor eso B baja de 9 a 8 y A sube de 6 a 7. No me movieron los minutos de lectura: son supuestos nuestros, no datos.\n\nRIESGO DE RUINA en la preferida: no. Es un correo y se corrige con otro. Pasaría a \"posible\" solo si las cifras sin contrastar fueran como veredicto.\n\nCONDICIONES:\n- Un solo correo, sin adjunto.\n  - Arriba, una línea de lo bueno y cuatro problemas con su cifra y pantalla: central, V16, centros inactivos y carga diaria.\n  - Debajo de una línea \"para tus agentes, desde aquí\", los siete grupos completos: pantalla, referencia, cifra y qué esperabas ver.\n- Cada línea va como pregunta, marcada \"visto en pantalla, sin contrastar con ERP\". Reabre las pantallas justo antes de enviar, porque la carga ha fallado.\n- Una frase de salvaguarda: mientras no se verifique, no ejecutar traspasos ni tratar las cadenas de nieve como stock muerto en octubre. Es el único hallazgo con fecha (supuesto: alguien actúa sobre la pantalla), y así entra al cuerpo sin ser un quinto titular.\n- La A pura funciona solo si se cumplen tres cosas: central y V16 contrastadas con el ERP, cada línea con su etiqueta y D. procesándolo con su agente en vez de leerlo a mano (supuesto). Si falta una, es B.\n- Un solo ask con plazo: \"dime qué confirman tus agentes; 20 min el viernes si te sirve\". La oferta de Rubén es concreta y acotada: contrastar el stock central con el ERP en dos semanas. Una línea sobre Reynasa al final, sin vender. Envío el 14 o el 15-oct, y seguimiento a los 7 días.\n\nNOTA DE MI ÁREA: 8. La atención se gana arriba y el valor completo se entrega abajo. No llega a 10 porque no sé cómo lee D., y eso decide si A o B.\n\nCONFIANZA: 3. Es una decisión cerrada y depende de un dato que no tengo, el hábito de lectura de D."}], "presidente_md": "### Notas del Presidente\n\n**Quién se movió y por qué**\n- **Gary Vee** (defendiendo A por encargo): baja B de 9 a 8 y sube A de 6 a 7. Su mejor argumento: la mesa no coincide en el 3.º y 4.º hallazgo, así que el triaje de Rubén es una apuesta; y si D. pasa el correo a su agente, lo completo cuesta casi cero. Conclusión: un solo correo, cabecera arriba y el material completo debajo.\n- **Martell** (defendiendo A por encargo): sube A de 7 a 8 y pone el umbral exacto: A solo gana si Rubén sabe que D. procesa su bandeja con agentes. Retira la exigencia de dueño por bloque.\n- **Wickman** corrige su ronda 1: \"Decisiones\" no es una raíz, es síntoma. Quedan dos raíces: **Datos** (con V16 y centros inactivos como prueba) y **Proceso** (la carga).\n- **Buffett** sube la carga diaria al cuerpo (la había dejado fuera) y responde: la cifra que más reputación cuesta si está mal es la del central; la más probable de estar mal (24 M€) va al anexo.\n- **Hormozi** aclara su contradicción: se queda la etiqueta honesta \"visto en pantalla, sin contrastar\"; \"que no se note\" quería decir \"que no suene a acusación\". Redacta el prompt de 5 líneas con cuatro veredictos (error / por diseño / no reproducible / no verificable sin ERP).\n- **Bezos** resuelve el punto de choque 1: el \"cuenta conmigo\" entra como **promesa con fecha** (contrastar 3 cifras con el ERP en dos semanas), solo si Rubén puede conseguir el extracto; Reynasa va al segundo correo, como pregunta, cuando se haya cumplido. Propone titular el anexo con las palabras de D.: \"Qué echaría en falta\".\n- **Graham** define la prueba mínima de validez: tres cifras con el mismo día de corte (stock total, la ref. V-2 de punta a punta y la venta 12M de producto).\n\n**Choques resueltos**\n1. **A frente a B:** resuelto en \"un solo correo\": cabecera corta arriba y anexo completo debajo, sin adjunto. A y B convergen; B gana porque no se sabe cómo lee D. su correo.\n2. **Qué verifican los agentes:** unánime: el código. El ERP es la segunda capa, que cubre la promesa acotada de Rubén.\n3. **Reynasa:** fuera del primer correo para 6 de 7 (Gary Vee mantiene una línea al final, sin vender). El \"cuenta conmigo\" entra como promesa acotada.\n4. **Dueños y números:** dueños no (salvo una pregunta: \"¿quién lanza hoy la carga?\"); números sí, como columna \"número propuesto\" en el anexo.\n\n**Dato que aporta el Presidente** (comprobado en la verificación del debate anterior, no estaba en el brief): la ficha del almacén 20 indica ámbito **OTROS** y el filtro Ámbito = Otros de la lista de Almacenes devuelve 0 filas. Es probable que el central quede fuera **por diseño**, lo que confirma el riesgo de Buffett: el punto del central tiene que ir como pregunta.\n\n**Números aún abiertos:** los 1,2 M€ (pregunta, no hallazgo). Supuestos de los consejeros que no van al correo como hechos: 8 % de coste de capital, 68 k€/año, 0,7 M€ de valor realizable de las V16, 21 uds./día, 7.560 uds./año, minutos de lectura, horas por opción, tolerancia del 1 % (como propuesta, sí).\n\n**Puntuaciones provisionales (pesos: Bezos 3, Wickman 3, Buffett 2, Graham 2, Martell 2, Hormozi 1, Gary Vee 1; suma 14):**\n- A (7×3 + 5×3 + 6×2 + 5×2 + 8×2 + 5×1 + 7×1) / 14 = 86 / 14 = **6,1**\n- B (9×3 + 9×3 + 8×2 + 8×2 + 9×2 + 8×1 + 8×1) / 14 = 120 / 14 = **8,6**\n- C (6×3 + 4×3 + 5×2 + 5×2 + 3×2 + 4×1 + 5×1) / 14 = 65 / 14 = **4,6**\n- D (5×3 + 5×3 + 4×2 + 6×2 + 5×2 + 4×1 + 3×1) / 14 = 67 / 14 = **4,8**\n- E (2×3 + 1×3 + 2×2 + 1×2 + 1×2 + 1×1 + 2×1) / 14 = 20 / 14 = **1,4**\n\nDispersión de B: 9 − 8 = 1. Nadie marca riesgo de ruina.", "ponderadas": {"A": 6.1, "B": 8.6, "C": 4.6, "D": 4.8, "E": 1.4}}, {"id": "borrador", "tipo": "doc", "titulo": "Borrador de resolución", "explicacion": "El Presidente redacta la resolución con lo que ha dicho la mesa. No toma partido.", "hora": "13/10/2026 16:14", "md": "# Borrador de resolución\n\n**Recomendación:** opción **B en su versión común**: **un solo correo**, con una cabecera corta para D. y, debajo, el **anexo completo dentro del mismo correo** (sin adjunto) más un **prompt de verificación** para sus agentes. Es la idea de Rubén (todo el material, verificable por los agentes de D.) con lo que importa ordenado arriba.\n**Veredicto provisional:** ADELANTE (B = 8,6; dispersión 1; nadie marca riesgo de ruina; la decisión se deshace con un segundo correo).\n\n## El correo\n\n1. **Apertura (2–3 líneas):** lo bueno concreto (cada pantalla explica su cálculo, se pueden excluir eventos, detalle por almacén y referencia, exportación a Excel, pantalla de estado de datos) y una frase honesta: \"Lo que sigue es lo que he visto en pantalla el 13/10, sin contrastar con el ERP. Cada cifra lleva su pantalla, y está escrito como pregunta porque puede haber una explicación que no veo.\"\n2. **Cuerpo: dos causas de fondo, cada una con su prueba y su pregunta** (Wickman, Buffett, Graham, Hormozi):\n   - **Datos.**\n     - *Prueba principal:* el Resumen suma 11,8 M€; el almacén 20 (central) aparece con 6,0 M€, su ficha dice ámbito \"Otros\" y no sale ni en la lista de Almacenes (4,6 M€) ni en el \"exceso\" de 2,1 M€. *Pregunta:* \"¿es intencionado? ¿Me pasas el desglose por código de almacén? Me salen 1,2 M€ que no sé ubicar.\"\n     - *Lo que se ve primero (síntomas):* la baliza V16 con 41.668 uds. (0,85 M€) y 2.013 días de cobertura sale como A y en \"Le falta\"; la primera propuesta de traspaso son 373 uds. (7.639 €) a un centro con stock negativo; la ref. V-2 no está entre las excluidas; y encabezan \"Le falta\" centros con stock casi a 0 y venta mínima. *Pregunta:* \"¿falta un filtro de centro activo / tipo de centro y excluir la V-2?\"\n     - *Una línea:* la venta de 12 meses parece incluir conceptos no almacenables (mano de obra, promociones); *pregunta:* \"¿es la que usan el ABC y la cobertura?\" (la cifra, en el anexo, marcada \"calculado por mí\").\n   - **Proceso.** La carga automática falló el 11, 12 y 13/10 (403/522, pide inicio de sesión a mano) y la base de datos está en 408,7 de 500 MB. *Pregunta:* \"¿quién la lanza hoy cuando pide login?\" *Número propuesto:* 14 días seguidos sin fallo y la fecha de los datos visible.\n3. **Mientras tanto (condición de uso de la v1, no orden):** \"yo no ejecutaría traspasos de la pantalla ni trataría como muertas las familias de temporada (las cadenas de nieve salen en Stock muerto en octubre) hasta verificar\".\n4. **Promesa con fecha (Bezos, Martell, Buffett)** — **solo si Rubén puede conseguir un extracto del ERP**: \"Contrasto con el ERP tres cifras (stock total de la red, almacén 20 y la ref. V-2) y te lo devuelvo el viernes 23/10.\" Si no puede conseguirlo, la frase no va.\n5. **Una sola petición:** \"Si te sirve, pega el anexo en Claude Code con el prompt de abajo; con lo que devuelva, 20–30 minutos para priorizar.\"\n6. **Anexo, en el mismo correo**, titulado con las palabras de D.: **\"Qué echaría en falta (para tus agentes)\"**. Siete hallazgos H1–H7, cada uno con: pantalla, qué vi, qué esperaba, cómo comprobarlo (a: leyendo el código / b: necesita datos o ERP), **número propuesto** de \"arreglado\" (propuesta, no exigencia) y estado (contrastado / visto en pantalla).\n7. **Prompt de verificación** (Hormozi, con el ajuste de Bezos de intentar refutar): verificar en el repositorio; intentar refutar antes de confirmar; un veredicto por punto (error / por diseño / no reproducible / no verificable sin ERP); evidencia obligatoria (archivo y línea o consulta, cifra del código frente a la de pantalla); si es error, cambio propuesto y horas; si depende del ERP, qué extracto hace falta; no modificar nada hasta que D. decida.\n8. **Reynasa y el \"cuenta conmigo\" abierto: fuera de este correo.** El \"cuenta conmigo\" se demuestra cumpliendo la promesa del punto 4. Reynasa va en el segundo correo, como pregunta, cuando se haya entregado lo prometido (Bezos, Buffett, Graham, Hormozi, Martell, Wickman). Voto particular previsible: Gary Vee (una línea al final, sin vender).\n\n## Condiciones (comprobables)\n- **Antes de enviar (1–2 h):** cuadrar la herramienta consigo misma (los 1,2 M€); pedir a Contabilidad, Compras o Almacén el saldo con fecha del almacén 20 y de la ref. V-2; confirmar con alguien de operaciones si esos seis centros están inactivos.\n- **El día del envío:** reabrir las pantallas del central, de las V16, de \"Le falta\" y de Estado de datos, y poner la fecha de lectura junto a cada cifra.\n- Ningún supuesto de los consejeros entra como hecho (8 %, 68 k€, 0,7 M€, 21 uds./día, 7.560 uds./año, minutos de lectura, horas por opción). El 1 % solo como propuesta a acordar.\n- Sin dueños exigidos: una sola pregunta de dueño (la carga) y los números como propuesta en el anexo.\n- Rubén revisa y envía él mismo.\n\n## Próximos pasos\n| Qué | Quién | Cuándo |\n|---|---|---|\n| Pedir el saldo del almacén 20 y de la ref. V-2 y confirmar los seis centros | Rubén | mié 14/10 |\n| Decidir si puede hacer la promesa (¿tiene acceso a un extracto del ERP?) | Rubén | mié 14/10 |\n| Ajustar el texto final con lo que salga y revisarlo | Claude y Rubén | jue 15/10 por la mañana |\n| Reabrir pantallas y enviar | Rubén | jue 15/10 |\n| Entregar las tres cifras contrastadas (si se prometió) y, con eso, abrir lo de Reynasa | Rubén | vie 23/10 |\n\n**Prueba más barata:** reabrir cuatro pantallas y hacer una consulta a Contabilidad (menos de una hora).\n**Cuándo abandonar B:** si al reabrir o contrastar resulta que **dos de los tres puntos del cuerpo** (central, V16 / centros, carga) ya no se reproducen o se explican por diseño, pasar a **C**: correo corto de agradecimiento con un titular y proponer verlo juntos, sin anexo.\n**Reto para Rubén (Martell):** si sabe que D. procesa su correo con agentes, A y B valen lo mismo; si no lo sabe, B.\n"}], "veredicto": {"mesa": "consejo", "modo": "completa"}, "generado": "13/10/2026 16:14", "url": "https://rubeniarey.github.io/mesa-debate/"}</script>

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // El contenido se pinta con JS: si la URL trae #seccion, saltar a ella al terminar

  const limpio = s => String(s || '').replace(/\*\*|`|\[|\]/g, '').replace(/\s+/g, ' ').trim();

  const lineaDe = (r, t) => {
    if (t.apoyo != null) {
      const enm = t.enmienda && !/^ninguna/i.test(t.enmienda) ? ' Mi enmienda: ' + limpio(t.enmienda) : ' Sin enmiendas.';
      return corta(`Apoyo la resolución con un ${String(t.apoyo).replace('.0', '')} sobre 10.` + enm, 300);
    }
    let txt = limpio(t.postura);
    if (t.movido && !/^nada/i.test(limpio(t.movido)) && r.id !== 'ronda-1') txt += ' Lo que me ha movido: ' + limpio(t.movido);
    return corta(txt, 300);
  };
  const turnos = [];
  rondas.forEach((r, ri) => {
    turnos.push({tipo: 'ronda', ri, r});
    r.tarjetas.forEach(t => turnos.push({tipo: 'habla', ri, r, t, texto: lineaDe(r, t)}));
  });
  if (v.etiqueta) turnos.push({tipo: 'veredicto'});
  if (D.estado === 'en curso') turnos.push({tipo: 'espera'});

  let idx = 0, tok = 0, pausa = true, vel = 1, saltar = false;
  const asientos = [...document.querySelectorAll('.st')];
  const arco = $('arco');
  const forma = (slug, f) => { const b = document.querySelector(`#st-${slug} .bust`); if (b) b.dataset.shape = f; };
  const estado = (slug, cls) => asientos.forEach(a => {
    a.classList.toggle('speaking', cls === 'speaking' && a.dataset.slug === slug);
    if (cls === 'thinking-all') a.classList.add('thinking'); else if (cls !== 'keep') a.classList.remove('thinking');
  });
  const dormir = ms => new Promise(res => {
    const t0 = tok, fin = Date.now() + ms / vel;
    (function mirar() { if (t0 !== tok || saltar) return res(); if (pausa) return setTimeout(mirar, 120); if (Date.now() >= fin) return res(); setTimeout(mirar, 40); })();
  });
  const alFeed = html => { const f = $('feed'); const vacio = f.querySelector('.vacio'); if (vacio) vacio.remove(); f.insertAdjacentHTML('afterbegin', html); };
  const progreso = () => { $('pProg').style.width = (100 * idx / Math.max(1, turnos.length)) + '%'; };
  const marcarSaltos = ri => document.querySelectorAll('[data-salto]').forEach(b => b.classList.toggle('on', String(b.dataset.salto) === String(ri)));

  async function hablar(turno) {
    const {t, r, texto, ri} = turno; const t0 = tok;
    estado(t.slug, 'speaking'); arco.classList.add('focus');
    // los que aún no han hablado en esta ronda siguen "pensando"
    const yaHablaron = new Set(r.tarjetas.slice(0, r.tarjetas.indexOf(t) + 1).map(x => x.slug));
    asientos.forEach(a => a.classList.toggle('thinking', !yaHablaron.has(a.dataset.slug) && r.tarjetas.some(x => x.slug === a.dataset.slug)));
    $('pRonda').textContent = `Ronda ${ri + 1} de ${rondas.length}`;
    $('pTitulo').textContent = `${t.nombre}${t.preferida ? ' · prefiere ' + t.preferida : ''}`;
    const linea = $('pLinea'); linea.textContent = '';
    for (let i = 0; i < texto.length; i++) {
      if (t0 !== tok) return;
      if (saltar) { linea.textContent = texto; break; }
      while (pausa && t0 === tok) await new Promise(res => setTimeout(res, 120));
      const ch = texto[i].toLowerCase();
      linea.textContent += texto[i];
      const f = 'aáeéiíà'.includes(ch) ? 'open' : 'oóuúwy'.includes(ch) ? 'mid' : 'mbpfv .,;:'.includes(ch) ? 'base' : null;
      if (f) forma(t.slug, f);
      await new Promise(res => setTimeout(res, (/[.,;:]/.test(ch) ? 90 : 24) / vel));
    }
    forma(t.slug, 'base'); saltar = false;
    alFeed(`<li data-ir="c-${r.id}-${t.slug}">${av(t.slug, t.nombre)}<div><span class="n">${esc(t.nombre)}</span><span class="r">R${ri + 1}</span><div>${esc(corta(texto, 170))}</div></div></li>`);
    await dormir(1300);
  }

  async function jugar(turno) {
    const t0 = tok;
    if (turno.tipo === 'ronda') {
      arco.classList.remove('focus'); estado(null, 'thinking-all'); marcarSaltos(turno.ri);
      $('pRonda').textContent = `Ronda ${turno.ri + 1} de ${rondas.length}`;
      $('pTitulo').textContent = turno.r.titulo.split(' · ')[1] || turno.r.titulo;
      $('pLinea').textContent = turno.r.explicacion;
      alFeed(`<li class="sys">${esc(turno.r.titulo)}</li>`);
      await dormir(2400);
    } else if (turno.tipo === 'habla') {
      await hablar(turno);
    } else if (turno.tipo === 'veredicto') {
      arco.classList.remove('focus'); estado(null, 'none'); marcarSaltos('v');
      $('pRonda').textContent = 'Veredicto';
      $('pTitulo').textContent = `${v.etiqueta} · ${v.puntuacion} / 10`;
      $('pLinea').innerHTML = `Opción recomendada: <b>${esc(v.recomendada)}</b>. El detalle, las cuentas y el texto final están abajo, en «Veredicto».`;
      alFeed(`<li class="sys">Veredicto: ${esc(v.etiqueta)} · ${esc(v.puntuacion)} / 10</li>`);
    } else if (turno.tipo === 'espera') {
      estado(null, 'thinking-all'); arco.classList.remove('focus');
      $('pRonda').textContent = 'En curso';
      $('pTitulo').textContent = 'Los consejeros están escribiendo la siguiente ronda';
      $('pLinea').textContent = 'La página se actualiza sola cada minuto.';
    }
    if (t0 === tok) { idx++; progreso(); }
  }

  async function bucle() {
    const t0 = tok;
    while (idx < turnos.length && t0 === tok) {
      if (pausa) { await new Promise(res => setTimeout(res, 150)); continue; }
      await jugar(turnos[idx]);
    }
    if (idx >= turnos.length && t0 === tok) { pausa = true; $('bPlay').textContent = '↺ Repetir'; }
  }
  const reiniciarDesde = i => { tok++; idx = i; saltar = false; asientos.forEach(a => forma(a.dataset.slug, 'base')); progreso(); bucle(); };

  $('bPlay').addEventListener('click', () => {
    if (idx >= turnos.length) { $('feed').innerHTML = ''; pausa = false; $('bPlay').textContent = '⏸ Pausa'; return reiniciarDesde(0); }
    pausa = !pausa; $('bPlay').textContent = pausa ? '▶ Seguir' : '⏸ Pausa';
  });
  $('bSig').addEventListener('click', () => { saltar = true; if (pausa) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } });
  $('bVel').addEventListener('click', () => { vel = vel === 1 ? 2 : vel === 2 ? 3 : 1; $('bVel').textContent = 'x' + vel; });
  document.querySelectorAll('[data-salto]').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.salto;
    const i = s === 'v' ? turnos.findIndex(x => x.tipo === 'veredicto') : turnos.findIndex(x => x.tipo === 'ronda' && x.ri === Number(s));
    pausa = false; $('bPlay').textContent = '⏸ Pausa'; reiniciarDesde(Math.max(0, i));
  }));
  $('feed').addEventListener('click', ev => { const li = ev.target.closest('[data-ir]'); if (!li) return; const c = $(li.dataset.ir); if (c) { c.scrollIntoView({behavior: 'smooth', block: 'center'}); const d = c.querySelector('details'); if (d) d.open = true; } });
  asientos.forEach(a => a.addEventListener('click', () => {
    const r = rondas[Math.max(0, (turnos[Math.min(idx, turnos.length - 1)] || {}).ri ?? 0)];
    const c = r && $(`c-${r.id}-${a.dataset.slug}`); if (c) c.scrollIntoView({behavior: 'smooth', block: 'center'});
  }));

  // Parpadeo de todos para que la sala parezca viva
  asientos.forEach((a, i) => {
    const b = a.querySelector('.bust'); if (!b) return;
    const parpadea = () => { if (b.dataset.shape === 'base') { b.dataset.shape = 'blink'; setTimeout(() => { if (b.dataset.shape === 'blink') b.dataset.shape = 'base'; }, 130); } setTimeout(parpadea, 2400 + Math.random() * 4200); };
    setTimeout(parpadea, 600 + i * 530);
  });

  progreso();
  bucle();
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!quieto && !location.hash) setTimeout(() => { if (pausa && idx === 0) { pausa = false; $('bPlay').textContent = '⏸ Pausa'; } }, 1500);

  // Mientras el debate está en curso, la página se recarga sola cada minuto
  if (D.estado === 'en curso') setTimeout(() => location.reload(), 60000);
})();
</script>
</body>
</html>
