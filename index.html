y una carga que depende de una persona"}, {"slug": "buffett", "nombre": "Warren Buffett", "pilar": "Dinero y capital", "retrato": true, "peso": 2, "motivo": "Hay 0,8 M€ inmovilizados y riesgo de reputación para Rubén si una cifra está mal"}, {"slug": "graham", "nombre": "Paul Graham", "pilar": "Producto y crecimiento", "retrato": true, "peso": 2, "motivo": "Es una v1 de producto para validar un enfoque: qué quieren de verdad los usuarios y qué es lo mínimo que hay que arreglar"}, {"slug": "martell", "nombre": "Dan Martell", "pilar": "Personas y tiempo", "retrato": true, "peso": 2, "motivo": "El tiempo de D. y de Rubén: quién hace cada arreglo y cuánto cuesta en agenda"}, {"slug": "hormozi", "nombre": "Alex Hormozi", "pilar": "Oferta, precio y venta", "retrato": true, "peso": 1, "motivo": "Cómo \"vender\" el feedback para que D. diga que sí y cuente con Rubén"}, {"slug": "garyvee", "nombre": "Gary Vee", "pilar": "Marketing y atención", "retrato": true, "peso": 1, "motivo": "Cómo captar la atención de un superior ocupado y dar valor antes de pedir"}], "etapas": [{"id": "brief", "tipo": "brief", "titulo": "Planteamiento", "explicacion": "Lo que se le dio a la mesa: la decisión, el contexto, las opciones y el peso de cada consejero.", "hora": "13/10/2026 16:01", "md": "\n## La decisión\n¿Qué feedback enviar a D. (responsable de la herramienta) (superior / dirección) sobre su herramienta **Surtidos X**, y cómo enviárselo?\n\n## El contexto\n- D. dio acceso a Rubén (12-oct-2026) a **Surtidos X**: web de planificación de demanda y surtido por centro y lineal. Es una **primera versión** \"para validar el enfoque con datos reales\"; pide feedback: \"qué te parece, qué echas en falta o qué cambiarías\". Dice que puede ponerse a punto con IT y los requisitos de cada área.\n- D. tiene Claude y Claude Code y ha construido la herramienta con un repositorio y agentes (supuesto basado en lo que dice Rubén).\n- Rubén revisó todas las secciones leyendo la pantalla (no contrastó con el ERP ni con contabilidad). Hallazgos:\n  1. **Almacén central (código 20)**: 6,0 M€ de los 11,8 M€ de stock de la red (3,2 M€ neumáticos). No sale en la lista de Almacenes (esa suma 4,6 M€), sin cobertura, y fuera del \"exceso\" del Resumen (2,1 M€).\n  2. **Balizas V16**: 41.668 uds. (0,85 M€) con 2.013 días de cobertura, clasificada A y en \"Le falta\"; la primera propuesta de traspaso son 373 balizas a Grúas-G (7.639 €), centro con stock negativo. La ref. V-2 (5.956 uds. en central) no está excluida de la venta como las otras V16.\n  3. **Centros inactivos** (Centro-A, Centro-B, Centro-C, Centro-D, Centro-E, Centro-F) encabezan \"Le falta\". No hay marca de centro activo.\n  4. **Estacionalidad con un solo año** (histórico desde 06/10/2025): índices muy dispares en neumáticos (×0,58 a ×2,06) y cadenas de nieve como \"stock muerto\" en octubre.\n  5. **Carga diaria**: falló 11, 12 y 13-oct (Metabase 403/522, requiere login manual); base de datos 408,7 de 500 MB.\n  6. **Datos que no cuadran**: stock negativo (Lunas −49.045 €), stock muerto mayor que el stock (Lunas-L), cobertura ∞ con ventas, venta 12M mezclada con mano de obra y promociones (~24 M€ de 39,5 M€ no es producto almacenable).\n  7. **Faltan**: curva de estacionalidad mensual por categoría, nivel de lineal (Cliente-H vacío), priorización por € (8.140 \"Le falta\", 10.265 traspasos, 141.120 líneas de cálculo), permisos y trazabilidad (cualquiera cambia Parámetros).\n  - Lo bueno: cada pantalla explica su cálculo, se pueden excluir eventos, hay detalle por almacén y referencia, exportación a Excel, pantalla de estado de datos.\n- Hay un borrador de correo largo con todo lo anterior, ya redactado.\n\n## Recursos y plazo\nSolo tiempo de Rubén y de Claude para redactar. Plazo: responder esta semana (D. escribió el 12-oct).\n\n## Qué sería un éxito (Rubén)\nAportar valor a D. para que pueda **presentarlo mejor**, no tumbarlo ni frenarlo; que cuente con Rubén en el futuro para esto y más; y que la misma idea sirva también para Reynasa.\n\n## Hacia dónde se inclina Rubén\nMandar el feedback **completo**, porque D. tiene Claude Code y sus agentes podrán **verificar en el repositorio** si lo dicho es cierto; si lo confirman, eso le da más valor. Quiere incluir en el correo la recomendación de pasar el feedback a sus agentes y que le propongan cambios.\n\n## Opciones\n- **A. Completo + verificación**: correo con todos los hallazgos y cifras, recomendando a D. que lo pase a sus agentes de Claude Code para verificarlo (la idea de Rubén).\n- **B. Lo grave + anexo**: correo con 3–5 problemas que bloquean el uso y un anexo con el resto; también sugiere la verificación con agentes.\n- **C. Reunión primero**: correo corto con 3 titulares y proponer verlo juntos.\n- **D. Piloto acotado**: proponer usarla solo en una zona o familia con condiciones antes de ampliar, adjuntando los hallazgos.\n- **E. No hacer nada de momento**: contestar solo con un \"gracias, lo estoy revisando\" y esperar.\n\n\n## Mesa\nEl Consejo (modo completo). Publicación: anonimizada.\n\n## Pesos\n| Consejero | Peso | Motivo |\n|---|---|---|\n| bezos | 3 | Es una decisión de cómo tratar al \"cliente\" (D., superior) y de reversibilidad: cómo entregar algo incómodo sin dañar la relación |\n| wickman | 3 | Casi todos los hallazgos son de operaciones y datos: quién es dueño de qué, procesos, números que no cuadran y una carga que depende de una persona |\n| buffett | 2 | Hay 0,8 M€ inmovilizados y riesgo de reputación para Rubén si una cifra está mal |\n| graham | 2 | Es una v1 de producto para validar un enfoque: qué quieren de verdad los usuarios y qué es lo mínimo que hay que arreglar |\n| martell | 2 | El tiempo de D. y de Rubén: quién hace cada arreglo y cuánto cuesta en agenda |\n| hormozi | 1 | Cómo \"vender\" el feedback para que D. diga que sí y cuente con Rubén |\n| garyvee | 1 | Cómo captar la atención de un superior ocupado y dar valor antes de pedir |\n"}, {"id": "ronda-1", "tipo": "ronda", "titulo": "Ronda 1 · Posiciones iniciales", "explicacion": "Cada consejero opina por separado, sin ver lo que dicen los demás.", "hora": "13/10/2026 16:06", "tarjetas": [{"slug": "bezos", "nombre": "Jeff Bezos", "postura": "Elijo B. Una página con lo que bloquea el uso, medido en euros, y el resto en anexo marcado \"a verificar\". Además, pido que los agentes de D. lo comprueben.", "puntuaciones": {"A": 7.0, "B": 9.0, "C": 6.0, "D": 5.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Elijo B. Una página con lo que bloquea el uso, medido en euros, y el resto en anexo marcado \"a verificar\". Además, pido que los agentes de D. lo comprueben.\n\nPUNTUACIONES: A=7, B=9, C=6, D=5, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **La puerta.** El contenido es de dos sentidos: un segundo correo corrige una cifra. Lo que no se deshace es la primera impresión que D. se lleva de tu criterio. Esa es una falsa puerta de dos sentidos. \"Type 2 decisions can and should be made quickly by high judgment individuals or small groups.\" (S063) Decide esta semana, sin esperar al ERP, pero con cada cifra etiquetada. Tus cuentas deben cuadrar antes de salir: 11,8 − 6,0 (central) − 4,6 (lista de Almacenes) deja 1,2 M€ sin explicar (supuesto: otra partida que no has anotado, o una lectura de pantalla). Si D. lo ve antes que tú, la crítica se vuelve contra ti. Mi lente de diez años pesa poco aquí, porque casi todo es de dos sentidos y de agenda de una semana. Lo que sí aplica es la reversibilidad de la relación.\n- **El cliente, hacia atrás.** Dentro de diez años D. seguirá queriendo una herramienta cuyas cifras nadie le tumbe en una sala. El feedback le sirve si va ordenado por euros, no por volumen. En la cabecera pondría tres cosas.\n  - La central pesa 6,0 de 11,8 M€, un 50,7 % del stock, y queda fuera del \"exceso\" de 2,1 M€ que presenta el Resumen.\n  - V16 son 0,85 M€ con 2.013 días de cobertura (5,5 años), clasificada \"Le falta\", y propone mover 373 uds (7.639 €) a un centro con stock negativo. Con un 8 % de coste de capital (supuesto) son unos 68 k€ al año solo por tenerlas paradas.\n  - 24 de 39,5 M€ de venta (61 %) no es producto almacenable. Si la cobertura usa esa venta (supuesto), queda subestimada unas 2,5 veces y empuja a \"Le falta\". Los centros inactivos encabezan esa lista.\n\n  El resto va al anexo. \"The memo should be like angels singing up from high. It's so clear and beautiful. And then the meeting could be messy.\" (S001) Con A, D. hace el triaje que te toca hacer a ti.\n- **La verificación barata.** A los agentes de D. les cuesta horas, así que no discutas con él: que la hagan. Tu idea es buena y la mantengo, con un ajuste. Que cada hallazgo vuelva con la consulta o la línea de código que lo prueba, no con un \"confirmado\". \"When the data and the anecdotes disagree, the anecdotes are usually right.\" (S045) Tus anécdotas son la prueba más fuerte: balizas a un centro en negativo y centros cerrados arriba. Empieza por ellas. Abre concediendo lo bueno (cada pantalla explica su cálculo, hay exclusión de eventos, hay estado de datos). Es un buen experimento v1, y falla en operación que ya conocéis (carga, cuadre), no en la idea. \"Being wrong may be less costly than you think, whereas being slow is going to be expensive for sure.\" (S064) Cierra ofreciendo 30 minutos para ver juntos lo que devuelvan. Esa es la C, pero como segundo paso y no como sustituto del escrito.\n\nRIESGO PRINCIPAL: Que una cifra de la cabecera esté mal leída en pantalla y D., o sus agentes, la refuten, y el mensaje que quede sea \"Rubén no entendió la herramienta\".\n\nRIESGO DE RUINA en la preferida: no. El peor caso es una cifra equivocada, que cuesta credibilidad y se corrige con un segundo correo. Lo único cercano a un solo sentido es tu credibilidad con D., y las condiciones la protegen.\n\nCONDICIONES:\n- Antes de enviar, dedica unas 2 horas (supuesto) a cuadrar las 3 cifras de cabecera, incluida la diferencia de 1,2 M€. Lo que no cuadre se etiqueta \"visto en pantalla, no contrastado con ERP/contabilidad\".\n- Cabecera de una página, con 3 o 4 hallazgos como máximo. Cada uno lleva su cifra, por qué importa y qué pides. El anexo lleva el resto como \"hipótesis a verificar\".\n- Una línea de \"mientras tanto\": no ejecutar los traspasos propuestos hasta verificar V16 y los centros inactivos. Eso protege dinero real y protege a D.\n- Petición explícita: que sus agentes verifiquen devolviendo evidencia reproducible, más una oferta de 30 minutos para verlo juntos.\n- Reynasa queda fuera de este correo. \"You earn trust slowly, over time, by doing hard things well\" (S041). Primero se gana esa confianza y después se propone lo demás.\n\nPREGUNTA A OTRO CONSEJERO: A Buffett. De las cifras de cabecera (6,0 M€ de la central, 0,85 M€ de V16, 24 de 39,5 M€ de venta no almacenable), ¿cuál aguantaría una revisión de contabilidad y cuál etiquetarías \"a verificar\"? ¿Y cómo valorarías las V16 sin salida, a coste o a valor realizable?\n\nNOTA DE MI ÁREA: 8. B deja todas las puertas abiertas: escala a C o a D si D. lo pide, cuesta poco deshacerla y sirve al cliente a diez años.\n\nCONFIANZA: 4. Me faltan la relación real con D. y el contraste de las cifras con el ERP."}, {"slug": "wickman", "nombre": "Gino Wickman", "postura": "Con todo el cariño y respeto, Rubén, no mandes los siete hallazgos mezclados. Mándalos agrupados en tres raíces con su cifra, el resto en un anexo, y cierra proponiendo un dueño y un número semanal (B).", "puntuaciones": {"A": 5.0, "B": 9.0, "C": 4.0, "D": 6.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Con todo el cariño y respeto, Rubén, no mandes los siete hallazgos mezclados. Mándalos agrupados en tres raíces con su cifra, el resto en un anexo, y cierra proponiendo un dueño y un número semanal (B).\n\nPUNTUACIONES: A=5, B=9, C=4, D=6, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Son tres raíces, no siete problemas.** Es el marco de Six Key Components: \"go to the root of their issue and solve it there 136 issues just kind of fell away\" (S043).\n  - **Datos:** el almacén 20 pesa 6,0 de 11,8 M€ (51%) y no sale en Almacenes ni en el exceso. Además 11,8 − 6,0 − 4,6 deja 1,2 M€ sin explicar (supuesto: stock negativo u otros códigos). Unos 24 de los 39,5 M€ de venta (61%) no son producto almacenable, lo que puede inflar las 8.140 líneas \"Le falta\" (supuesto: si la cobertura usa esa venta).\n  - **Proceso y Personas:** la carga falló el 11, 12 y 13-oct y exige login manual. La base está al 81,7% (quedan 91,3 MB). Una herramienta que se para si una persona no entra no pasa el test de \"seeing if your business can run without you\" (S029). Si ese login lo hace D. a mano (supuesto), además es trabajo de 25 euros la hora (S029).\n  - **Decisiones:** las recomendaciones no filtran lo básico. Proponen 373 balizas (7.639 €) a un centro con stock negativo, sobre un lote de 41.668 uds. que son 0,85 M€ a 2.013 días (5,5 años de venta). Los centros inactivos encabezan \"Le falta\".\n- **Recorta con IDS y tiempo de v1.** Arriba van solo tres titulares, y el resto pasa a la lista de problemas del anexo (IDS y Issues List, S043).\n  - **Estacionalidad con un solo año:** es un límite de v1 que arregla el calendario, no un bug. Entra en \"live with it\" (S067), y por eso no la pongo arriba.\n  - **Permisos, nivel de lineal, priorización por € y curva mensual:** van al anexo para cuando escale.\n  - **Por qué no las otras:** A entierra los tres que importan entre 141.120 líneas de cálculo. C, sin un escrito, no deja dueño ni To-Do. E es decidir \"live with it\" por no incomodar: \"there's only one of three options and that's to live with it leave it or change it\" (S067). Si el feedback es honesto y con cariño, \"you can't say it wrong\" (S036).\n  - **Dónde falla mi lente:** EOS es para equipos de dirección consolidados, y esto es una v1 que busca encaje y que no es tuya. No le pido a D. Level 10 ni organigrama completo, solo dueño y número. Sobre qué es bloqueante para validar un producto, cedo a Graham. Sobre IA, no tengo posición.\n- **Cierra con dueño y número, no con queja.** Propón una Roca de 90 días, \"datos fiables\", con tres números semanales (Scorecard, S077):\n  - días con carga correcta, de 7 a 7;\n  - diferencia de stock frente al ERP, menos de 1% (supuesto);\n  - % de traspasos propuestos a centros activos, 100%.\n  - Cada número con un dueño que nombre D. o IT. Hoy \"cualquiera cambia Parámetros\", que en la Accountability Chart equivale a nadie.\n  - Y matiza lo de los agentes: un agente en el repositorio verifica que el código calcula lo que dice. No verifica que el stock coincida con el ERP, que no ve (supuesto). Esa contrastación sigue siendo humana.\n\nRIESGO PRINCIPAL: Que una cifra leída solo en pantalla (por ejemplo, los 6,0 M€ del almacén 20) resulte errónea y el correo cueste credibilidad a Rubén ante un superior, en lugar de darle valor a D.\n\nRIESGO DE RUINA en la preferida: no\n\nCONDICIONES:\n1. Antes de enviar, contrasta los tres titulares con ERP o contabilidad: stock total, almacén 20 y ref. V-2. Lo no contrastado va escrito como \"según pantalla, por confirmar\".\n2. Abre con lo que sí funciona: cada pantalla explica su cálculo, se pueden excluir eventos, hay exportación a Excel y pantalla de estado de datos. Di la verdad dura \"open and honest and love\" (S036).\n3. Tres titulares arriba, anexo con el resto, y una petición concreta: 30 minutos con D. para resolverlos con dueño y fecha. Ahí entra la sugerencia de pasarlo a sus agentes, como apoyo y no como sustituto.\n4. Rubén no se convierte en el validador permanente. Si ofrece contrastar cada semana, que sea durante 90 días y con un solo número, y que el dueño de la carga y de los datos lo nombre D.\n5. Esta semana: una hora para contrastar tres cifras y enviarlo el jueves 15-oct. Stay focused.\n\nPREGUNTA A OTRO CONSEJERO: A Graham: si esto es una v1 para validar el enfoque, ¿cuáles de mis tres titulares bloquean de verdad esa validación y cuáles son ruido de v1 que yo sobrevaloro por ser de procesos?\n\nNOTA DE MI ÁREA: 7. Quedan nombradas las raíces, un dueño y un número. Un correo no arregla por sí solo la dependencia del login manual ni la falta de estructura; eso depende de que D. nombre al dueño.\n\nCONFIANZA: 4"}, {"slug": "buffett", "nombre": "Warren Buffett", "postura": "Yo mandaría la B: tres o cuatro hallazgos que muevan euros, marcados como \"visto en pantalla, no contrastado\", y el resto en un anexo. Lo único que Rubén arriesga aquí es su crédito ante D., y el crédito se pierde mucho más rápido de lo que se recupera.", "puntuaciones": {"A": 6.0, "B": 8.0, "C": 5.0, "D": 4.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Yo mandaría la B: tres o cuatro hallazgos que muevan euros, marcados como \"visto en pantalla, no contrastado\", y el resto en un anexo. Lo único que Rubén arriesga aquí es su crédito ante D., y el crédito se pierde mucho más rápido de lo que se recupera.\n\nPUNTUACIONES: A=6, B=8, C=5, D=4, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Los euros que importan son pocos y se comprueban en una tarde.** El almacén central son 6,0 de los 11,8 M€ (51%) y no sale en la lista de Almacenes ni en el \"exceso\" de 2,1 M€. Las V16 son 0,85 M€ con 2.013 días de cobertura, unos 5,5 años. Con un coste de capital del 8% (supuesto) son unos 68 k€ al año de caja parada, sin contar obsolescencia.\n  - La primera propuesta de traspaso mueve 7.639 €, el 0,9% de esa bolsa, y lo manda a un centro con stock negativo. Eso es lo primero que D. debe leer.\n  - No sumo central y V16 porque pueden solaparse: la ref. V-2 tiene 5.956 uds. en central.\n  - La estacionalidad con un solo año y las cadenas de nieve en octubre son importantes pero no se pueden saber con 12 meses de historia. Van al anexo como limitación, no como fallo (Important and knowable, S022).\n- **Rubén no arriesga caja, arriesga crédito, y eso sí es mi pilar.** Mi cuenta de caja casi no aplica: supongo que el stock es de Red X y la relación con Reynasa está pendiente. Rubén leyó pantallas sin contrastar con el ERP ni con contabilidad, así que nueve hallazgos son nueve ocasiones de equivocarse. Uno falso, por ejemplo que el central esté fuera a propósito, desacredita a los tres ciertos. \"We can afford to lose money – even a lot of money. But we can’t afford to lose reputation – even a shred of reputation.\" (S083)\n  - Además, los agentes de D. verificarán en el repositorio lo que hace el código. No sabrán si los 6,0 M€ coinciden con la realidad; eso solo lo dice el ERP. Tu crédito con D. es tu foso: se ensancha con cada cifra que aguanta la comprobación y se estrecha con cada una que no.\n- **Menos hallazgos, más peso.** \"Stick with big, “easy” decisions and eschew activity.\" (S090) Stock negativo (Lunas −49.045 €), stock muerto mayor que el stock, cobertura ∞ con ventas y ~24 de 39,5 M€ de venta que no es producto almacenable son un solo hallazgo con ejemplos. \"In the world of business, bad news often surfaces serially: You see a cockroach in your kitchen; as the days go by, you meet his relatives.\" (S087)\n  - Una cucaracha es un error; cuatro dicen que la base no cuadra consigo misma. Eso son tres líneas, no veinte.\n  - Con el anexo completo no hay error de omisión (S028). La E sí lo es: saber que hay 6,0 M€ fuera del radar y contestar \"gracias\" es el tipo de error que nunca sale en los libros.\n\nRIESGO PRINCIPAL: Que alguno de los titulares tenga una explicación legítima (por ejemplo, el central excluido a propósito) y Rubén lo haya presentado como error, perdiendo crédito ante D. en la primera frase.\n\nRIESGO DE RUINA en la preferida: no. El peor caso es perder crédito ante D., que es una pérdida acotada y reparable con una corrección. No hay deuda, caja propia ni terceros que puedan cortar el grifo. Solo subiría a \"posible\" si se afirmaran como hechos cifras sin contrastar.\n\nCONDICIONES:\n- **Una hora de Rubén antes de enviar.**\n  - Cuadrar la herramienta consigo misma: 11,8 − 6,0 = 5,8 M€ fuera del central, frente a los 4,6 M€ de la lista de Almacenes. Quedan 1,2 M€ sin explicar. Es mi cuenta y puede haber una explicación que no veo (supuesto).\n  - Contrastar con el ERP, o con alguien de Compras o Almacén, el central (6,0 M€) y las V16 (41.668 uds.).\n  - Si no da tiempo esta semana, se envía igual con la etiqueta \"visto en pantalla, no contrastado\".\n- **Cada titular va como hecho observado, euros y pregunta, no como veredicto.** Por ejemplo: \"¿es intencionado que el central no entre en el exceso?\". D. debería poder leerlo en voz alta delante de su jefe y que pase la prueba del periódico (S028).\n- **Una frase de salvaguarda:** mientras no cuadre con el ERP, no se ejecutan traspasos desde la pantalla. Eso da casi todo el valor de la D sin proponer un piloto que a Rubén no le toca dictar.\n- **Anexo completo y sin recortar.** Las carencias de producto (curva mensual, lineal, permisos) las deben pedir las áreas, no dictarlas Rubén. Fuera de su círculo: él lee datos, no planifica surtido (Circle of competence, S022).\n- **Recomendar la verificación con agentes en dos capas:** qué hace el código y si el resultado cuadra con el ERP.\n\nPREGUNTA A OTRO CONSEJERO: A Graham: en una v1 hecha para validar el enfoque, ¿es razonable que no cuadre con el ERP, o eso es justo lo primero que hay que validar? ¿Cuál es el mínimo de cifras que tendrían que cuadrar para que la prueba valga? Quiero saber si le estoy pidiendo rigor de balance a un prototipo.\n\nNOTA DE MI ÁREA: 7. Con la B la caja de Rubén no corre riesgo, su crédito queda protegido y se señalan los 6,0 M€ ciegos. No llega a 9 porque las cifras siguen sin contrastar con el ERP y la pantalla sigue en uso mientras tanto.\n\nCONFIANZA: 4"}, {"slug": "graham", "nombre": "Paul Graham", "postura": "Mandad el feedback como lo manda un buen usuario a un buen fundador: 3 o 4 cosas que rompen la confianza, cada una con su cifra y su prueba de cinco minutos, y el resto en un anexo para los agentes de D. Eso es la B; la A, tal como está, entierra la señal.", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 5.0, "D": 6.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Mandad el feedback como lo manda un buen usuario a un buen fundador: 3 o 4 cosas que rompen la confianza, cada una con su cifra y su prueba de cinco minutos, y el resto en un anexo para los agentes de D. Eso es la B; la A, tal como está, entierra la señal.\n\nPUNTUACIONES: A=5, B=8, C=5, D=6, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **D. pide a un usuario que le diga dónde se rompe la confianza, no que le haga una auditoría.** \"Launching teaches you what you should have been building.\" (S142) (\"Lanzar te enseña lo que deberías haber estado construyendo.\") Un comprador deja de fiarse en la primera pantalla por tres cosas, y las tres son del brief.\n  - El Resumen mide la mitad del stock. El central (6,0 M€) es el 51% de los 11,8 M€ de la red y queda fuera de la lista y del \"exceso\" (2,1 M€, un 18%). Si solo la mitad de los 3,2 M€ de neumáticos del central fuera sobrante (supuesto), el exceso pasaría de 5,3 a 3,7 M€ (+75%).\n  - Los números tampoco cuadran entre sí. Sin el central, 11,8 − 6,0 = 5,8 M€, y la lista suma 4,6 M€: faltan 1,2 M€ que no explica nadie (supuesto: almacenes no listados o netos negativos; no lo sé).\n  - La primera recomendación que ve un usuario es absurda. Las V16 son 0,85 M€ (7% del stock) con 2.013 días de cobertura, o sea 5,5 años. Además proponen traspasar 373 uds. a un centro con stock negativo. Eso son unos 18 días de venta de toda la red, a razón de ~21 uds./día (supuesto: la cobertura se calcula sobre la red).\n  - Una v1 puede ser pequeña, pero no puede ser mala (\"Launch fast and iterate\": mínima, no con bugs, S142). Aquí además no es una app de tareas: un traspaso erróneo es caja inmovilizada, así que tolero menos el \"sacadlo y ya arreglaréis\".\n- **Cuatro o cinco, no siete más siete.** \"The number one thing not to do is other things.\" (S166) (\"Lo primero que no hay que hacer es otras cosas.\") D. tiene un solo cuello de botella: que alguien se fíe de los números el lunes por la mañana.\n  - Entran en el cuerpo: el central ausente, las V16 y su propuesta de traspaso, los centros inactivos que encabezan \"Le falta\", y la carga caída tres días (11, 12 y 13-oct). Una herramienta que no se refresca no se abre dos veces.\n  - Los permisos, el lineal de Cliente-H, la curva mensual y la priorización por € son deseos de v2. Los usuarios los pedirán cuando confíen en la v1. Van al anexo.\n  - Esto sirve a lo que busca Rubén: darle a D. las preguntas que le harían en una presentación y que hoy no sabe contestar.\n- **La verificación con agentes es buena idea; la parte de \"completo\" no.** Un agente con el repositorio comprueba en minutos si el código 20 está filtrado o si falta la ref. V-2 en la exclusión. El anexo, en formato de tabla (pantalla, cifra, causa probable, prueba), es lo que ellos consumen, así que B conserva todo el valor de A.\n  - Rubén leyó pantalla y no contrastó con el ERP (supuesto del brief). Si un número es un malentendido y va afirmado en el cuerpo, se pierde la credibilidad ante un superior. Tiene que ir como \"esto veo, compruébalo\".\n  - Mi única adición de producto no es un fallo, es una pregunta que el brief no contesta: ¿quién es el primer usuario y qué decisión toma con esto el lunes? \"A need that's narrow but genuine is a better starting point than one that's broad but hypothetical.\" (S174) (\"Una necesidad estrecha pero real es mejor punto de partida que una amplia pero hipotética.\") Propuesto como sugerencia (\"una familia, un comprador, cuadrada al euro con el ERP\"), no como condición. Si es condición, frena, y Rubén no quiere frenar.\n\nRIESGO PRINCIPAL: Que alguno de los 3 o 4 hallazgos del cuerpo sea un malentendido de lectura de pantalla y le reste credibilidad ante un superior en la primera impresión, con lo que Rubén pierde el \"contad conmigo\".\n\nRIESGO DE RUINA en la preferida: no. Es un correo, el coste peor es fricción y reputación de Rubén, no de la empresa. Los 0,85 M€ de V16 y los 6,0 M€ del central son un problema de la herramienta, no de enviar el correo.\n\nCONDICIONES:\n- Cuerpo de una página. Cada hallazgo lleva qué veo, la cifra, por qué un comprador dejaría de fiarse y cómo comprobarlo en cinco minutos.\n- Dicho con claridad que es \"visto en pantalla, no contrastado con el ERP\".\n- Abrir con lo bueno concreto, que es real: cada pantalla explica su cálculo, se pueden excluir eventos, hay exportación y estado de datos. No es cortesía.\n- Anexo para los agentes, con recomendación de pasarlo tal cual y pedirles que propongan cambios.\n- Cierre con un paso pequeño: 20 minutos en pantalla compartida y la oferta de probarlo con una familia.\n- Enviarlo esta semana, antes de que D. lo enseñe a otros.\n\nPREGUNTA A OTRO CONSEJERO: A Buffett: de mis hallazgos, ¿cuáles pondrías en el cuerpo con cifra y cuáles como \"a verificar\", sabiendo que leí pantalla y no contrasté con el ERP? ¿Qué cifra, si está mal, me cuesta más reputación?\n\nNOTA DE MI ÁREA: 7. B da a D. la mejor señal de producto, concentrada, comprobable y con un estrechamiento sugerido. No llega a 9 porque sigue sin haber prueba de uso real (quién la abre y cuántas veces por semana) y el brief no la trae.\n\nCONFIANZA: 4. Mi lente falla en parte: esto es una herramienta interna para un superior, no un producto que se vende, y el \"crecimiento\" aquí no se mide en semanas. Pesa más la relación con D., que dejo a Bezos y a Gary V. Tampoco sé la relación exacta Reynasa–Red X ni cómo recibe D. las críticas."}, {"slug": "martell", "nombre": "Dan Martell", "postura": "B. Tres a cinco bloqueos en una pantalla y el resto en un anexo listo para que lo procesen los agentes de D., con dueño y fecha por bloque. El contenido de A está bien; lo que falla es el orden.", "puntuaciones": {"A": 7.0, "B": 9.0, "C": 3.0, "D": 5.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: B. Tres a cinco bloqueos en una pantalla y el resto en un anexo listo para que lo procesen los agentes de D., con dueño y fecha por bloque. El contenido de A está bien; lo que falla es el orden.\n\nPUNTUACIONES: A=7, B=9, C=3, D=5, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **La agenda de D. es el cuello de botella.** \"Your inbox is nothing more than a public to-do list of other people's priorities on your time.\" (S004) (tu bandeja es la lista pública de tareas con las prioridades de otros sobre tu tiempo). \"You know why they call it a bottleneck, cuz it's at the top.\" (S031) (la botella se estrecha por arriba).\n  - Un correo con 7 grupos de hallazgos y más de 20 cifras (supuesto: unas 1.500 palabras, unos 8 minutos de lectura) cae sobre esa agenda. Si lo primero que ve es un muro, lo defiende o lo aparca.\n  - Si ve en 300 palabras un 1-3-1 (S031), delega. El problema: hoy propondría traspasos con datos que no cuadran. Los bloqueos: 3 a 5. La recomendación: pasa el anexo a tus agentes.\n  - El anexo es el Camcorder Method (S020): Rubén \"grabó\" lo que vio, con ruta de pantalla y cifra, y un agente puede repetirlo. Verificar con agentes es palanca de código (Four C's, S007). Esa parte de A la mantengo.\n- **Quién comprueba y quién cierra.** Delegar sin revisar es mi historia más cara: 500K$ y casi pierdo a Procter and Gamble (S103).\n  - Rubén leyó pantalla y no contrastó con el ERP ni con contabilidad (brief). Los agentes verifican el código, no que los 6,0 M€ del almacén 20 coincidan con el ERP. \"Confirmado en el repositorio\" no es \"cierto en el negocio\".\n  - Cada bloque necesita un nombre y un número. La carga falló los días 11, 12 y 13 y depende de un login manual, o sea de una persona, y la base de datos está al 81,7 % (408,7 de 500 MB). Pido un dueño de IT con un número: 14 días seguidos de carga correcta.\n  - El contraste con el ERP también necesita dueño. Los Parámetros que \"cualquiera cambia\" necesitan un límite de autoridad por nivel (50 to Fix It, S122).\n  - \"When you assign a task, you create a tenant. But when you assign an outcome, you create an owner.\" (S113) (si asignas una tarea creas un inquilino; si asignas un resultado, un dueño).\n- **La agenda de Rubén y por qué E y C pierden.** Horas por opción (supuesto):\n  - A o B: unas 1 h de Rubén (el borrador ya existe) y unas 0,7 h de D.\n  - C: unas 3 h de Rubén y 1 h de D., con los hallazgos aún sin escribir.\n  - D: unas 6 h de Rubén el primer mes y 2 h de D.\n  - E: 0 h hoy, pero Rubén repetirá a mano la revisión de 141.120 líneas cuando la carga vuelva (unas 3 h, supuesto).\n  - E es el Staller (Five Time Assassins, S059): esperar con la carga rota tres días. Y \"cuenta conmigo\" sin límite convierte a Rubén en el QA gratis de D., trabajo rojo de $1 (Time and Energy Audit, S057). La oferta de Rubén debe ser un resultado, un número y dos semanas. Lo de Reynasa va después, sin saltar fases (S122).\n  - Mi lente falla en dos cosas. D. no es mi fundador: no le pongo Buyback Rate ni le digo a quién contratar. Y las horas son supuestos; no sé cuánta capacidad tiene IT.\n\nRIESGO PRINCIPAL: Que D. pase el anexo a los agentes, nadie fije dueño ni fecha, y el correo muera en \"confirmado en el repo\" sin que nadie contraste las cifras con el ERP.\n\nRIESGO DE RUINA en la preferida: no. Es un correo, y se corrige con otro.\n\nCONDICIONES:\n1. Cuerpo de 300 palabras o menos, en formato 1-3-1, con lo bueno de la herramienta en una línea al principio.\n2. Anexo con ID por hallazgo (H1 a H7): dónde se ve, qué vi, qué esperaba, cómo comprobarlo. Marcado \"visto en pantalla, sin contrastar con ERP\".\n3. Pedir a los agentes que devuelvan cada hallazgo como 1-3-1 (problema, tres opciones, una recomendación). También una tabla de confirmado / no confirmado / por diseño en 7 días.\n4. Un dueño con nombre y una fecha por bloque: carga diaria, contraste con el ERP, permisos y Parámetros.\n5. Oferta de Rubén acotada: un resultado, un número y dos semanas (por ejemplo, contrastar 3 cifras clave con un extracto del ERP). Sin compromiso abierto.\n\nReto, Rubén: escríbelo antes de enviar. ¿Quién cierra cada hallazgo y para cuándo? Si la respuesta es \"D., ya veremos\", no has delegado, has soltado.\n\nPREGUNTA A OTRO CONSEJERO: A Wickman. ¿Quién es el dueño con nombre de la carga diaria y del contraste con el ERP (D., IT o Rubén)? ¿Y qué número te basta para dar cada cosa por arreglada?\n\nNOTA DE MI ÁREA: 7. Queda protegida la agenda de D. y acotada la de Rubén, pero mientras no haya dueños con nombre no sube de ahí.\n\nCONFIANZA: 4"}, {"slug": "hormozi", "nombre": "Alex Hormozi", "postura": "Preferida la B. Mándale a D. los 4 problemas que bloquean el uso, ordenados por euros y en forma de pregunta verificable, más un anexo con el resto. Que el correo le ahorre trabajo, y que no se note que no has contrastado con el ERP.", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 4.0, "D": 4.0, "E": 1.0}, "preferida": "B", "confianza": 3.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Preferida la B. Mándale a D. los 4 problemas que bloquean el uso, ordenados por euros y en forma de pregunta verificable, más un anexo con el resto. Que el correo le ahorre trabajo, y que no se note que no has contrastado con el ERP.\n\nPUNTUACIONES: A=5, B=8, C=4, D=4, E=1\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Oferta a D., Value Equation (S115).**\n  - Lo que D. quiere es presentarla a dirección sin sorpresas (resultado soñado). Lo que le cuesta es tiempo de lectura y esfuerzo para digerirlo.\n  - Siete hallazgos y un borrador largo suben ese esfuerzo (supuesto: 15 min de lectura frente a 5). Si lee el sexto punto cansado, ya ha dejado de leer.\n  - Recorta y apila (Grand Slam, S114). Los cuatro que bloquean son:\n    1. El almacén central (código 20): 6,0 M€ de 11,8 M€, el 50,7 % del stock, fuera de Almacenes y sin cobertura.\n    2. Balizas V16: 0,85 M€ y 2.013 días de cobertura. La primera propuesta de traspaso manda 373 balizas (7.639 €) a un centro con stock negativo.\n    3. Centros inactivos encabezando \"Le falta\".\n    4. La carga diaria caída 3 días.\n  - Los dos primeros tocan unos 6,8 M€ de 11,8, el 58 %. Puede haber un solape pequeño: 5.956 balizas en central son unos 0,1 M€ a ~20 €/ud (supuesto).\n  - El resto va en una página de anexo. \"Simple scales, fancy fails.\" (S026) (Lo simple escala; lo sofisticado fracasa.)\n  - Tu idea de que sus agentes verifiquen es lo mejor del plan, porque baja el esfuerzo de D. casi a cero. Llévala un paso más allá: adjunta el prompt ya redactado para pegarlo en Claude Code (\"verifica en el repo estas 4 afirmaciones y propón cambios\"). Eso es entrega \"hecha por ti\" (S114, S115).\n\n- **Primero la prueba, después el veredicto (S032, S042, S068).**\n  - Tu tamaño de prueba es una pasada leyendo pantallas, sin contraste con ERP ni contabilidad.\n  - Tu propia cuenta no cierra: 11,8 − 6,0 = 5,8 M€ y la lista de Almacenes suma 4,6. Son 1,2 M€ sin explicar. Puede ser un hallazgo o puede ser que no hayas visto algo.\n  - Competir en pruebas gana a prometer: tú no puedes copiar lo que ellos pueden verificar en el repo. Pero no discutas con un superior. Formula cada punto como pregunta: \"¿el 20 es el central?, ¿debería salir en Almacenes?, ¿por qué el V-2 no está excluido?\". Si aciertas, ganas. Si fallas, no has acusado a nadie.\n  - Las preguntas que se resuelven con una hoja de cálculo, que las resuelva quien tiene el ERP.\n\n- **Un solo resultado por correo, y el resto después.**\n  - Tienes tres objetivos: que presente mejor, que cuente contigo y que sirva para Reynasa. Meter los tres en un mensaje es empacho (S059, S113). Hoy vende uno: que llegue a la presentación sin sorpresas. Lo demás es la continuidad, y el segundo sí sale más fácil después del primero (S046). La idea Reynasa es \"nuevo\": que espere hasta que el primero funcione (S075).\n  - Descarto las otras opciones por estos motivos:\n    - C: gasta dos agendas y no deja nada escrito.\n    - D: D. no pidió que le diseñes el despliegue.\n    - E: pide feedback ahora, que es su punto de mayor necesidad (S030), y esperar lo enfría.\n\nRIESGO PRINCIPAL: Que una de las cifras gruesas (6,0 M€ o 0,85 M€) sea correcta por diseño y quedes ante un superior como quien audita leyendo pantalla sin contrastar.\n\nRIESGO DE RUINA en la preferida: no. Es reversible: el peor caso es un correo con una cifra discutible que se aclara en una llamada.\n\nCONDICIONES:\n- Abre con lo que funciona: cada pantalla explica su cálculo, se pueden excluir eventos, hay detalle por almacén y referencia, exportación a Excel y pantalla de estado de datos. Después, el resultado para D.: llegar a presentarlo sin sorpresas.\n- Cada uno de los 4 puntos lleva la cifra exacta, la pantalla donde se ve y la pregunta. Marca todo como \"visto en pantalla, sin contrastar con ERP\".\n- Antes de enviar, contrasta las dos cifras mayores (central y V16) con el ERP o con contabilidad. Si cuesta más de unas 2 h (supuesto), envía igualmente etiquetado, pero dentro de esta semana.\n- El prompt para sus agentes va como oferta (\"por si te ahorra tiempo\"), no como instrucción.\n- Cierra con un paso pequeño: 30 min para priorizar con lo que devuelvan los agentes.\n- Deja fuera del correo lo de Reynasa y el \"cuenta conmigo\".\n\nPREGUNTA A OTRO CONSEJERO: A Wickman: de mis 4 bloqueantes, ¿cuáles son de verdad de proceso y datos (carga manual por login, Parámetros sin dueño) y cuál es el mínimo que debe arreglar D. antes de poder enseñarla? ¿Cambiarías el orden?\n\nNOTA DE MI ÁREA: 8. Con B hay una oferta clara para D., con poco esfuerzo para él y con pruebas que puede verificar, y un siguiente paso fácil de aceptar.\n\nCONFIANZA: 3. Mi lente falla aquí. No hay precio ni cierre de venta, el interlocutor es un superior y su orgullo pesa más que la ecuación de valor. Y no puedo juzgar si las cifras son ciertas. Mi franqueza de \"ser real\" solo funciona con la prueba en la mano, así que la ajusto: con un superior y sin contraste, pregunta antes de afirmar."}, {"slug": "garyvee", "nombre": "Gary Vee", "postura": "Prefiero B. Tu borrador largo es la pieza pilar, no el correo: a D. le llega en una pantalla lo bueno más 4 problemas, y el resto va en un anexo pensado para que lo lean sus agentes.", "puntuaciones": {"A": 6.0, "B": 9.0, "C": 5.0, "D": 3.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Prefiero B. Tu borrador largo es la pieza pilar, no el correo: a D. le llega en una pantalla lo bueno más 4 problemas, y el resto va en un anexo pensado para que lo lean sus agentes.\n\nPUNTUACIONES: A=6, B=9, C=5, D=3, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Dos audiencias, dos formatos.** La atención de D. es escasa (supuesto: lee en el móvil entre reuniones). La de sus agentes de Claude Code es infinita. El borrador largo mezcla las dos.\n  - Un borrador de ~1.500 palabras son ~7 min de lectura (supuesto). Un correo de ~450 palabras son ~2 min (supuesto).\n  - Haz una pieza pilar cortada en piezas nativas (S112, S144): \"analyze and repurpose it into 30 other pieces of content\" (S144). El correo es para D. El anexo es para los agentes, con pantalla, referencia, cifra y qué esperabas ver.\n  - Tu agenda de parecer exhaustivo va tercera: \"Respecting the audience, respecting the platform, and taking your agenda and making it third\" (S095).\n  - B contiene a A: no pierdes ni un hallazgo, solo cambias dónde vive.\n- **Primero valor, después la petición, y que la petición sea una sola.** D. ya preguntó el 12-oct \"qué te parece, qué echas en falta o qué cambiarías\". Contesta en ese orden.\n  - Primero lo bueno, en 3 líneas: cada pantalla explica su cálculo, se pueden excluir eventos, hay exportación a Excel y pantalla de estado de datos.\n  - Después 4 cosas que ves en pantalla, cada una comprobable en 2 minutos:\n    - Almacén 20: 6,0 de 11,8 M€ (51%) fuera de la lista de Almacenes y del exceso.\n    - Balizas V16: 0,85 M€, 2.013 días, clasificada A, y 373 uds. a Grúas-G con stock negativo.\n    - Centros inactivos encabezando \"Le falta\".\n    - Carga fallida los días 11, 12 y 13-oct, y base de datos al 82% (408,7 de 500 MB).\n  - Cierra con una oferta: contrastas el stock central con ERP y contabilidad. Así conviertes lo que no hiciste en valor y te ganas el \"cuenta conmigo\".\n  - Siete bloques de arreglos seguidos son siete ganchos: \"if you're trying to sell and throw a right hook all the time, eventually the other person knows how to duck\" (S011). Un solo ask al final: que pase el anexo a sus agentes y te diga qué confirman.\n- **Cómo se dice y cuándo.** Candor amable: \"How you deliver the medicine matters\" (S086).\n  - Escribe \"lo que veo en pantalla, sin contrastar con ERP\". Si los agentes lo confirman, D. lo descubre y se lleva el mérito. Si una cifra es un error de lectura, tú pierdes poco.\n  - Esperar también cuesta. Es una v1 recién abierta y D. está en modo feedback esta semana. Envíalo mañana 14-oct y, como tarde, el jueves 15 (supuesto: la ventana es esta semana).\n\nRIESGO PRINCIPAL: Que una de las 4 cifras del cuerpo sea un error de lectura (no contrastaste con ERP) y la hayas puesto de titular.\n\nRIESGO DE RUINA en la preferida: no. No hay caja en juego. La reputación en juego es acotada y reversible si el tono es \"por verificar\".\n\nCONDICIONES:\n- El cuerpo cabe en una pantalla (~450 palabras, supuesto). Empieza por lo bueno y lleva solo 4 problemas, cada uno con una cifra y su pantalla.\n- Reabre las 4 pantallas justo antes de enviar, porque la carga ha fallado y las cifras pueden haber cambiado.\n- Anexo completo con los 7 grupos, escrito para agentes: pantalla, referencia, cifra, comportamiento esperado.\n- Un solo ask con plazo (\"dime qué confirman tus agentes; si te sirve, 20 min el viernes\") y una oferta tuya concreta (contrastar con ERP).\n- Una línea sobre Reynasa, solo al final y sin vender: \"si funciona, nos interesa para aquí\".\n- Seguimiento a los 7 días con otro jab, por ejemplo una priorización por €.\n\nPREGUNTA A OTRO CONSEJERO: A Wickman: elegí los 4 del cuerpo por llamativos y verificables en 2 minutos. ¿Cuáles de los 7 grupos son de verdad la raíz que bloquea el uso (la carga con login manual, la falta de dueño, los permisos) y deberían ir arriba aunque sean menos vistosos?\n\nNOTA DE MI ÁREA: 8. Con B captas la atención de un superior ocupado y das valor antes de pedir. No llega a 10 porque el anexo sigue pidiendo tiempo y el efecto en la relación no está probado.\n- Mi lente solo ordena la entrega. No sabe qué hallazgos pesan más ni arregla una cifra mala: \"All that good marketing does against a bad product is speeding up everyone knowing that your product sucks\" (S064).\n- Si D. es de los que leen 1.500 palabras, A y B casi empatan. Con B no pierdes nada.\n\nCONFIANZA: 4"}], "presidente_md": "### Notas del Presidente\n\n**Puntuaciones provisionales (pesos: Bezos 3, Wickman 3, Buffett 2, Graham 2, Martell 2, Hormozi 1, Gary Vee 1; suma 14):**\n- A (7×3 + 5×3 + 6×2 + 5×2 + 7×2 + 5×1 + 6×1) / 14 = 83 / 14 = **5,9**\n- B (9×3 + 9×3 + 8×2 + 8×2 + 9×2 + 8×1 + 9×1) / 14 = 121 / 14 = **8,6**\n- C (6×3 + 4×3 + 5×2 + 5×2 + 3×2 + 4×1 + 5×1) / 14 = 65 / 14 = **4,6**\n- D (5×3 + 6×3 + 4×2 + 6×2 + 5×2 + 4×1 + 3×1) / 14 = 70 / 14 = **5,0**\n- E (2×3 + 1×3 + 2×2 + 1×2 + 1×2 + 1×1 + 2×1) / 14 = 20 / 14 = **1,4**\n\n**Control de unanimidad: se dispara.** Los 7 prefieren B con 8 o 9. Es una alarma. La alternativa que nadie ha defendido a fondo es **A, la idea de Rubén** (correo completo, porque D. tiene agentes que lo verificarán todo). En la ronda 2, **Gary Vee** (que ya dijo \"B contiene a A\") y **Martell** (que le dio un 7) deben defender A a máxima potencia.\n\n**Puntos de choque:**\n1. **Reynasa y el \"cuenta conmigo\" en el correo** (valores). Bezos y Hormozi: fuera de este correo, primero se gana la confianza. Gary Vee: una línea al final, sin vender. Martell y Wickman: si Rubén ofrece ayuda, que sea acotada (un resultado, un número, dos semanas o 90 días). Es uno de los tres objetivos de éxito que puso Rubén, así que no se puede descartar sin argumento.\n2. **Qué va en el cuerpo** (hechos y valores). Coinciden en el central, las V16 y los centros inactivos. La carga diaria la ponen arriba Graham, Hormozi, Gary Vee y Wickman (como raíz de Proceso). La venta mezclada con mano de obra la sube Bezos; Buffett la agrupa con los datos que no cuadran como \"un solo hallazgo con ejemplos\". Wickman propone tres raíces (Datos, Proceso, Decisiones) en vez de una lista.\n3. **Qué verifican los agentes** (hechos). Buffett, Martell y Wickman: el código, no el ERP. Hormozi añade algo nuevo: adjuntar el **prompt ya redactado** para que D. lo pegue en Claude Code.\n4. **Dueños y números** (Martell y Wickman): cada bloque con un dueño y un número (14 días seguidos de carga correcta, diferencia frente al ERP < 1 %, 100 % de traspasos a centros activos). ¿Se le pide eso a un superior en el primer correo, o es demasiado?\n\n**Avisos del Presidente sobre las tarjetas:**\n- Hormozi escribe en su postura \"que no se note que no has contrastado con el ERP\", pero en sus condiciones pide marcarlo todo como \"visto en pantalla, sin contrastar\". Contradicción: se le pide aclararla.\n- Cifras que son supuestos de los consejeros y no datos: el 8 % de coste de capital y los \"68 k€ al año\" (Bezos, Buffett), los \"~21 uds./día\" y los \"18 días\" (Graham), los minutos de lectura (Gary Vee, Hormozi, Martell) y las horas por opción (Martell). No van al correo como hechos.\n- Las preguntas cruzadas pendientes: Buffett ↔ Graham (¿rigor de balance a un prototipo?), Bezos → Buffett (¿qué cifra aguanta una revisión de contabilidad?), Martell/Hormozi/Gary Vee → Wickman (¿qué es raíz y quién es el dueño?).", "ponderadas": {"A": 5.9, "B": 8.6, "C": 4.6, "D": 5.0, "E": 1.4}}, {"id": "ronda-2", "tipo": "ronda", "titulo": "Ronda 2 · Debate", "explicacion": "Leen las tarjetas de los demás y los puntos de choque: responden, defienden su postura o cambian de opinión.", "hora": "13/10/2026 16:13", "tarjetas": [{"slug": "bezos", "nombre": "Jeff Bezos", "postura": "Sigo con la B y no cambia mi elección. Sí cambio una cosa. El correo 1 lleva una línea que es una promesa con fecha, y esa línea es el \"cuenta conmigo\". Reynasa pasa al correo 2, cuando devuelvas lo prometido (en la ronda 1 era \"fuera, sin más\").", "puntuaciones": {"A": 7.0, "B": 9.0, "C": 6.0, "D": 5.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "- **La frase de D. en el brief.** Dijo que se pone a punto con \"los requisitos de cada área\", y no la había usado. Lo que echas en falta (curva mensual, lineal, priorización por €) ya son requisitos de usuario. El anexo puede titularse \"Qué echaría en falta\", con sus mismas palabras. Reynasa entra así por la puerta que D. abrió y sin vender.", "md": "POSTURA: Sigo con la B y no cambia mi elección. Sí cambio una cosa. El correo 1 lleva una línea que es una promesa con fecha, y esa línea es el \"cuenta conmigo\". Reynasa pasa al correo 2, cuando devuelvas lo prometido (en la ronda 1 era \"fuera, sin más\").\n\nPUNTUACIONES: A=7, B=9, C=6, D=5, E=2\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **Punto de choque 1 (Presidente, Gary Vee, Martell, Wickman): sí se puede servir a D. y abrir los dos objetivos de Rubén sin vender.** La línea exacta del cuerpo es esta: \"Esta semana contrasto con el ERP el central, las V16 y la venta no almacenable, y te devuelvo el resultado el viernes 23-oct (supuesto de fecha).\"\n  - Es una promesa, no una oferta, y por eso encaja con la forma \"un resultado, un número, dos semanas\" de Martell. Lleva cifra, fecha y es acotada.\n  - Funciona porque el diez-años de D. es un colega cuyos números aguantan en una sala. Eso se demuestra cumpliendo: \"that's how you earn trust make a hard promise keep it\" (S037).\n  - La promesa obliga a un segundo correo. Ahí va Reynasa, como pregunta y con el trabajo ya entregado: \"Con esto cuadrado, ¿vemos qué necesitaría Reynasa de algo así?\".\n  - Gary Vee, tu \"una línea al final, sin vender\" no arruina nada y puede funcionar. Pero no conozco cómo recibe D. las críticas (supuesto), y la primera impresión de motivo no se deshace con otro correo. Mi lente falla aquí: \"Reynasa fuera\" como absoluto era la parte más débil de mi caso, porque es una suposición sobre D. Si Rubén insiste en nombrarla ya, acepto como máximo media frase sin petición. \"Nos interesa\" o \"podríamos\" ya es vender.\n- **Hormozi, el prompt adjunto: sí, adjúntalo.** Es un mecanismo y no una buena intención, y baja el coste de D. a casi cero. Pido dos ajustes.\n  - Debe pedir refutar, no confirmar: \"I'm going to actively try to look for evidence to disconfirm that idea.\" (S036). Que cada hallazgo vuelva como confirmado / no confirmado / por diseño, con la consulta o la línea de código que lo prueba (Martell).\n  - Los agentes cubren la capa de código (Buffett, Wickman). La capa ERP es la línea de mi primer punto. Así las dos capas tienen dueño.\n- **Martell y Wickman, dueño y número por bloque: número sí, dueño no como exigencia.** Cada titular lleva su criterio de \"arreglado\": carga correcta 7 de 7 días, traspasos solo a centros activos al 100 %, diferencia con el ERP menor del 1 % (supuesto de Wickman). \"if you focus on the controllable inputs to your business instead of the outputs in the long term you get better results\" (S018).\n  - Asignarle dueños a un superior en el primer correo es dirigirle la casa. No es feedback, y eso es una falsa puerta de dos sentidos.\n  - Pregunta solo donde hay dependencia de una persona: \"¿quién lanza hoy la carga cuando pide login?\".\n  - El único dueño con nombre es Rubén, y solo en lo que controla: el contraste con el ERP.\n\nQUÉ ME HA MOVIDO:\n- **La frase de D. en el brief.** Dijo que se pone a punto con \"los requisitos de cada área\", y no la había usado. Lo que echas en falta (curva mensual, lineal, priorización por €) ya son requisitos de usuario. El anexo puede titularse \"Qué echaría en falta\", con sus mismas palabras. Reynasa entra así por la puerta que D. abrió y sin vender.\n- **El Presidente.** Los objetivos de Rubén no se descartan sin argumento. Martell y Wickman me dieron la forma acotada de la promesa.\n- **Graham, Hormozi, Gary Vee y Wickman.** Suben la carga fallida al cuerpo. Tienen razón: es el hallazgo que D. confirma en diez segundos en la pantalla de estado, y el más difícil de leer mal.\n- **No me ha movido** pedir dueño por bloque a un superior ni meter Reynasa como mensaje del correo 1.\n\nRIESGO DE RUINA en la preferida: no. Lo único cercano a un solo sentido es una promesa incumplida, que quemaría exactamente la confianza que buscas. Por eso solo se promete si Rubén puede obtener un extracto del ERP (supuesto: puede).\n\nCONDICIONES:\n1. Antes de enviar, unas 2 horas (supuesto) para cuadrar la herramienta consigo misma, incluidos los 1,2 M€ sin explicar. Reabre las pantallas justo antes de enviar, porque la carga ha fallado y las cifras pueden haber cambiado (Gary Vee). Todo lo no contrastado va como \"visto en pantalla, no contrastado con ERP\".\n2. El cuerpo lleva cuatro titulares como máximo, con cifra, por qué importa y criterio de \"arreglado\":\n   - el central (6,0 de 11,8 M€);\n   - las V16 y su traspaso a un centro con stock negativo;\n   - los centros inactivos encabezando \"Le falta\", con la venta no almacenable como causa posible, formulada como pregunta;\n   - la carga caída tres días.\n3. Una línea de promesa con fecha, sin oferta abierta ni compromiso permanente. Reynasa va en el correo 2, en forma de pregunta.\n4. Prompt de verificación de unas diez líneas, ofrecido \"por si te ahorra tiempo\". Sin veredictos dentro, que pida refutar y devuelva la tabla confirmado / no confirmado / por diseño.\n5. Una línea de \"mientras tanto\": no ejecutar traspasos hasta verificar V16 y centros inactivos.\n6. Envío esta semana. Si Rubén no puede conseguir el extracto del ERP, no hace la promesa y manda el correo sin ella.\n\nNOTA DE MI ÁREA: 8. B deja abiertas las dos puertas y la promesa con fecha ata el segundo correo, así que queda una vía natural hacia \"cuenta conmigo\" y Reynasa. No llego a 9 porque no sé cómo recibe D. las críticas ni si Rubén tiene acceso al ERP.\n\nCONFIANZA: 4"}, {"slug": "wickman", "nombre": "Gino Wickman", "postura": "Sigo en B, con un ajuste. El cuerpo lleva dos raíces, cada una con su prueba. El dueño y el número van como pregunta con propuesta, no como Roca ni cuadro de dueños impuesto a un superior.", "puntuaciones": {"A": 5.0, "B": 9.0, "C": 4.0, "D": 5.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "Hormozi y Buffett me movieron a convertir mi cierre de dueño y números en pregunta con propuesta y a bajar D de 6 a 5. Los argumentos son que Rubén leyó pantallas sin ERP, que es la primera vez que da feedback a un superior y que no le toca dictar el piloto. La pregunta de Gary Vee me hizo corregir \"Decisiones\" como raíz. No ha habido datos nuevos.", "md": "POSTURA: Sigo en B, con un ajuste. El cuerpo lleva dos raíces, cada una con su prueba. El dueño y el número van como pregunta con propuesta, no como Roca ni cuadro de dueños impuesto a un superior.\n\nPUNTUACIONES: A=5, B=9, C=4, D=5, E=1\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **A Gary Vee, Hormozi y Martell: qué es raíz y qué es síntoma, y en qué orden va.** Con todo el cariño, en la ronda 1 me equivoqué al llamar \"Decisiones\" a una tercera raíz. Las 373 balizas son un síntoma. Los cuatro hallazgos \"vistosos\" de Gary Vee son tres síntomas y una raíz: \"go to the root of their issue and solve it there 136 issues just kind of fell away\" (S043). El cuerpo lleva, tras una línea con lo bueno de la herramienta, dos bloques. Cada bloque abre con la prueba de 2 minutos y cierra con la raíz en una frase.\n  1. **Datos (raíz).** La herramienta no cuadra consigo misma y, por confirmar, tampoco con el ERP.\n     - Prueba: el almacén 20 pesa 6,0 de 11,8 M€ (51 %) y no sale en Almacenes ni en el exceso. Además quedan 1,2 M€ sin explicar (supuesto) y unos 24 de 39,5 M€ de venta no son almacenables.\n     - Síntomas dentro de este bloque, no hallazgos aparte: las V16 a 2.013 días con 373 uds. (7.639 €) a un centro con stock negativo, los centros inactivos arriba de \"Le falta\", el stock negativo y el stock muerto mayor que el stock.\n  2. **Proceso (raíz).** La carga cayó el 11, 12 y 13-oct y pide login manual, con la base de datos al 81,7 %. Es lo que decide si alguien abre la herramienta el lunes.\n  - Al anexo van la estacionalidad de un solo año (límite de v1, no bug), la curva mensual, el lineal de Cliente-H, la priorización por € y los permisos.\n- **A Martell: dueño con nombre y número.**\n  - **Carga diaria.** El dueño es IT, con el nombre que ponga D. (supuesto: IT lleva Metabase, el brief no lo dice). Se da por arreglada con 14 de 14 días seguidos, sin fallo y sin login manual. Hoy es 0 de los últimos 3.\n  - **Contraste con el ERP.** El dueño es D., que lo delega en quien tenga el ERP (IT o contabilidad). Rubén no debe ser el validador permanente: eso sería otra persona sujetando el sistema. Rubén lo hace una sola vez, como su oferta acotada, con tres cifras: stock total, almacén 20 y ref. V-2. Se da por arreglado con diferencia menor del 1 % en esas tres cifras (supuesto, el umbral lo fija D.), medida por el dueño durante 4 semanas.\n  - **Agentes.** Verifican el código, no el ERP (supuesto: no lo ven). Por eso el contraste no lo cierra \"confirmado en el repo\".\n- **A Buffett, Hormozi y al punto 4 del Presidente: ¿es demasiado para un superior en el primer correo?** Sí, si va como Roca, Scorecard de tres números y organigrama. No, si va como una pregunta de cierre con propuesta: \"¿quién en IT lleva la carga? Mi propuesta de 'arreglado' son 14 días seguidos\". Este es el mayor argumento contra mi B: nombrar una raíz sin haber visto el repositorio es un diagnóstico, y puede estar equivocado. Por eso cada raíz va escrita como \"mi lectura de pantalla; tus agentes pueden confirmarlo\". Rubén \"take the bullet\" (S038) primero: \"leí pantallas, no tengo acceso al ERP\". \"if it comes from open and honest and love, you can't say it wrong.\" (S036) A queda dentro de B, porque el anexo lo lleva todo. La diferencia es que D. no hace el triaje.\n\nQUÉ ME HA MOVIDO: Hormozi y Buffett me movieron a convertir mi cierre de dueño y números en pregunta con propuesta y a bajar D de 6 a 5. Los argumentos son que Rubén leyó pantallas sin ERP, que es la primera vez que da feedback a un superior y que no le toca dictar el piloto. La pregunta de Gary Vee me hizo corregir \"Decisiones\" como raíz. No ha habido datos nuevos.\n\nRIESGO DE RUINA en la preferida: no\n\nCONDICIONES:\n1. Cuerpo de una página: una línea con lo bueno, los 2 bloques (Datos y Proceso) con su prueba y su raíz como hipótesis, y una sola pregunta de dueño al cierre. El anexo H1–H7 lleva el resto, con el número propuesto como \"si te sirve\".\n2. Una hora antes de enviar para contrastar stock total, almacén 20 y ref. V-2, y para cuadrar los 1,2 M€. Lo que no cuadre se escribe \"según pantalla, por confirmar\". Reabrir las pantallas justo antes de enviar, porque la carga ha fallado y las cifras pueden haber cambiado.\n3. Una línea de \"mientras tanto\": no ejecutar traspasos hasta verificar V16 y centros inactivos.\n4. La oferta de Rubén es un contraste único de tres cifras. Reynasa y el \"cuenta conmigo\" abierto quedan fuera del cuerpo. Sobre Reynasa cedo a Bezos, Hormozi y Gary Vee.\n5. Esta semana: contrastar las tres cifras y enviarlo el jueves 15-oct. Stay focused.\n\nNOTA DE MI ÁREA: 7\n\nCONFIANZA: 4"}, {"slug": "buffett", "nombre": "Warren Buffett", "postura": "Sigo en la B; no cambia la letra, pero sí el cuerpo. La carga diaria sube arriba y todo se agrupa en tres raíces (Datos, Proceso, Decisiones), con cada cifra escrita como pregunta y no como veredicto.", "puntuaciones": {"A": 6.0, "B": 8.0, "C": 5.0, "D": 4.0, "E": 2.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "Un argumento que adopto: Graham, Hormozi, Gary V y Wickman ponen la carga diaria arriba. En la ronda 1 la dejé fuera porque no es en euros, y fue un error mío. Es un hecho de la propia herramienta, que D. comprueba en la pantalla de estado sin ERP y sin mi lectura. No puede estar mal, y cada cifra que aguanta ensancha el foso del crédito de Rubén. También adopto las tres raíces de Wickman, que coinciden con mi \"un solo hallazgo con ejemplos\". Lo más débil de mi caso es que B lleva el mismo anexo que A. Con tres hallazgos falsos en el anexo, el daño al crédito sería casi el mismo, y los agentes verifican el código, no el mundo. La diferencia real es que en B la primera pantalla solo lleva lo que D. puede comprobar en un minuto. Eso acerca A y B, pero no los iguala: A deja el triaje a D., así que no subo A. No me mueven los 24 M€ como cifra de cabecera ni pedir dueños y números a un superior.", "md": "POSTURA: Sigo en la B; no cambia la letra, pero sí el cuerpo. La carga diaria sube arriba y todo se agrupa en tres raíces (Datos, Proceso, Decisiones), con cada cifra escrita como pregunta y no como veredicto.\n\nPUNTUACIONES: A=6, B=8, C=5, D=4, E=2\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **A Bezos (cifras y V16).** Hoy ninguna de las tres ha pasado una revisión de contabilidad, porque ninguna está contrastada. Lo que cambia es cuánto cuesta contrastarla.\n  - **Central, 6,0 M€.** Es un saldo por almacén y la que mejor aguantaría (supuesto: Rubén consigue el saldo en Contabilidad o Compras y la pantalla valora igual que el libro). El 51 % y el \"fuera del exceso\" son derivados y cuelgan del 11,8, que es justo donde faltan 1,2 M€.\n  - **V16, 0,85 M€.** Aguanta en unidades (41.668), no todavía en valor. Salen unos 8,2 € por unidad (cálculo mío; 7.639 € entre 373 da casi lo mismo) y el brief no dice si es coste o precio de venta.\n  - **24 de 39,5 M€.** Va \"a verificar\" sin discusión: es una estimación con tilde. Tu 2,5 veces depende de que la cobertura use esa venta, y no lo sé (supuesto). Tampoco van al correo como hechos el 5,5 años ni mis 68 k€. Esos 68 k€ eran de mesa.\n  - **Valoración de las V16.** Para decidir, a valor realizable y no a coste: \"how much do you get back, how sure are you of getting it, when do you get it?\" (S011). A unas 21 uds./día (la cobertura de la propia pantalla), tardan 5,5 años en salir. Con un 8 % (supuesto) lo que vuelve vale unos 0,7 M€ y no 0,85, antes de obsolescencia y almacenaje. \"Sin salida\" es tu hipótesis, Bezos: la pantalla solo dice \"lenta\".\n  - **En el correo.** Solo la cifra con la base de la pantalla y la pregunta \"¿cuál es la salida prevista?\". Insinuar una provisión a un superior, sin haberla contrastado, es la frase más cara en reputación.\n- **A Graham (qué cifra cuesta más reputación).** La que más cuesta si está mal es la del central, aunque no sea la más probable de estar mal. La más probable es la de 24 M€, pero va al anexo y allí cuesta poco.\n  - **Por qué el central.** Va primera, es la mayor y de ella cuelgan el 51 % y el \"fuera del exceso\". Si D. contesta \"es intencionado\", se cae la afirmación entera.\n  - **Tu frase.** \"El Resumen mide la mitad del stock\" es el veredicto que se cae. La versión que aguanta cualquier respuesta es: \"el Resumen suma 11,8 M€, pero ni Almacenes (4,6) ni el exceso recogen 6,0; ¿es intencionado?\". Es \"the business facts that we would want to know if our positions were reversed\" (S098).\n  - **Rigor.** A un prototipo no le pido rigor de balance. Le pido que sume consigo mismo: 11,8 − 6,0 − 4,6 deja 1,2 M€, y eso sale de sus propias pantallas.\n  - **Segunda en coste.** \"Centros inactivos\": ese \"inactivo\" lo sabe Rubén de fuera de la herramienta (supuesto). Cinco minutos con alguien de operaciones lo cierran.\n- **Choque 1 (a Bezos, Hormozi, Gary V, Martell y Wickman).** Reynasa va fuera de este correo. El \"cuenta conmigo\" va dentro, pero como oferta escrita, acotada y con fecha: tres cifras contrastadas con un extracto del ERP en dos semanas.\n  - **Por qué fuera Reynasa.** No conozco la relación Reynasa–Red X (pendiente), así que no sé si esa línea es oportunidad o conflicto; si D. es jefe de Rubén dentro del grupo cuesta menos, y si Red X es un tercero cuesta más. Además sería recomendar la granja sin haber contado las vacas: la herramienta no suma 6,0 M€ de su propio total. Y es la línea que peor pasa el \"léelo en voz alta delante del jefe de D.\", porque cambia cómo se leen todas las cifras de arriba. Gary V: la línea \"sin vender\" no es gratis. Reynasa se habla en los 20-30 minutos de llamada.\n  - **Por qué el \"cuenta conmigo\" sí.** Una invitación abierta hace de Rubén el control de calidad gratis de D. (Martell). Una oferta acotada es poner su tiempo detrás de sus cifras. Y es una de las tres metas que puso Rubén.\n  - **Dueños y números.** Los de Wickman y Martell van como pregunta (\"¿quién lleva la carga?\"), no como asignación a un superior.\n\nQUÉ ME HA MOVIDO: Un argumento que adopto: Graham, Hormozi, Gary V y Wickman ponen la carga diaria arriba. En la ronda 1 la dejé fuera porque no es en euros, y fue un error mío. Es un hecho de la propia herramienta, que D. comprueba en la pantalla de estado sin ERP y sin mi lectura. No puede estar mal, y cada cifra que aguanta ensancha el foso del crédito de Rubén. También adopto las tres raíces de Wickman, que coinciden con mi \"un solo hallazgo con ejemplos\". Lo más débil de mi caso es que B lleva el mismo anexo que A. Con tres hallazgos falsos en el anexo, el daño al crédito sería casi el mismo, y los agentes verifican el código, no el mundo. La diferencia real es que en B la primera pantalla solo lleva lo que D. puede comprobar en un minuto. Eso acerca A y B, pero no los iguala: A deja el triaje a D., así que no subo A. No me mueven los 24 M€ como cifra de cabecera ni pedir dueños y números a un superior.\n\nRIESGO DE RUINA en la preferida: no. Es un correo; el peor caso es una cifra refutada y corregible. Pasaría a \"posible\" solo si se afirmaran como hechos cifras sin contrastar.\n\nCONDICIONES:\n- **Hora o dos de Rubén antes de enviar:** cuadrar la herramienta consigo misma (los 1,2 M€). Pedir un saldo con fecha del almacén 20 y de la ref. V-2 (5.956 uds.) a Contabilidad, Compras o Almacén. Confirmar que los seis centros están inactivos.\n- **Cada cifra lleva su pantalla y la fecha de la última carga buena.** Hoy esa carga tiene al menos tres días. Todo va como \"visto en pantalla, no contrastado con ERP\". Mis cálculos (61 %, 2,5 veces, 5,5 años, ~20,4 €/ud, 0,7 M€) no van al cuerpo como hechos.\n- **Cuerpo de una página, con tres raíces:**\n  - **Datos:** el central como pregunta (\"¿es intencionado?\") y los 1,2 M€ que no suman.\n  - **Proceso:** la carga caída los días 11, 12 y 13, y la base al 81,7 %.\n  - **Decisiones:** las 373 V16 (7.639 €) a un centro en negativo y los centros inactivos arriba.\n  - Los 24 M€, la estacionalidad, los permisos y el lineal van al anexo.\n- **Salvaguarda:** mientras no cuadre con el ERP, no se ejecutan traspasos desde la pantalla. \"The most important thing to do when you find yourself in a hole is to stop digging.\" (S063)\n- **Agentes en dos capas:** qué hace el código y si cuadra con el ERP. El prompt de Hormozi vale como oferta, si pide separar \"confirmado en código\", \"no confirmable sin ERP\" y \"por diseño\".\n- **\"Cuenta conmigo\" acotado** (tres cifras, extracto del ERP, dos semanas), tras confirmar quién le da ese extracto. Reynasa solo en la llamada. Envío esta semana.\n\nNOTA DE MI ÁREA: 7\n\nCONFIANZA: 4"}, {"slug": "graham", "nombre": "Paul Graham", "postura": "Sigo en B, no cambia la letra. Afino dos cosas: tres titulares (Datos, Decisiones, Carga) en vez de cuatro o cinco, y la verificación en dos capas, una de código y otra contra el ERP.", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 5.0, "D": 6.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 7.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "- **Buffett, Martell y Wickman:** los agentes verifican el código, no el ERP. Mi \"prueba de cinco minutos\" de la ronda 1 zanja la intención (¿el 20 se filtra adrede o es un fallo?), no la verdad. Eso es justo el riesgo de Buffett: el central excluido a propósito. Por eso la verificación pasa a dos capas.", "md": "POSTURA: Sigo en B, no cambia la letra. Afino dos cosas: tres titulares (Datos, Decisiones, Carga) en vez de cuatro o cinco, y la verificación en dos capas, una de código y otra contra el ERP.\n\nPUNTUACIONES: A=5, B=8, C=5, D=6, E=1\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **A Buffett: que no cuadre con el ERP es lo primero que hay que validar, no un detalle de v1.** D. dijo \"validar el enfoque con datos reales\". Si los datos no cuadran con su fuente, no estás probando el enfoque, estás probando la carga. Que falten funciones es normal. Que muestre cifras falsas no lo es: \"you should release something minimal\" (S186), y mínimo no significa con bugs. Tampoco es rigor de balance, que sería cuadrar 141.120 líneas. Pido tres cifras con el mismo día de corte:\n  1. **Stock total de la red** (11,8 M€) con tolerancia del 1 % (supuesto), que son 0,12 M€. Los 1,2 M€ sin explicar (11,8 − 6,0 − 4,6) son diez veces eso.\n  2. **Una referencia de punta a punta, la V-2 (V16).** Unidades en stock (41.668 en red, 5.956 en central) y ventas de 12 meses. Los 2.013 días de cobertura implican unas 7.560 uds. al año (41.668 / 2.013 × 365; derivado, supuesto: cobertura calculada sobre la red).\n  3. **Venta 12M de producto:** unos 15,5 M€ (39,5 − ~24, derivado) frente a los 39,5 M€ mezclados.\n\n  Si las tres cuadran, los 1,2 M€ son un problema de presentación. Si no, son de datos. Rubén no las cuadra, porque no ve el ERP (supuesto): las pregunta, y las cuadra quien lo tiene.\n- **A Wickman: de tus tres raíces bloquean dos y un trozo de la tercera.** Aquí mi \"crecimiento\" es que alguien la abra dos veces.\n  - **Datos bloquea, pero solo dos cosas:** el central fuera de la lista y del exceso, y la venta con mano de obra y promociones.\n  - **Decisiones bloquea porque es lo primero que ve un usuario, pero es síntoma.** Las 373 V16 a un centro en negativo salen de dos filtros que faltan: centro activo y la ref. V-2 sin excluir. Arregla los datos y casi se arregla sola.\n  - **Proceso es casi todo ruido de v1.** Solo bloquea que la carga corra y que se vea la fecha de los datos. Tres días caídos (11, 12, 13-oct) y nadie la abre dos veces.\n  - **Es ruido para validar:**\n    - El login manual: alguien que la refresca a mano cada mañana es \"do things that don't scale\" (S096).\n    - La base al 81,7 % (91,3 MB libres), que es trabajo de IT.\n    - Los permisos y la estacionalidad con un año.\n    - Los deseos de v2 (curva mensual, lineal, prioridad por €), que se piden cuando ya se fían.\n\n  \"The number one thing not to do is other things.\" (S166)\n- **A Martell y Wickman (dueño y número) y a Bezos y Hormozi (Reynasa): dueño y número sí, pero uno, no un Scorecard.** A un superior que preguntó \"qué te parece\" no le mandas un organigrama en el primer correo.\n  - **Una pregunta:** ¿quién la refresca cada mañana durante la prueba?\n  - **Un número:** fecha de datos = hoy.\n  - **La oferta de Rubén, acotada como dice Martell:** contrastar las tres cifras con un extracto del ERP en dos semanas. Es la cosa que no escala la que te gana el sitio.\n  - **Reynasa fuera de este correo.** Primero un usuario encantado, luego el segundo mercado. \"A need that's narrow but genuine is a better starting point than one that's broad but hypothetical.\" (S174)\n\nQUÉ ME HA MOVIDO:\n- **Buffett, Martell y Wickman:** los agentes verifican el código, no el ERP. Mi \"prueba de cinco minutos\" de la ronda 1 zanja la intención (¿el 20 se filtra adrede o es un fallo?), no la verdad. Eso es justo el riesgo de Buffett: el central excluido a propósito. Por eso la verificación pasa a dos capas.\n- **Wickman y Buffett:** agrupar en tres titulares es mejor que mi lista de cuatro o cinco.\n- **De letra no me mueve nada.** El mejor argumento a favor de A, que los agentes leen todo gratis, ya está dentro de B: el anexo lleva los siete grupos completos. Lo único que no acepto de A es que D. lea 1.500 palabras (supuesto) antes de ver lo que rompe la confianza.\n\nRIESGO DE RUINA en la preferida: no. Es un correo. El peor caso es una cifra mal leída y credibilidad de Rubén, reparable con un segundo correo.\n\nCONDICIONES:\n1. **Cuerpo de una página, tres titulares:**\n   - Datos: central fuera de la lista y del exceso; venta con mano de obra.\n   - Decisiones: 373 V16 a un centro en negativo; centros inactivos arriba en \"Le falta\".\n   - Carga: caída tres días y fecha de datos.\n\n   Cada uno lleva qué veo, cifra y pregunta. Se abre con lo bueno concreto. Todo va marcado \"visto en pantalla, sin contrastar con ERP\".\n2. **Pedir a D. o IT las tres cifras contra el ERP** antes de enseñarla a dirección: stock total (±1 %, supuesto), la ref. V-2 de punta a punta y la venta 12M de producto.\n3. **Verificación en dos capas.**\n   - **Agentes:** qué hace el código y si el 20 se filtra adrede.\n   - **ERP:** si es cierto.\n   - **Anexo:** tabla con pantalla, cifra, causa probable y prueba, más el prompt ya redactado, ofrecido y no impuesto.\n4. **Mientras tanto,** no ejecutar traspasos desde la pantalla. Alguien la refresca a mano cada mañana con la fecha visible.\n5. **Cierre pequeño:**\n   - 20 minutos en pantalla compartida.\n   - Sugerir probarla con una familia y un comprador (sugerencia, no condición).\n   - Oferta de Rubén: tres cifras en dos semanas.\n   - Reynasa fuera.\n   - Enviar esta semana, el jueves 15 como tarde.\n\nNOTA DE MI ÁREA: 7. Ahora hay una prueba de validez definida (las tres cifras), pero sigue sin haber datos de uso real: quién la abre y cuántas veces por semana.\n\nCONFIANZA: 4. Mi lente es de startups y aquí traduzco \"crecimiento\" como \"la abren dos veces\". No sé si Rubén o D. tienen acceso al ERP, ni cómo recibe D. las críticas. La tolerancia del 1 % y las 7.560 uds. al año son supuestos o derivados, no datos."}, {"slug": "martell", "nombre": "Dan Martell", "postura": "Sigo en B. A sube de 7 a 8, y ablando una condición mía: ya no pido dueño por bloque en el primer correo.", "puntuaciones": {"A": 8.0, "B": 9.0, "C": 3.0, "D": 5.0, "E": 1.0}, "preferida": "B", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "- **A sube de 7 a 8.** Al ponerle horas, la diferencia con B son ~36 min (supuesto) y las idas y vueltas no existen si B lleva anexo. Además, el prompt ya redactado de Hormozi baja el coste de D. a un reenvío de ~2 min (supuesto).", "md": "POSTURA: Sigo en B. A sube de 7 a 8, y ablando una condición mía: ya no pido dueño por bloque en el primer correo.\n\nPUNTUACIONES: A=8, B=9, C=3, D=5, E=1\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **A Gary Vee, Hormozi y Graham (defiendo A con horas).** Si D. deja su bandeja a los agentes (supuesto), ya tiene un asistente con el 100 % de la bandeja (S031). Para un asistente, el mejor to-do es el completo, con IDs y de una vez. A ahorra tres cosas.\n  1. Un solo traspaso, ya grabado: es el Camcorder Method, \"so it takes me no extra time\" (S020). Recortar es trabajo extra.\n  2. Verificar 7 hallazgos en vez de 4 le cuesta a D. casi 0 h y a sus agentes minutos (supuesto).\n  3. Prioriza quien ve el repo, no Rubén leyendo pantallas.\n\n  Con horas (supuesto): leer A son ~8 min y el cuerpo de B ~2, o sea 6 min de D. Recortar cuesta ~30 min de Rubén (corrijo mi ronda 1, que puso 1 h para las dos). Total entre las dos agendas: ~36 min. Las \"idas y vueltas\" solo existen en un B sin anexo, y nadie lo propone. Con anexo completo, B no genera ninguna. Ahorrar 36 min a cambio de arriesgar que D. ni reenvíe es el Saver (S059): saltar el dólar para recoger la moneda. \"cuz it's at the top\" (S031): arriba hay un humano que decide en 30 segundos si reenvía o aparca.\n- **A Bezos y Buffett (\"nueve ocasiones de equivocarse\").** Razón a medias. El riesgo vive en los titulares, no en el recuento: los 3 o 4 pesan igual en A y en B. Lo que A hace mejor es no promover nada antes de verificarlo. El top-4 de B es una apuesta de Rubén con los peores datos de la cadena (pantalla, sin ERP). Si el central es por diseño, B abre con el error y A lo trataría como un H1 \"por confirmar\". Cura en B: el cuerpo dice \"lo primero que vi\", no \"lo que bloquea\".\n- **A Wickman (punto de choque 4: ¿dueño y número por bloque a un superior?).** Dueño por bloque es demasiado; número por bloque no. Un dueño es una tarea que cae en la agenda de D. antes de que nadie confirme el hallazgo, y Rubén no manda en su equipo ni conoce la capacidad de IT (pendiente). El orden es \"don’t skip ahead\" (S122). Rubén trae la recomendación y D. solo dice sí, como en el 1-3-1, que aprobó ~98 % de las veces (S031). Para eso, una columna \"número propuesto\" en el anexo: 7/7 días de carga, diferencia frente al ERP < 1 % (tu supuesto, Wickman) y 100 % de traspasos a centros activos. El dueño de la carga se pide en la segunda vuelta. Tu Scorecard entra; tu Roca de 90 días, no.\n\nQUÉ ME HA MOVIDO:\n- **A sube de 7 a 8.** Al ponerle horas, la diferencia con B son ~36 min (supuesto) y las idas y vueltas no existen si B lleva anexo. Además, el prompt ya redactado de Hormozi baja el coste de D. a un reenvío de ~2 min (supuesto).\n- **Condición 4 ablandada.** Me mueven el punto de choque del Presidente, la secuencia (S122) y que Rubén no tiene autoridad sobre el equipo de D.\n- **Lo que no me mueve de B.** Nadie ha probado que D. deje su bandeja a los agentes. Sin eso, el primer vistazo es humano. B gana por eso, no por agenda.\n\nRIESGO DE RUINA en la preferida: no. Es un correo y se corrige con otro.\n\nCONDICIONES:\nPara B (preferida):\n1. Cuerpo de ~350 palabras o menos (supuesto: ~2 min). Lo bueno en una línea, luego 3 o 4 hallazgos ordenados por €, cada uno con cifra y pantalla. Encabezado: \"lo primero que vi, visto en pantalla, sin contrastar con ERP\".\n2. Anexo con los 7 hallazgos completos, sin recortar. Cada uno lleva ID (H1 a H7), pantalla, qué vi, qué esperaba, cómo comprobarlo y la columna \"número propuesto\" (propuesta, no exigencia).\n3. Prompt listo para pegar en Claude Code, ofrecido como ayuda. Pide verificar en el repo y devolver cada hallazgo como confirmado / no confirmado / por diseño, con la consulta o línea que lo prueba. Dos capas: el código lo comprueban los agentes y el ERP lo contrasta Rubén.\n4. Las dudas, redactadas como comprobaciones para los agentes, no como preguntas para D. Así a D. le cuestan una lectura, no una respuesta.\n5. Sin dueños exigidos en el primer correo. Tras la tabla de los agentes, D. nombra al dueño de la carga y al de los Parámetros.\n6. Oferta de Rubén acotada: un resultado, un número, dos semanas. Contrastar 3 cifras (central, ref. V-2, total de la red) con un extracto del ERP. Reynasa y el \"cuenta conmigo\" abierto, fuera.\n7. Mientras tanto, no ejecutar traspasos de la pantalla hasta verificar V16 y centros inactivos.\n\nPara que A funcione:\n- (a) Rubén sabe que D. procesa su bandeja con agentes. Si no lo sabe, B.\n- (b) Las primeras ~100 palabras son para el humano: lo bueno, 3 titulares, el ask (\"pásalo a tus agentes\") y el prompt. Debajo, la tabla H1 a H7 plana, sin veredictos.\n- (c) Las 3 cifras mayores, contrastadas con el ERP antes de enviar (~1 h, supuesto).\n- (d) Mismo formato de devolución y ningún dueño exigido.\n\nCon (b), A y B convergen. Lo único que queda distinto es si subes 3 o 4 hallazgos al cuerpo.\n\nReto, Rubén: antes de elegir, averigua en una frase cómo lee D. su correo, él o su agente. Si no sabes responderlo, B.\n\nNOTA DE MI ÁREA: 8. Con el prompt, D. gasta ~2 min en reenviar y ~20 en revisar lo que devuelvan (supuesto). No llega a 9 porque la carga sigue sin dueño con nombre.\n\nCONFIANZA: 4. B no pierde frente a A en ningún caso: si D. delega su bandeja, empatan en valor y A ahorra ~30 min a Rubén; si la lee él, B gana. Lo que no sé es cómo la lee, y las horas son supuestos."}, {"slug": "hormozi", "nombre": "Alex Hormozi", "postura": "Sigo con la B, sin cambio de postura. Sí me corrijo en una frase: se queda la etiqueta honesta \"visto en pantalla, sin contrastar\" y retiro el \"que no se note\".", "puntuaciones": {"A": 5.0, "B": 8.0, "C": 4.0, "D": 4.0, "E": 1.0}, "preferida": "B", "confianza": 3.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "La postura no se mueve. Muevo tres condiciones:", "md": "POSTURA: Sigo con la B, sin cambio de postura. Sí me corrijo en una frase: se queda la etiqueta honesta \"visto en pantalla, sin contrastar\" y retiro el \"que no se note\".\n\nPUNTUACIONES: A=5, B=8, C=4, D=4, E=1\n\nPREFERIDA: B\n\nRESPUESTA A LOS DEMÁS:\n- **Al Presidente, a Buffett y a Graham (la contradicción y el miedo a una cifra mal leída).** Sostengo la de las condiciones. La frase de la postura estaba mal escrita: quería decir \"que no suene a acusación\", no \"que se esconda\".\n  - Esconderlo es mentir por omisión, y se descubre en el primer cruce con el repo.\n  - \"They believe nothing that you say they beli
