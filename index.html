ico de cargas.\n- La lógica de reposición desde un origen con cobertura alta es sensata.\n\n**Cuatro puntos, cada uno con una pregunta concreta**\n\n1. **Almacén central (código 20).** En el Resumen, el stock de la red es 11,8 M€ y el central aparece con 6,0 M€ (unos 3,2 M€ en neumáticos). No figura en la lista de Almacenes, no tiene cobertura y no entra en el \"exceso\" de 2,1 M€. En su ficha el ámbito es \"Otros\", y el filtro Ámbito = Otros en Almacenes devuelve 0 filas, así que imagino que está fuera por diseño. ¿Es así? Si lo es, quizá convenga medirlo contra la demanda de toda la red. Y ¿podrías pedir el desglose de los 11,8 M€ por código de almacén? Con eso lo cuadro yo también.\n\n2. **Balizas V16 y ABC.** La baliza V-1 tiene 41.668 uds. (0,85 M€) y 2.013 días de cobertura, pero aparece como clase A y en \"Le falta\". La primera propuesta de Traspasos son 373 uds. (7.639 €) a Grúas-G, que en pantalla muestra stock negativo (−9.424 €). La ref. V-2 (5.956 uds. en central) no está entre las excluidas de la venta como las otras V16. Además, la venta de 12 meses parece incluir conceptos no almacenables (mano de obra, promociones), lo que puede distorsionar el ABC y la cobertura (cifra en el anexo, calculado por mí). Propongo un ABC corregido por tendencia y excluir también la V-2.\n\n3. **Centros que parecen inactivos o que no son tienda.** Encabezan \"Le falta\" Centro-A, Centro-B, Centro-C, Centro-D, Centro-E y Centro-F, que en pantalla tienen stock casi a 0 y venta mínima (hipótesis mía: están inactivos). ¿El modelo tiene un campo de tipo de centro (tienda, grúa, oficina, almacén especial) y de activo/inactivo? Si no, propongo añadirlo para que las propuestas solo salgan a tiendas activas; yo te paso el listado de centros con su tipo. Y dos preguntas más: ¿la exportación a Excel puede salir agrupada por centro de destino, con ruta y día de reparto y un tope por centro (las 15 mayores por €)? ¿La herramienta solo propone o puede ejecutar algo? Si solo propone, bastaría una marca \"propuesta pendiente de validar\". Si te sirve, te paso la tabla de rutas y frecuencias de reparto.\n\n4. **Estacionalidad con un solo ciclo.** El histórico empieza el 06/10/2025, así que cada índice descansa en una sola observación. En Cálculo del surtido, los índices de neumáticos para el periodo van de ×0,58 (Centro-P) a ×2,06 (Centro-Q) según el centro, y las cadenas de nieve aparecen en Stock muerto (90 días) en octubre, justo antes de su temporada. Propongo una marca de \"baja confianza\" visible, no marcar como muerta una familia estacional antes de su pico, y activar el índice solo con 2 ciclos o con un suavizado fijado de antemano.\n\n**Una condición previa:** la carga automática de las 08:15 falló el 11, 12 y 13 de octubre (Metabase 403/522) y la base de datos está en 408,7 de 500 MB. Para validar el enfoque no bloquea, pero sí antes de ampliar usuarios.\n\n**Condición de uso de la v1.** Mientras tanto, yo no ejecutaría ningún traspaso ni compra de los propuestos. El primer paso que propongo es conciliar el stock total de la herramienta con el stock valorado de contabilidad, con una fecha de corte común, y exigir una diferencia inferior a un umbral que acordemos con Contabilidad (por ejemplo, el 1 %), además de excluir los centros inactivos y los que no son tienda.\n\n**Primera mejora de uso:** que cada centro vea solo sus 15 propuestas de mayor importe en € (en pantalla y en el Excel). Hoy hay 8.140 en \"Le falta\" y 10.265 traspasos sin priorizar.\n\n**Lo que puedo aportar**\n- Un borrador de una página con 3 reglas de surtido por tipo de centro (ABC corregido por tendencia, mínimos de exposición, altas y bajas) y un calendario estacional.\n- La misma lógica nos serviría en Reynasa para la analítica de stock y compras. Si te sirve, Compras puede validar las propuestas de reposición y traspaso con la analítica que ya tenemos, antes de que se ejecute ninguna.\n- Lo repasamos en 20–30 minutos cuando te venga bien.\n\n**Anexo para tus agentes.** Al final dejo un anexo de 7 puntos escritos como comprobaciones, por si te sirve pegarlo tal cual en Claude Code sobre tu repositorio. Cada punto dice qué vi, la cifra y qué habría que mirar, y marca cuál se confirma leyendo el código y cuál necesita datos o el ERP. Un agente confirma la lógica y los filtros, no que el importe coincida con el ERP.\n\nUn saludo,\nRubén\n\n---\n\n### ANEXO: 7 comprobaciones (para tus agentes, por si ayuda)\n\n**Instrucciones para el agente:** para cada punto responde \"confirmado en código / refutado / hace falta dato (con la consulta)\". Cita archivo y función. **No modifiques nada** hasta que D. decida. Las columnas (a) y (b) indican qué se puede comprobar solo con el código y qué necesita datos o el ERP. Todas las cifras son lectura de pantalla del 13/10, sin conciliar.\n\n**H1. Almacén central fuera de Almacenes y del exceso**\n- Vi: red 11,8 M€ (Resumen); código 20 con 6,0 M€ (ficha del almacén 20, ámbito \"Otros\"); suma de la lista de Almacenes 4,6 M€; el filtro Ámbito = Otros devuelve 0 filas; \"stock en exceso\" 2,1 M€ sin la central. 11,8 − (6,0 + 4,6) = 1,2 M€ sin ubicar (calculado por mí; supone que la central no está dentro de los 4,6).\n- (a) Código: si el 20 queda fuera por un filtro de ámbito y si es por diseño; si hay otros almacenes del ámbito \"Otros\" (p. ej. \"Centro gestión obsolescencia\") que cuenten en el total pero no se listen; qué campo de valor usa cada pantalla.\n- (b) Datos/ERP: que 6,0 / 11,8 / 4,6 M€ coincidan con el stock valorado y el origen de los 1,2 M€ (hipótesis sin comprobar: otros almacenes, otra valoración, cortes de fecha distintos).\n- Estará bien si: cada pantalla indica qué almacenes incluye y la suma cuadra con el total de red.\n\n**H2. Balizas V16, ABC y traspaso a un centro con stock negativo**\n- Vi: ref. V-1: 41.668 uds., 0,85 M€, 2.013 días de cobertura, clase A y en \"Le falta\". Primera propuesta de Traspasos: 373 uds. (7.639 €) de Central a Grúas-G (stock −9.424 €). Parámetros excluye R-1, R-2, R-3, R-4 y V-1; no incluye V-2 (5.956 uds. en central).\n- (a) Código: si la lista de exclusión debe incluir V-2; si el ABC no tiene tope por cobertura ni tendencia; si el generador de traspasos permite destinos con stock negativo.\n- (b) Datos: que Grúas-G tenga stock negativo real en el ERP.\n- Estará bien si: una referencia con cobertura de años no es A ni sale en \"Le falta\", y no hay propuestas hacia destinos con stock negativo.\n\n**H3. Centros que parecen inactivos o no son tienda**\n- Vi: Centro-A, Centro-B, Centro-C, Centro-D, Centro-E y Centro-F encabezan \"Le falta\" con stock ≈ 0 y venta de 12 meses entre 2.306 € y 10.525 € (hipótesis mía: inactivos).\n- (a) Código: si existe un campo de tipo de centro o de activo/inactivo y si el generador de propuestas lo usa.\n- (b) Datos: qué centros están realmente cerrados (maestro de centros).\n- Estará bien si: solo salen propuestas a centros activos de tipo tienda.\n\n**H4. Estacionalidad con un solo ciclo**\n- Vi: histórico desde 06/10/2025. Índices de neumáticos entre ×0,58 (Centro-P) y ×2,06 (Centro-Q) según el centro, en Cálculo del surtido. Cadenas de nieve en Stock muerto (90 días) en octubre.\n- (a) Código: cómo se calcula el índice, el mínimo de histórico exigido y la regla de \"stock muerto\".\n- (b) Datos: reproducir los índices y confirmar que solo hay un año.\n- Estará bien si: los índices con un solo ciclo se marcan de baja confianza y una familia estacional no pasa a \"muerta\" antes de su pico.\n\n**H5. Carga diaria y base de datos**\n- Vi: cargas automáticas fallidas el 11, 12 y 13/10 (Metabase 403 y 522, con el aviso de iniciar sesión a mano); base de datos 408,7 de 500 MB, con aviso a partir de 400 MB.\n- (a) Código: cómo se autentica la carga, si reintenta y qué guarda cada día.\n- (b) Datos: logs de carga, estado de Metabase el 13/10, tamaño real de la base y plan contratado. (Hipótesis mía: un 403 apunta a sesión caducada o permisos; un 522 suele ser un tiempo de espe             ${t.preferida ? `<span>Prefiere ${esc(t.preferida)}</span>` : ''}
            ${t.confianza != null ? `<span>Confianza ${t.confianza}/5</span>` : ''}
            ${t.nota_area != null ? `<span>Su área: ${t.nota_area}/10</span>` : ''}
            ${t.ruina ? `<span class="${/^(posible|probable)/i.test(t.ruina)?'bad':''}">Ruina: ${esc(t.ruina)}</span>` : ''}
          </div>
          ${t.movido ? `<p class="extra"><b>Qué le movió:</b> ${inline(t.movido.length > 260 ? t.movido.slice(0,260) + '…' : t.movido)}</p>` : ''}
          ${t.enmienda && !/^ninguna/i.test(t.enmienda) ? `<p class="extra"><b>Enmienda:</b> ${inline(t.enmienda.length > 260 ? t.enmienda.slice(0,260) + '…' : t.enmienda)}</p>` : ''}
          <details><summary>Ver la tarjeta completa</summary><div class="md">${md(t.md)}</div></details>
        </article>`;
      }
      h += `</div>`;
      if (e.presidente_md) h += `<div class="chair"><div class="t">El Presidente</div><div class="md">${md(e.presidente_md)}</div></div>`;
    } else {
      h += `<div class="doc md">${md(e.md)}</div>`;
    }
    h += `</section>`;
  }
  document.getElementById('contenido').innerHTML = h;

  document.getElementById('pie').innerHTML = `Simulación de puestos de trabajo: no son opiniones de personas reales.
    Generado el ${esc(D.generado)} · <a href="${esc(D.url)}">Última mesa</a> · <a href="${esc(D.url)}archivo/">Debates guardados</a>`;

  // El contenido se pinta con JS: si la URL trae #seccion, saltar a ella al terminar
  if (location.hash) setTimeout(() => { const s = document.getElementById(location.hash.slice(1)); if (s) s.scrollIntoView(); }, 80);

  // Paso activo en la navegación
  const enlaces = [...document.querySelectorAll('nav.steps a')];
  const obs = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) enlaces.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id));
  }), {rootMargin: '-40% 0px -55% 0px'});
  document.querySelectorAll('main section').forEach(s => obs.observe(s));

  // Mientras el debate está en curso, la página se recarga sola cada minuto
  if (D.estado === 'en curso') setTimeout(() => location.reload(), 60000);
})();
</script>
</body>
</html>
