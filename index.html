*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
a{color:var(--accent)}
header.top{padding:40px 0 24px}
.eyebrow{font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-size:clamp(24px,4vw,36px);line-height:1.15;margin:12px 0 10px;letter-spacing:-.02em}

.verdict .rec{font-size:13px;color:var(--ink-2);margin-top:6px}

.md hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}

.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px;box-shadow:var(--shadow)}
.chair{margin-top:16px;background:var(--panel-2);border-radius:12px;padding:16px 20px}

footer{padding:48px 0 40px;color:var(--ink-3);font-size:12px}

@media (max-width:720px){

  .doc{padding:16px}

}
</style>

ación con agentes.\n- **C. Reunión primero**: correo corto con 3 titulares y proponer verlo juntos.\n- **D. Piloto acotado**: proponer usarla solo en una zona o familia con condiciones antes de ampliar, adjuntando los hallazgos.\n- **E. No hacer nada de momento**: contestar solo con un \"gracias, lo estoy revisando\" y esperar.\n\n## Pesos\n| Consejero | Peso | Motivo |\n|---|---|---|\n| category | 3 | Buena parte del feedback es de surtido, ABC y estacionalidad |\n| it-datos | 3 | Calidad del dato, cargas, permisos y cómo verificar con agentes |\n| compras | 2 | Central, balizas y propuestas de reposición afectan a compras |\n| controller | 2 | Cifras que no cuadran y 0,8 M€ parados |\n| tienda | 2 | Usabilidad y volumen de propuestas para la red |\n| logistica | 1 | Traspasos y central, de refilón |\n| abogado-diablo | 1 | Postura asignada: defender el punto de vista de D. como destinatario superior que recibe el correo |\n"}, {"id": "ronda-1", "tipo": "ronda", "titulo": "Ronda 1 · Posiciones iniciales", "explicacion": "Cada consejero opina por separado, sin ver lo que dicen los demás.", "hora": "13/10/2026 13:34", "tarjetas": [{"slug": "compras", "nombre": "Compras", "postura": "Mando todo, A, pero ordenado por euros y con el aviso de que ninguna propuesta de traspaso o compra se ejecute hasta que los agentes de D. verifiquen los números. Esos números mueven stock real.", "puntuaciones": {"A": 8.0, "B": 7.0, "C": 4.0, "D": 6.0, "E": 2.0}, "preferida": "A", "confianza": 4.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Mando todo, A, pero ordenado por euros y con el aviso de que ninguna propuesta de traspaso o compra se ejecute hasta que los agentes de D. verifiquen los números. Esos números mueven stock real.\n\nPUNTUACIONES: A=8, B=7, C=4, D=6, E=2\n\nPREFERIDA: A\n\nARGUMENTOS:\n- **Central y V16: más de la mitad del stock y 0,85 M€ en una referencia.** El central (código 20) tiene 6,0 M€ de 11,8 M€, un 51 % del en pantalla\" o \"pendiente de verificar\", sin afirmar que es un fallo del sistema.\n- Pedir a los agentes de D. que verifiquen en el repositorio y además contrasten con el ERP y con contabilidad. Rubén debería hacer ese cruce de totales (11,8 M€, 4,6 M€, 6,0 M€) con una consulta sencilla antes de enviar, si puede.\n- Distinguir lo que hay que arreglar antes de usarla (carga automática, central, permisos y trazabilidad, centros activos) de lo que puede esperar a las siguientes versiones.\n- Ofrecer una sesión corta de 30 minutos para repasar los bloqueantes y proponer ayuda en la parte de datos e integración, sin criticar el prototipo.\n- No adjuntar capturas con datos de la red ni credenciales (supuesto: datos de cliente), salvo que D. lo autorice.\n\nPREGUNTA A OTRO CONSEJERO: A controller: ¿cuadra el stock total de 11,8 M€ con el stock valorado en contabilidad, y los 1,2 M€ de diferencia entre la lista de Almacenes y el resto de la red son un criterio distinto o un error?\n\nNOTA DE MI ÁREA: 8. Con B, los problemas de carga, calidad del dato y permisos quedan arriba y verificados por agentes; pierdo dos puntos porque aún falta el cruce con el ERP.\n\nCONFIANZA: 4"}, {"slug": "abogado-diablo", "nombre": "Abogado del diablo", "postura": "Defiendo a D. como lector. Un superior que recibe una crítica de su primera versión, para validar el enfoque, quiere saber qué decidir y qué hacer a continuación. No quiere una auditoría de 30 puntos. Mi opción es B, con las balizas y el almacén central como los dos casos que lo demuestran.", "puntuaciones": {"A": 4.0, "B": 8.0, "C": 6.0, "D": 3.0, "E": 2.0}, "preferida": "B", "confianza": 3.0, "nota_area": 8.0, "apoyo": null, "ruina": "no", "enmienda": "", "movido": "", "md": "POSTURA: Defiendo a D. como lector. Un superior que recibe una crítica de su primera versión, para validar el enfoque, quiere saber qué decidir y qué hacer a continuación. No quiere una auditoría de 30 puntos. Mi opción es B, con las balizas y el almacén central como los dos casos que lo demuestran.\n\nPUNTUACIONES: A=4, B=8, C=6, D=3, E=2\n\nPREFERIDA: B\n\nARGUMENTOS:\n- **Qué sentirá D. con A.** Pidió \"qué te parece, qué echas en falta o qué cambiarías\" de una primera versión. Recibe 7 bloques de hallazgos y cifras (0,85 M€ en balizas, 6,0 M€ en central, −49.045 € en Lunas, ~24 M€ de 39,5 M€ que no es producto). Lo leerá como un informe de auditoría que ya conocen otros, no como feedback de un colega. Es superior y la herramienta es suya: lo más probable es que se ponga a la defensiva o la archive hasta tener tiempo. Rubén dice que quiere que D. \"pueda presentarlo mejor\". Un correo largo con cifras sin contrastar con el ERP le deja a D. con el problema: no sabe cuáles son ciertos y cuáles son lectura errónea de la pantalla.\n- **Qué hará con el correo.** Con A, lo más probable es que D. lo pegue entero en Claude Code y le pida que lo arregle todo. Es cómodo para él, pero entonces Rubén deja de aportar criterio y el trabajo lo hace el agente. Un agente no distingue \"esto bloquea el uso\" de \"esto es mejorable\". Si D. solo puede enseñar a otros lo que sobreviva a esa verificación, prefiero que el correo ya llegue ordenado por gravedad. Con B, D. ve 3–5 problemas que cambian lo que puede enseñar y decide rápido. El anexo queda como material para sus agentes, sin obligarle a leerlo. Esto es lo que más le sirve para presentarla mejor y lo que más le acerca a seguir contando con Rubén.\n- **Qué lo vuelve más molesto o más útil.** Lo más molesto para D. es que su herramienta parezca no fiable ante terceros por algo que Rubén vio mal. Lo más útil es un correo que empiece por lo que está bien (cada pantalla explica su cálculo, hay exclusión de eventos, exportación, pantalla de estado), siga con lo grave y diga qué está contrastado y qué no. Mi selección de lo grave: (1) almacén central fuera del exceso y de la lista de almacenes, que cambia la lectura de 6,0 de 11,8 M€; (2) balizas V16 con propuesta de traspaso a un centro con stock negativo, que es un fallo visible y fácil de verificar; (3) centros inactivos encabezando \"Le falta\"; (4) carga diaria caída 3 días, que bloquea el uso real. La estacionalidad con un solo año es importante, pero D. ya sabe que no tiene más histórico. C (reunión) es buena, pero retrasa y desaprovecha un correo que ya está escrito. D (piloto) da a entender que no se fía de la herramienta antes de hablar con él. E desperdicia la invitación a opinar.\n\nRIESGO PRINCIPAL: Que B parezca que se esconde el resto de hallazgos si el anexo no se destaca y no se ofrece verlo juntos, o que D. lea los 3–5 puntos como \"lo bloqueante\" y desestime el anexo.\n\nRIESGO DE RUINA en la preferida: no. Se envía de todas formas, no se compromete nada, y el anexo recoge todo. El peor caso es un tono mal calibrado que enfríe la relación, y eso se corrige con la siguiente conversación.\n\nCONDICIONES:\n- Abrir con lo positivo, concreto y creíble, no de relleno.\n- Cada hallazgo de los 3–5 con qué se vio (pantalla, cifra), por qué importa y qué se sugiere. Marcar que Rubén lo leyó en pantalla sin contrastar con ERP ni contabilidad, para que no suene a sentencia.\n- Anexo claramente separado (\"para tus agentes, por si ayuda\"), no como adjunto obligatorio. La verificación en el repositorio se propone como una opción útil, no como \"pásalo a tus agentes\".\n- Cerrar con una oferta concreta, como \"te lo explico en 20 minutos con los ejemplos\" o \"lo cuadro con el ERP si me das lectura\".\n- Texto corto, sin juicios (\"falla\", \"mal\") sino hechos y cifras. Rubén lo aprueba antes de enviar.\n\nPREGUNTA A OTRO CONSEJERO: A it-datos: ¿cuántos de los 7 hallazgos son verificables en el repositorio sin acceso al ERP, y cuáles requieren contraste externo? Con eso decido qué de lo grave puede ir afirmado y qué debe ir marcado como \"visto en pantalla\".\n\nNOTA DE MI ÁREA: 8. El punto de vista de D. queda bien servido con B: recibe lo que importa, no se siente auditado y conserva el control de la conversación. No es 10 porque el anexo sigue siendo mucho material y D. es una persona con poco tiempo.\n\nCONFIANZA: 3"}], "presidente_md": "### Notas del Presidente\n\n**Puntuaciones provisionales (pesos: category 3, it-datos 3, compras 2, controller 2, tienda 2, logística 1, abogado 1; suma 14):**\n- A (7×3 + 8×3 + 8×2 + 7×2 + 5×2 + 6×1 + 4×1) / 14 = 95 / 14 = **6,8**\n- B (9×3 + 9×3 + 7×2 + 9×2 + 9×2 + 9×1 + 8×1) / 14 = 121 / 14 = **8,6**\n- C (3×3 + 4×3 + 4×2 + 4×2 + 6×2 + 4×1 + 6×1) / 14 = 59 / 14 = **4,2**\n- D (7×3 + 5×3 + 6×2 + 6×2 + 7×2 + 6×1 + 3×1) / 14 = 83 / 14 = **5,9**\n- E (1×3 + 1×3 + 2×2 + 2×2 + 2×2 + 1×1 + 2×1) / 14 = 21 / 14 = **1,5**\n\n**Control de unanimidad:** se dispara. 6 de 7 prefieren B y 5 de ellos le ponen 9 o 8 sin discutir. Alarma, no victoria. La mejor alternativa no defendida con fuerza es **A, que es la idea de Rubén**: solo Compras la prefiere, y los demás la penalizan con un argumento de \"D. no sabrá por dónde empezar\" que es una suposición sobre un lector que es superior y que tiene sus propios agentes de Claude Code. Quienes más tienen en juego: Compras (A) e IT-datos (la verificación por agentes).\n\n**Puntos de choque:**\n1. **Cuerpo corto + anexo (B) o todo en el cuerpo (A).** Es un choque de valores: legibilidad para D. contra que no se pierda nada. Compras defiende A; el resto B. Matiz abierto: ¿el anexo va en el mismo correo o como adjunto \"para tus agentes\"? (Compras: mismo correo; Abogado: adjunto separado, opcional.)\n2. **¿La verificación por agentes sirve?** Es un choque de hechos. IT-datos dice que un agente en el repositorio confirma la **lógica** (qué se calcula y qué se filtra) pero **no** si el dato coincide con el ERP o con contabilidad; Rubén no ha contrastado nada con ellos. Otros consejeros dan por hecho que los agentes \"verifican\" los hallazgos. Hay que separar qué es verificable en el repositorio y qué solo contra el ERP, y decidir si Rubén debe hacer un cruce de totales antes de enviar (IT-datos y Logística lo piden).\n3. **Qué va en el cuerpo.** Cada uno elige distinto: Category pone estacionalidad y deja la carga diaria en el anexo; IT-datos y el Abogado ponen la carga diaria arriba; Controller pone la venta mezclada con mano de obra. Coinciden en lo mismo solo en: central fuera del exceso, balizas V16 y centros inactivos.\n\n**Números abiertos:** los 1,2 M€ de diferencia entre Almacenes (4,6) + central (6,0) y los 11,8 M€ de la red (varios consejeros lo derivan de las cifras del brief; falta una explicación, y puede ser un criterio distinto y no un error). Hay supuestos discordantes que no se pueden comparar: Tienda usa 100 centros y Logística 60 activos. El \"≈108 días de cobertura frente a 276\" de Compras y el umbral del 1 % del Controller son supuestos de ellos, no datos.\n\n**Tarjetas con formato:** todas correctas. Ninguna malinterpretó el brief. Las cifras que aportan por su cuenta están marcadas como supuesto.\n\n**Para la ronda 2:**\n- **Compras** y **Abogado del diablo** defienden a fondo **A**. El Abogado cambia su postura asignada: ya no defiende a D. como lector, sino la idea de Rubén (completo + verificación por agentes), con el mejor argumento de por qué un superior con agentes preferiría todo el material.\n- **IT-datos** responde a la pregunta de 4 consejeros: qué hallazgos son verificables en el repositorio y cuáles solo contra el ERP, y qué cruce de totales debería hacer Rubén antes de enviar.\n- **Controller** responde a la pregunta de Compras y de IT-datos sobre los 1,2 M€.", "ponderadas": {"A": 6.8, "B": 8.6, "C": 4.2, "D": 5.9, "E": 1.5}}, {"id": "ronda-2", "tipo": "ronda", "titulo": "Ronda 2 · Debate", "explicacion": "Leen las tarjetas de los demás y los puntos de choque: responden, defienden su postura o cambian de opinión.", "hora": "13/10/2026 13:38", "tarjetas": [{"slug": "compras", "nombre": "Compras", "postura": "Sigo con A, pero cambia la forma. Propongo A ordenado: cuatro líneas arriba con lo que más pesa en
